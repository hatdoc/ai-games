# On every push that touches games/: deploy this repo to GitHub Pages, then add any
# new game folders to the blog (Gemini writes the title/summary/tags).
name: Publish games

on:
  push:
    branches: [main]
    paths: ['games/**']
  workflow_dispatch:

permissions:
  contents: write # commits recorded preview clips back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Every game needs a gameplay clip on its blog card; record any that are missing
      - name: Record missing preview clips
        run: |
          missing=$(for d in games/*/; do if [ -f "$d/index.html" ] && [ ! -f "$d/preview.webm" ]; then echo "$d"; fi; done)
          [ -z "$missing" ] && exit 0
          npm i --no-save playwright@1.63.0 # pinned: CI installs no lockfile
          npx playwright install --with-deps chromium ffmpeg
          node scripts/record-preview.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/*/preview.webm games/*/preview.jpg
          git commit -m "Record preview clips" && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Add new games to the blog
        run: node scripts/publish.mjs
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_REPO_TOKEN: ${{ secrets.BLOG_REPO_TOKEN }}
          BLOG_REPO: ${{ vars.BLOG_REPO }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
