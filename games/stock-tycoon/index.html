<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stock Tycoon</title>
<script src="../cloudsave.js" data-game="stock-tycoon" data-keys="stock-tycoon-save" data-whole="rev"></script>
<style>
  :root { --bg: #f4f5f7; --card: #fff; --text: #12161c; --muted: #6b7380; --line: #e3e6eb; --up: #0a9f5b; --down: #d93a34; --accent: #1f5eff; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { --bg: #0c0f14; --card: #161b22; --text: #eef1f5; --muted: #8b95a3; --line: #262d38; --up: #2fd08a; --down: #ff6259; --accent: #5b8bff; --on-accent: #0c0f14; } }
  :root[data-theme=dark] { --bg: #0c0f14; --card: #161b22; --text: #eef1f5; --muted: #8b95a3; --line: #262d38; --up: #2fd08a; --down: #ff6259; --accent: #5b8bff; --on-accent: #0c0f14; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  b, .num { font-variant-numeric: tabular-nums; }
  #app { height: 100%; display: grid; grid-template: 'head' auto 'main' 1fr 'nav' auto / minmax(0, 1fr); max-width: 1100px; margin: 0 auto; }
  header { grid-area: head; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  header .when { flex: 1; min-width: 0; }
  header .when b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  small, .label { color: var(--muted); font-size: 12px; display: block; }
  header .bal { text-align: right; }
  @media (max-width: 400px) { header .bal.cash { display: none; } }
  .round { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); flex: none; }
  main { grid-area: main; overflow-y: auto; padding: 16px; }
  main h1 { font-size: 22px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .5px; }
  .big { font-size: 34px; font-weight: 700; letter-spacing: -.5px; line-height: 1.15; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row b { text-align: right; }
  .muted { color: var(--muted); }
  .up { color: var(--up); } .down { color: var(--down); }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
  .cols .card { margin: 0; }
  .btn { background: var(--accent); color: var(--on-accent); min-height: 46px; padding: 0 18px; border-radius: 12px; font-weight: 700; flex: 1; }
  .btn.sell { background: none; border: 1px solid var(--line); color: var(--text); }
  .btn:disabled { opacity: .4; cursor: default; }
  .stock { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 0; border-top: 1px solid var(--line); text-align: left; }
  .stock:first-of-type { border-top: 0; }
  .stock .nm { flex: 1; min-width: 0; }
  .stock .nm b, .stock .nm small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .stock .px { text-align: right; }
  .news { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 11px 0; border-top: 1px solid var(--line); text-align: left; }
  .news:first-of-type { border-top: 0; }
  .news b { display: block; font-weight: 600; }
  .lv { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--muted); }
  .lv.Moderate { background: var(--accent); } .lv.Major { background: #e08a00; } .lv.Severe { background: var(--down); }
  .chips.wrap { flex-wrap: wrap; margin: 0 0 12px; }
  .chips.wrap button { flex: none; padding: 0 12px; border: 1px solid var(--line); }
  .article h1 { font-size: 24px; line-height: 1.25; margin: 4px 0 6px; }
  .article p { font-size: 16px; line-height: 1.55; margin: 12px 0 0; }
  .logo { width: 38px; height: 38px; border-radius: 10px; color: #fff; font-weight: 800; font-size: 13px; display: grid; place-items: center; flex: none; letter-spacing: .5px; }
  .logo.lg { width: 52px; height: 52px; font-size: 17px; border-radius: 14px; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .filters input, .filters #sort { grid-column: 1 / -1; }
  input, select { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); padding: 0 12px; width: 100%; min-width: 0; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .head .nm { flex: 1; min-width: 0; }
  .head .nm b { font-size: 18px; display: block; }
  canvas { width: 100%; height: 220px; display: block; touch-action: pan-y; cursor: crosshair; margin-top: 8px; }
  .chips { display: flex; gap: 4px; margin: 10px 0 0; }
  .chips button { flex: 1; min-height: 36px; border-radius: 8px; font-weight: 700; font-size: 13px; color: var(--muted); }
  .chips button[aria-pressed=true] { background: var(--bg); color: var(--text); }
  .buy { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .buy .btn { flex: 1 1 40%; }
  .mini { min-height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); font-weight: 600; font-size: 13px; }
  .warn { border-color: var(--down); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
  .stats .row:nth-of-type(2) { border-top: 0; }
  .stats .row { flex-direction: column; gap: 0; }
  .stats .row b { text-align: left; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); vertical-align: middle; }
  nav { grid-area: nav; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; min-height: 56px; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  nav button span { font-size: 20px; }
  nav button[aria-current=page] { color: var(--accent); font-weight: 700; }
  dialog { border: 0; border-radius: 18px; padding: 20px; width: min(460px, calc(100vw - 24px)); max-height: 88vh; background: var(--card); color: var(--text); }
  dialog::backdrop { background: #0008; }
  dialog h1 { font-size: 20px; margin: 0 0 4px; }
  dialog label { display: block; margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
  .two .btn { flex: none; min-height: 44px; }
  .err { color: var(--down); min-height: 20px; margin: 8px 0 0; font-size: 13px; }
  #toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; z-index: 9; }
  #toast.on { opacity: 1; }
  /* tablet and desktop: navigation becomes a sidebar, cards sit side by side */
  @media (min-width: 820px) {
    #app { grid-template: 'head head' auto 'nav main' 1fr / 200px minmax(0, 1fr); }
    nav { flex-direction: column; border-top: 0; border-right: 1px solid var(--line); padding: 12px 8px; gap: 4px; }
    nav button { flex: 0; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 14px; font-size: 15px; border-radius: 10px; min-height: 48px; }
    nav button[aria-current=page] { background: var(--bg); }
    main { padding: 24px; }
    .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
    canvas { height: 300px; }
    .filters { grid-template-columns: 2fr 1fr 1fr 1fr; }
    .filters input, .filters #sort { grid-column: auto; }
    .stats { grid-template-columns: repeat(4, 1fr); }
    .stats .row:nth-of-type(-n+4) { border-top: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="when"><b id="date"></b><small id="dayn"></small></div>
    <div class="bal cash"><small>Cash</small><b id="cash"></b></div>
    <div class="bal"><small>Net worth</small><b id="worth"></b></div>
    <button id="theme" class="round" aria-label="Switch light or dark theme">◐</button>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>
<dialog id="tradeDlg"></dialog>
<dialog id="sumDlg"></dialog>
<div id="toast" role="status"></div>

<script src="companies.js"></script>
<script src="events.js"></script>
<script src="engine.js"></script>
<script src="account.js"></script>
<script src="chart.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const money = (c) => (c / 100).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
const signed = (c) => (c > 0 ? '+' : '') + money(c);
const big = (dollars) => dollars.toLocaleString('en-US', { style: 'currency', currency: 'USD', notation: 'compact', maximumFractionDigits: 1 });
const pct = (x) => (x > 0 ? '+' : '') + (x * 100).toFixed(2) + '%';
const cls = (x) => (x > 0 ? 'up' : x < 0 ? 'down' : '');
const longDate = (day) => Account.date(day).toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const days = (n) => n + (n === 1 ? ' day' : ' days');
const LV = { Minor: 0, Moderate: 1, Major: 2, Severe: 3 };
const TABS = [['market', '📈', 'Market'], ['discover', '🔎', 'Discover'], ['news', '📰', 'News'], ['portfolio', '💼', 'Portfolio'], ['friends', '👥', 'Friends']];
const FRAME_NAME = { D: 'today', W: 'past week', M: 'past month', '6M': 'past 6 months', Y: 'past year', '5Y': 'past 5 years', MAX: 'since listing' };

// Today comes from the web server's clock (the Date header of this page), shifted to the player's timezone, so
// moving the device clock forward does not bring tomorrow's prices or payday closer.
// ponytail: falls back to the device clock when that request fails; the weekly challenge (Stage 7) gets real server checks.
let skew = 0;
const today = () => { const now = Date.now() + skew; return Account.dayNumber(now, new Date(now).getTimezoneOffset()); };
async function syncClock() {
  try {
    const r = await fetch(location.href, { method: 'HEAD', cache: 'no-store', signal: AbortSignal.timeout(2500) });
    const t = Date.parse(r.headers.get('date'));
    if (t) skew = t - Date.now();
  } catch {}
}

// s: the account. mkt: the market for the account's day. sym: the open stock page (or null). frame: chart timeframe.
let s, mkt, tab = 'market', sym = null, art = null, newsCat = 'All', frame = 'M', kind = 'line', disc = { q: '', sector: '', risk: '', sort: 'gain' }, trade = null;
const save = () => { if (!Account.save(localStorage, s)) toast('Could not save. Check your browser storage.'); };
const market = () => (mkt && mkt.day === s.day ? mkt : (mkt = Market.build(s.day)));

let toastT;
function toast(msg) { $('toast').textContent = msg; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 2200); }

// ---- pieces
const logo = (c, lg) => `<span class="logo ${lg ? 'lg' : ''}" style="background:hsl(${c.hue} 55% 40%)">${c.sym.slice(0, 2)}</span>`;
const stockRow = (c, sub) => {
  const on = mkt.trading(c), ch = mkt.change(c);
  return `<button class="stock" data-sym="${c.sym}">${logo(c)}<span class="nm"><b>${c.name}</b><small>${sub || `${c.sym} · ${c.sector}`}</small></span>
    <span class="px"><b>${on ? money(mkt.cents(c)) : 'Delisted'}</b><small class="${cls(ch)}">${on ? pct(ch) : 'Bankrupt'}</small></span></button>`;
};
const newsRow = (x) => `<button class="news" data-art="${x.id}"><span class="lv ${x.level}"></span><span><b>${x.title}</b><small>${x.d === s.day ? 'Today' : longDate(x.d)} · ${x.cat}${x.sym ? ' · ' + x.sym : ''} · ${x.level}</small></span></button>`;
const newsRows = (list, empty) => (list.length ? list.map(newsRow).join('') : `<p class="muted" style="margin:0">${empty}</p>`);
const mine = () => new Set([...Object.keys(s.holdings), ...Object.keys(s.shorts), ...s.watch]);
const NEWS_CATS = { All: () => true, 'My stocks': (x) => mine().has(x.sym), World: (x) => ['Global', 'Politics'].includes(x.cat), Economy: (x) => x.cat === 'Economy',
  Companies: (x) => ['Company', 'Industry', 'Deals'].includes(x.cat), Results: (x) => x.cat === 'Results', Rumours: (x) => x.cat === 'Rumour', Markets: (x) => x.cat === 'Markets' };
// what is coming: payday, the rate decision, and earnings reports for stocks the player holds or watches
const comingUp = () => { const n = Account.nextPayIn(s), items = [[s.day + n, `Payday: ${money(Account.SALARY)}`], [mkt.nextRates(), 'Interest rate decision']];
  for (const k in s.holdings) { const c = mkt.get(k), v = c && mkt.nextDividend(c); if (v) items.push([v.pay, `${c.name} dividend: ${money(v.cents * s.holdings[k].sh)}`]); }
  for (const k of mine()) { const c = mkt.get(k); if (c && mkt.trading(c) && mkt.nextReport(c) - s.day <= 21) items.push([mkt.nextReport(c), `${c.name} reports earnings`]); }
  return `<div class="card"><h2>Coming up</h2>${items.sort((a, b) => a[0] - b[0]).map(([d, t]) => `<div class="row"><span>${t}</span><b>${d - s.day === 1 ? 'Tomorrow' : 'in ' + days(d - s.day)}<small>${longDate(d)}</small></b></div>`).join('')}</div>`; };
const orderRow = (o) => `<div class="row"><span>${o.side === 'B' ? 'Buy' : 'Sell'} ${o.sh} ${o.k} at ${money(o.lim)}<small>placed ${longDate(o.d)} · expires ${longDate(o.exp)}</small></span><button class="mini" data-cancel="${o.id}">Cancel</button></div>`;
const rows = (list, empty) => (list.length ? list.map((c) => stockRow(c)).join('') : `<p class="muted" style="margin:0">${empty}</p>`);
const soon = (title, what, stage) => `<h1>${title}</h1><div class="card"><h2>Opens in Stage ${stage}</h2><p class="muted" style="margin:0">${what}</p></div>`;
const live = () => mkt.companies.filter((c) => mkt.trading(c));
// a bankrupt company stays visible for 90 days, or for as long as the player still holds it
const visible = () => mkt.companies.filter((c) => mkt.trading(c) || s.holdings[c.sym] || s.day - c.deadDay <= 90);
const positions = (d) => Account.holdingsValue(s, mkt, d) - Account.shortValue(s, mkt, d);
const dayMove = () => positions() - positions(s.day - 1);

const SORTS = {
  gain: ['Biggest gain today', (a, b) => mkt.change(b) - mkt.change(a)],
  loss: ['Biggest loss today', (a, b) => mkt.change(a) - mkt.change(b)],
  high: ['Highest price', (a, b) => mkt.px(b) - mkt.px(a)],
  low: ['Lowest price', (a, b) => mkt.px(a) - mkt.px(b)],
  cap: ['Largest company', (a, b) => mkt.cap(b) - mkt.cap(a)],
  yield: ['Highest dividend yield', (a, b) => mkt.yield(b) - mkt.yield(a)],
  growth: ['Fastest growing', (a, b) => b.growth - a.growth],
  vol: ['Most volatile', (a, b) => b.vol - a.vol],
  new: ['Newly listed', (a, b) => b.listDay - a.listDay],
  name: ['Name', (a, b) => a.name.localeCompare(b.name)],
};
function discoverList() {
  const q = disc.q.trim().toLowerCase();
  const list = visible().filter((c) => (!q || c.name.toLowerCase().includes(q) || c.sym.toLowerCase().includes(q)) && (!disc.sector || c.sec === disc.sector)
    && (!disc.risk || (disc.risk === 'low' ? c.risk <= 2 : disc.risk === 'mid' ? c.risk === 3 : c.risk >= 4))).sort(SORTS[disc.sort][1]);
  const sub = { yield: (c) => `Yield ${(mkt.yield(c) * 100).toFixed(1)}%`, cap: (c) => `Worth ${big(mkt.cap(c))}`, growth: (c) => `Growing ${(c.growth * 100).toFixed(0)}% a year`,
    vol: (c) => `${c.riskLabel} risk`, new: (c) => `Listed ${longDate(c.listDay)}` }[disc.sort];
  return list.length ? list.map((c) => stockRow(c, sub && `${c.sym} · ${sub(c)}`)).join('') : '<p class="muted" style="margin:0">No companies match.</p>';
}

const VIEWS = {
  market() {
    const mv = dayMove(), worth = Account.netWorth(s, mkt), idx = mkt.indexAt() / mkt.indexAt(s.day - 1) - 1, all = live().sort(SORTS.gain[1]);
    const held = [...Object.keys(s.holdings), ...Object.keys(s.shorts)].map((k) => mkt.get(k)).filter(Boolean), watch = s.watch.map((k) => mkt.get(k)).filter(Boolean);
    const lvl = Account.marginLevel(s, mkt);
    return `<h1>Today</h1>
    ${lvl < 0.4 ? `<div class="card warn"><b class="down">Margin warning</b><div>Your own money is ${(lvl * 100).toFixed(0)}% of what you have at stake. Below ${Account.MAINT * 100}% your positions are closed automatically. Sell, cover or wait for payday.</div></div>` : ''}
    <div class="cols">
      <div class="card"><h2>Net worth</h2><div class="big num">${money(worth)}</div>
        <div class="${cls(mv)}">${held.length ? `${signed(mv)} today on your stocks` : '<span class="muted">All in cash. Pick a company to invest in.</span>'}</div></div>
      <div class="card"><h2>MRX Composite</h2><div class="big num">${mkt.indexAt().toFixed(0)}</div>
        <div><span class="${cls(idx)}">${pct(idx)} today</span> <span class="muted">· ${live().length} companies</span></div></div>
    </div>
    <div class="card"><h2>Today's news</h2>${newsRows(mkt.news.filter((x) => x.d === s.day).sort((a, b) => LV[b.level] - LV[a.level]).slice(0, 6), 'A quiet day. No major news.')}</div>
    ${held.length ? `<div class="card"><h2>Your stocks</h2>${rows(held)}</div>` : ''}
    ${watch.length ? `<div class="card"><h2>Watchlist</h2>${rows(watch)}</div>` : ''}
    <div class="cols">
      <div class="card"><h2>Top gainers</h2>${rows(all.slice(0, 5))}</div>
      <div class="card"><h2>Top losers</h2>${rows(all.slice(-5).reverse())}</div>
    </div>
    <div class="cols">
      <div class="card"><h2>Economy</h2>
        <div class="row"><span>Phase</span><b>${mkt.regime}</b></div>
        <div class="row"><span>Interest rate</span><b>${mkt.rate.toFixed(2)}%</b></div>
        <div class="row"><span>Inflation</span><b>${mkt.infl.toFixed(1)}%</b></div>
      </div>
      ${comingUp()}
    </div>`;
  },
  discover: () => `<h1>Discover</h1>
    <div class="filters">
      <input id="q" type="search" placeholder="Search name or ticker" value="${disc.q.replace(/[&<>"]/g, '')}" aria-label="Search companies">
      <select id="sector" aria-label="Industry"><option value="">All industries</option>${Object.entries(Companies.SECTORS).map(([k, v]) => `<option value="${k}" ${disc.sector === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select>
      <select id="risk" aria-label="Risk">${[['', 'Any risk'], ['low', 'Low risk'], ['mid', 'Medium risk'], ['high', 'High risk']].map(([k, v]) => `<option value="${k}" ${disc.risk === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <select id="sort" aria-label="Sort by">${Object.entries(SORTS).map(([k, v]) => `<option value="${k}" ${disc.sort === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select>
    </div>
    <div class="card" id="list">${discoverList()}</div>`,
  news: () => `<h1>News</h1>
    <div class="chips wrap" id="cats">${Object.keys(NEWS_CATS).map((k) => `<button data-cat="${k}" aria-pressed="${k === newsCat}">${k}</button>`).join('')}</div>
    <div class="card">${newsRows(mkt.news.filter(NEWS_CATS[newsCat]).slice(-80).reverse(), 'Nothing here yet.')}</div>`,
  article() {
    const x = mkt.news[art], c = x.sym && mkt.get(x.sym), since = c && mkt.px(c, x.d - 1) ? mkt.px(c) / mkt.px(c, x.d - 1) - 1 : null;
    const related = mkt.news.filter((y) => y.id !== x.id && (x.sym ? y.sym === x.sym : !y.sym && (y.kind === x.kind || y.cat === x.cat))).slice(-4).reverse();
    return `<div class="head"><button class="round" data-act="back" aria-label="Back">←</button><div class="nm"><small>${x.cat} · ${x.level} importance</small></div></div>
    <div class="card article"><small>${longDate(x.d)}</small><h1>${x.title}</h1><p>${x.body}</p></div>
    ${x.cat === 'Rumour' ? `<div class="card"><h2>How far to trust this</h2><p style="margin:0">Source reliability: <b>${Events.SOURCES[x.rumour][1]}</b>. Rumours are sometimes true, sometimes exaggerated and sometimes false. If it is real, an announcement usually follows within a week; if not, expect a denial.</p></div>` : ''}
    <div class="card"><h2>Market impact</h2><p style="margin:0">${x.impact}</p></div>
    ${c ? `<div class="card"><h2>Related company</h2>${stockRow(c)}${since === null ? '' : `<div class="row"><span>Price move since the day before this story</span><b class="${cls(since)}">${mkt.trading(c) ? pct(since) : 'Delisted'}</b></div>`}</div>` : ''}
    ${x.secs && x.secs.length ? `<div class="card"><h2>Industries affected</h2><p style="margin:0">${x.secs.map((k) => Companies.SECTORS[k][0]).join(', ')}</p></div>` : ''}
    <div class="card"><h2>Related stories</h2>${newsRows(related, 'No related stories.')}</div>`;
  },
  portfolio() {
    const hv = Account.holdingsValue(s, mkt), sv = Account.shortValue(s, mkt), cost = Object.values(s.holdings).reduce((a, h) => a + h.cost, 0);

function drawChart() {
  const c = mkt.get(sym), since = (ch, diff, note) => `<span class="${cls(ch)}">${signed(Math.round(diff * 100))} (${pct(ch)})</span> <span class="muted">${note}</span>`;
  if (kind === 'candle') {
    const bars = mkt.candles(c, frame), first = bars[0].o;
    const show = (b) => {
      const v = (b || bars[bars.length - 1]).c;
      $('cpx').textContent = money(Math.round(v * 100));
      $('cch').innerHTML = b ? `<span class="muted">${frame === 'D' ? 'during the day' : longDate(b.d)} · open ${b.o.toFixed(2)} · high ${b.h.toFixed(2)} · low ${b.l.toFixed(2)} · close ${b.c.toFixed(2)}</span>` : since(v / first - 1, v - first, FRAME_NAME[frame]);
    };
    show(null);
    return Chart.candles($('chart'), bars, show);
  }
  const pts = mkt.series(c, frame);
  const show = (p) => {
    const v = p ? p.v : pts[pts.length - 1].v;
    $('cpx').textContent = money(Math.round(v * 100));
    $('cch').innerHTML = since(pts[0].v ? v / pts[0].v - 1 : 0, v - pts[0].v, p ? longDate(p.d) + (frame === 'D' ? ' · during the day' : '') : FRAME_NAME[frame]);
  };
  show(null);
  Chart.attach($('chart'), pts, show);
}

function drawWorth() {
  const pts = [...s.worth.map(([d, v]) => ({ d, v: v / 100 })), { d: s.day, v: Account.netWorth(s, mkt) / 100 }];
  const show = (p) => {
    const v = p ? p.v : pts[pts.length - 1].v, ch = v / pts[0].v - 1;
    $('wpx').textContent = money(Math.round(v * 100));
    $('wch').innerHTML = `<span class="${cls(ch)}">${signed(Math.round((v - pts[0].v) * 100))} (${pct(ch)})</span> <span class="muted">${p ? longDate(p.d) : 'since ' + longDate(pts[0].d) + ', salary included'}</span>`;
  };
  show(null);
  if ($('wchart')) Chart.attach($('wchart'), pts, show);
}

function render() {
  market();
  if (sym && !mkt.get(sym)) sym = null;
  if (art !== null && !mkt.news[art]) art = null;
  $('date').textContent = longDate(s.day);
  $('dayn').textContent = 'Day ' + Account.dayCount(s);
  $('cash').textContent = money(s.cash);
  $('worth').textContent = money(Account.netWorth(s, mkt));
  $('nav').innerHTML = TABS.map(([id, em, name]) => `<button data-tab="${id}" ${id === tab ? 'aria-current="page"' : ''}><span>${em}</span>${name}</button>`).join('');
  const v = art !== null ? 'article' : sym ? 'stock' : tab;
  $('view').innerHTML = VIEWS[v]();
  if (v === 'stock') drawChart();
  if (v === 'portfolio') drawWorth();
}

// ---- buy and sell
const WORDS = { buy: 'Buy', sell: 'Sell', short: 'Short', cover: 'Cover' };
const trow = (k, v, c = '') => `<div class="row"><span>${k}</span><b class="${c}">${v}</b></div>`;
function openTrade(mode) {
  trade = { mode, limit: false }; const c = mkt.get(sym);
  $('tradeDlg').innerHTML = `<h1>${WORDS[mode]} ${c.name}</h1><p class="muted" style="margin:0">${c.sym} · ${money(mkt.cents(c))} a share</p>
    ${mode === 'buy' || mode === 'sell' ? `<div class="chips" id="otype"><button data-otype="market" aria-pressed="true">At today's price</button><button data-otype="limit" aria-pressed="false">Limit order</button></div>` : ''}
    <div class="two"><label>Shares<input id="tq" type="number" inputmode="numeric" min="1" step="1" placeholder="0"></label>
      <label>or amount in $<input id="ta" type="number" inputmode="decimal" min="0" step="any" placeholder="0.00"></label>
      <button class="btn sell" data-max>Max</button></div>
    <label id="tlwrap" hidden>Limit price in $<input id="tl" type="number" inputmode="decimal" min="0.01" step="0.01"></label>
    <div id="tsum" style="margin-top:12px"></div><p class="err" id="terr"></p>
    <div style="display:flex;gap:10px"><button class="btn sell" data-close>Cancel</button><button class="btn" id="tgo">${WORDS[mode]}</button></div>`;
  updateTrade(); $('tradeDlg').showModal(); $('tq').focus();
}
// the price this sheet is working with: the limit price for a limit order, today's price otherwise
const tradePx = () => (trade.limit ? Math.round(+$('tl').value * 100) || 0 : mkt.cents(mkt.get(sym)));
function updateTrade() {
  const px = mkt.cents(mkt.get(sym)), at = tradePx(), sh = Math.floor(+$('tq').value) || 0, total = sh * at, mode = trade.mode;
  const h = s.holdings[sym], sp = s.shorts[sym], bp = Account.buyingPower(s, mkt), fine = (t) => `<p class="muted" style="margin:8px 0 0;font-size:13px">${t}</p>`;
  let html = '', err = '';
  if (trade.limit) {
    html = trow(mode === 'buy' ? 'Buys when the price falls to' : 'Sells when the price rises to', money(at)) + trow(mode === 'buy' ? 'Cost if it fills' : 'You receive if it fills', money(total))
      + fine(`It can fill from tomorrow, for ${Account.ORDER_DAYS} days. If the price jumps past your limit overnight, you get the better price. ${mode === 'buy' ? 'Your cash is checked again when it fills.' : ''}`);
    if (!at) err = 'Enter a limit price.'; else if (mode === 'sell' && (!h || sh > h.sh)) err = `You only own ${h ? h.sh : 0}.`;
  } else if (mode === 'buy') {
    const after = s.cash - total;
    html = trow('Total cost', money(total)) + (after >= 0 ? trow('Cash left', money(after)) : trow('Borrowed after this', money(-after), 'down') + fine(`Loans cost the central bank rate plus ${Account.LOAN_SPREAD}% a year, charged daily.`));
    if (total > bp) err = `${s.adv ? 'Your buying power covers' : 'You can afford'} ${Math.floor(bp / px)} shares at most.`;
  } else if (mode === 'sell') {
    const pl = Math.round(total - (h ? h.cost / h.sh : 0) * sh);
    html = trow('You own', `${h ? h.sh : 0} shares`) + trow('You receive', money(total)) + trow('Profit or loss on this sale', signed(pl), cls(pl));
    if (h && sh > h.sh) err = `You only own ${h.sh}.`;
  } else if (mode === 'short') {
    html = trow('You receive now', money(total)) + trow('Buying power left', money(Math.max(0, bp - total)))
      + fine(`You sell borrowed shares and must buy them back later. You profit if the price falls and lose if it rises, with no limit on the loss. Borrowing costs ${Account.SHORT_FEE}% a year, and you pay any dividend.`);
    if (total > bp) err = `Your buying power covers ${Math.floor(bp / px)} shares at most.`;
  } else {
    const pl = sp ? Math.round(sp.got * sh / sp.sh - total) : 0;
    html = trow('You are short', `${sp ? sp.sh : 0} shares`) + trow('Cost to buy back', money(total)) + trow('Profit or loss on this cover', signed(pl), cls(pl));
    if (sp && sh > sp.sh) err = `You are only short ${sp.sh}.`;
  }
  $('tsum').innerHTML = html; $('terr').textContent = err;
  $('tgo').disabled = sh <= 0 || !!err;
}
$('tradeDlg').oninput = (e) => {
  if (e.target.id === 'ta') $('tq').value = Math.floor(+$('ta').value * 100 / (tradePx() || 1)) || '';
  else if (e.target.id === 'tq') $('ta').value = '';
  updateTrade();
};
$('tradeDlg').onclick = (e) => {
  if (e.target === $('tradeDlg') || e.target.closest('[data-close]')) return $('tradeDlg').close();
  const ot = e.target.closest('[data-otype]');
  if (ot) {
    trade.limit = ot.dataset.otype === 'limit'; for (const b of $('otype').children) b.setAttribute('aria-pressed', b === ot);
    $('tlwrap').hidden = !trade.limit; if (trade.limit && !$('tl').value) $('tl').value = (mkt.cents(mkt.get(sym)) / 100).toFixed(2);
    $('tgo').textContent = trade.limit ? 'Place order' : WORDS[trade.mode];
    return updateTrade();
  }
  if (e.target.closest('[data-max]')) {
    const m = trade.mode, at = tradePx() || 1;
    $('tq').value = m === 'sell' ? (s.holdings[sym] || { sh: 0 }).sh : m === 'cover' ? (s.shorts[sym] || { sh: 0 }).sh : Math.floor(Account.buyingPower(s, mkt) / at);
    $('ta').value = ''; return updateTrade();
  }
  if (e.target.id !== 'tgo') return;
  const sh = Math.floor(+$('tq').value), m = trade.mode, lim = tradePx();
  if (catchUp()) return; // midnight passed while the sheet was open: prices changed, so nothing is traded
  const r = trade.limit ? Account.placeOrder(s, market(), sym, m === 'buy' ? 'B' : 'S', sh, lim) : Account[m](s, market(), sym, sh);
  if (!r.ok) { $('terr').textContent = r.error; return; }
  save(); $('tradeDlg').close(); render();
  toast(trade.limit ? `Limit order placed: ${m} ${sh} ${sym} at ${money(lim)}` : m === 'buy' ? `Bought ${sh} ${sym} for ${money(r.total)}` : m === 'short' ? `Shorted ${sh} ${sym} for ${money(r.total)}`
    : `${m === 'sell' ? 'Sold' : 'Covered'} ${sh} ${sym} · ${signed(r.pl)}`);
};

// Bring the account up to today; if days went by, say what happened while the player was away. Returns true if the day changed.
function catchUp() {
  const t = today();
  if (t <= s.day) return false;
  const from = s.day, before = Account.netWorth(s, market()), atStake = Account.exposure(s, mkt), held = [...Object.keys(s.holdings), ...Object.keys(s.shorts)];
  mkt = Market.build(t);
  const r = Account.tick(s, t, mkt);
  save(); render();
  const move = Account.netWorth(s, mkt) - before - r.pay, idx = mkt.indexAt() / mkt.indexAt(from) - 1;
  const moves = held.map((k) => mkt.get(k)).filter((c) => c && mkt.px(c, from)).map((c) => ({ c, ch: mkt.px(c) / mkt.px(c, from) - 1 })).sort((a, b) => b.ch - a.ch);
  const bust = moves.filter((m) => !mkt.trading(m.c)), own = mine();
  const away = mkt.news.filter((x) => x.d > from && (own.has(x.sym) ? x.level !== 'Minor' || x.cat === 'Rumour' : !x.sym && LV[x.level] >= 2)).sort((a, b) => LV[b.level] - LV[a.level] || b.d - a.d).slice(0, 3);
  $('tradeDlg').close();
  $('sumDlg').innerHTML = `<h1>${r.days === 1 ? 'A new day' : days(r.days) + ' went by'}</h1><p class="muted" style="margin:0 0 8px">${longDate(s.day)}</p>
    <div class="row"><span>MRX Composite</span><b class="${cls(idx)}">${pct(idx)}</b></div>
    ${held.length ? `<div class="row"><span>Your investments</span><b class="${cls(move)}">${signed(move)}${atStake ? ` (${pct(move / atStake)})` : ''}</b></div>` : ''}
    ${r.liquidated.length ? `<div class="row"><span class="down">Margin call: ${r.liquidated.map((x) => `${x.short ? 'covered' : 'sold'} ${x.sh} ${x.k}`).join(', ')}. Your own money fell below ${Account.MAINT * 100}% of what you had at stake.</span></div>` : ''}
    ${r.squeezed.map((x) => `<div class="row"><span>${x.k} went bankrupt while you were short</span><b class="up">${signed(x.pl)}</b></div>`).join('')}
    ${r.fills.map((o) => `<div class="row"><span>Limit order filled: ${o.side === 'B' ? 'bought' : 'sold'} ${o.sh} ${o.k}</span><b>${money(o.px)} each</b></div>`).join('')}
    ${r.dropped.map((o) => `<div class="row"><span class="muted">Limit order to ${o.side === 'B' ? 'buy' : 'sell'} ${o.sh} ${o.k} was dropped: ${o.why}.</span></div>`).join('')}
    ${r.costs ? `<div class="row"><span>Interest and borrow fees</span><b class="down">-${money(r.costs)}</b></div>` : ''}
    ${moves.length > 1 ? `<div class="row"><span>Best: ${moves[0].c.name}</span><b class="${cls(moves[0].ch)}">${pct(moves[0].ch)}</b></div>
      <div class="row"><span>Worst: ${moves.at(-1).c.name}</span><b class="${cls(moves.at(-1).ch)}">${pct(moves.at(-1).ch)}</b></div>` : ''}
    ${bust.map((m) => `<div class="row"><span class="down">${m.c.name} went bankrupt. Your shares are worthless.</span></div>`).join('')}
    ${away.length ? `<div class="row" style="display:block"><span class="muted">Biggest news while you were away</span>${away.map(newsRow).join('')}</div>` : ''}
    ${r.div ? `<div class="row"><span>Dividends</span><b class="${cls(r.div)}">${signed(r.div)}</b></div>` : ''}
    ${r.pay ? `<div class="row"><span>${r.paydays > 1 ? r.paydays + ' paydays' : 'Payday'}</span><b class="up">+${money(r.pay)}</b></div>` : ''}
    <div class="row"><span>Net worth</span><b>${money(Account.netWorth(s, mkt))}</b></div>
    <div class="row"><span>Next payday</span><b>in ${days(Account.nextPayIn(s))}</b></div>
    <div style="display:flex;margin-top:14px"><button class="btn" data-close>Continue</button></div>`;
  if (!$('sumDlg').open) $('sumDlg').showModal();
  return true;
}

$('nav').onclick = (e) => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; sym = null; art = null; render(); $('view').scrollTop = 0; } };
$('view').onclick = (e) => {
  const t = e.target.closest('[data-sym],[data-frame],[data-act],[data-art],[data-cat],[data-cancel]'); if (!t) return;
  if (t.dataset.cancel) { Account.cancelOrder(s, +t.dataset.cancel); save(); render(); return toast('Order cancelled'); }
  if (t.dataset.sym) { sym = t.dataset.sym; art = null; render(); $('view').scrollTop = 0; }
  else if (t.dataset.art) { art = +t.dataset.art; render(); $('view').scrollTop = 0; }
  else if (t.dataset.cat) { newsCat = t.dataset.cat; render(); }
  else if (t.dataset.frame) { frame = t.dataset.frame; for (const b of $('frames').children) b.setAttribute('aria-pressed', b === t); drawChart(); }
  else if (t.dataset.act === 'back') { if (art !== null) art = null; else sym = null; render(); }
  else if (t.dataset.act === 'kind') { kind = kind === 'line' ? 'candle' : 'line'; t.textContent = kind === 'line' ? 'Candles' : 'Line'; drawChart(); }
  else if (t.dataset.act === 'adv-on' || t.dataset.act === 'adv-off') { const r = Account.setAdvanced(s, mkt, t.dataset.act === 'adv-on'); if (r.ok) { save(); render(); } toast(r.ok ? `Advanced trading is ${s.adv ? 'on' : 'off'}` : r.error); }
  else if (t.dataset.act === 'watch') { toast(Account.toggleWatch(s, sym) ? 'Added to your watchlist' : 'Removed from your watchlist'); save(); render(); }
  else if (t.dataset.act === 'writeoff') { const r = Account.writeOff(s, mkt, sym); if (r.ok) { save(); render(); toast(`Written off · ${signed(r.pl)}`); } }
  else openTrade(t.dataset.act);
};
$('view').oninput = (e) => { if (!(e.target.id in disc)) return; disc[e.target.id] = e.target.value; $('list').innerHTML = discoverList(); };
$('sumDlg').onclick = (e) => {
  const a = e.target.closest('[data-art]');
  if (a) { art = +a.dataset.art; $('sumDlg').close(); render(); $('view').scrollTop = 0; }
  else if (e.target === $('sumDlg') || e.target.closest('[data-close]')) $('sumDlg').close();
};
$('theme').onclick = () => {
  const dark = (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('stock-tycoon-theme', document.documentElement.dataset.theme); } catch {}
  redraw();
};
try { const t = localStorage.getItem('stock-tycoon-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
// redraw only the chart: a full render would drop the keyboard focus when a phone keyboard resizes the page
const redraw = () => { if (!s || art !== null) return; if (sym) drawChart(); else if (tab === 'portfolio') drawWorth(); };
addEventListener('resize', redraw);
window.cloudSaveChanged = () => { s = Account.load(localStorage) || s; render(); catchUp(); }; // a newer save arrived from another device

syncClock().then(() => {
  s = Account.load(localStorage);
  if (!s) { s = Account.fresh(today()); save(); }
  render(); catchUp();
  setInterval(catchUp, 30000); // the page was left open past midnight
  addEventListener('visibilitychange', () => { if (!document.hidden) catchUp(); });
});
</script>
</body>
</html>
