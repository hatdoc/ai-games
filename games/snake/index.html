<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 16px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; touch-action: none; }
  canvas { background: #1b1b1b; border-radius: 8px; max-width: 95vmin; max-height: 80vmin; aspect-ratio: 1; }
  #home { color: #999; text-decoration: none; font-size: 14px; }
  #lb { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #000d; padding: 14px; border-radius: 14px; }
  #lb[hidden] { display: none; }
  #hud { display: flex; gap: 24px; } #msg { color: #999; font-size: 14px; }
</style>
</head>
<body>
<a id="home" href="https://rank-game.com/">← Home</a>
<script>if (top !== self) home.remove();</script>
<div id="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
<canvas id="c" width="400" height="400"></canvas>
<div id="msg">Arrow keys / WASD or swipe to start</div>
<div id="lb" hidden></div>
<div id="ad"></div>
<script src="../leaderboard.js"></script>
<script src="../ad.js"></script>
<script>adBanner(document.getElementById('ad'));</script>
<script>
const N = 20, S = 20, ctx = c.getContext('2d'), lb = leaderboard(document.getElementById('lb'), 'snake');
const DIRS = { ArrowUp: [0,-1], w: [0,-1], ArrowDown: [0,1], s: [0,1], ArrowLeft: [-1,0], a: [-1,0], ArrowRight: [1,0], d: [1,0] };
let best = +(localStorage.getItem('snake-best') || 0), snake, dir, next, food, score, alive, timer, particles = [];
document.getElementById('best').textContent = best;

function reset() {
  snake = [[10,10],[9,10],[8,10]]; dir = [1,0]; next = dir; score = 0; alive = true;
  placeFood(); setScore(0); msg.textContent = ''; document.getElementById('lb').hidden = true;
  clearInterval(timer); timer = setInterval(tick, 110);
}
function placeFood() {
  do food = [Math.random()*N|0, Math.random()*N|0]; while (snake.some(([x,y]) => x === food[0] && y === food[1]));
}
function setScore(v) { score = v; document.getElementById('score').textContent = v; }
function turn(d) {
  if (!alive) return reset();
  if (d[0] !== -dir[0] || d[1] !== -dir[1]) next = d;
}
function tick() {
  dir = next;
  const head = [(snake[0][0] + dir[0] + N) % N, (snake[0][1] + dir[1] + N) % N];
  if (snake.some(([x,y]) => x === head[0] && y === head[1])) return gameOver();
  snake.unshift(head);
  if (head[0] === food[0] && head[1] === food[1]) {
    setScore(score + 1);
    for (let i = 0; i < 14; i++) particles.push({ x: head[0]*S+S/2, y: head[1]*S+S/2, vx: Math.random()*6-3, vy: Math.random()*6-3, life: 1 });
    placeFood();
  } else snake.pop();
}
function gameOver() {
  alive = false; clearInterval(timer);
  if (score > best) { best = score; try { localStorage.setItem('snake-best', best); } catch {} document.getElementById('best').textContent = best; }
  document.getElementById('lb').hidden = false; lb.show(score);
  msg.textContent = `Game over — score ${score}. Press any arrow / swipe to retry`;
}
function draw() {
  ctx.clearRect(0, 0, 400, 400);
  const glow = 0.6 + 0.4*Math.sin(performance.now()/150);
  ctx.fillStyle = `rgba(255,90,90,${glow})`; ctx.beginPath();
  if (food) ctx.arc(food[0]*S+S/2, food[1]*S+S/2, S/2.6, 0, Math.PI*2); ctx.fill();
  snake?.forEach(([x,y], i) => {
    ctx.fillStyle = `hsl(${140 - i*3}, 70%, ${alive ? 55 : 30}%)`;
    ctx.fillRect(x*S+1, y*S+1, S-2, S-2);
  });
  particles = particles.filter(p => (p.life -= 0.04) > 0);
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; ctx.fillStyle = `rgba(255,200,90,${p.life})`; ctx.fillRect(p.x, p.y, 3, 3); });
  requestAnimationFrame(draw);
}
addEventListener('keydown', e => { const d = DIRS[e.key]; if (d) { e.preventDefault(); turn(d); } });
let t0;
addEventListener('touchstart', e => t0 = e.touches[0], { passive: true });
addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return alive === undefined || !alive ? reset() : null;
  turn(Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]);
});
alive = false; draw();
</script>
</body>
</html>
