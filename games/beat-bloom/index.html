<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Beat Bloom</title>
<script src="../cloudsave.js" data-game="beat-bloom" data-keys="beatbloom-save"></script>
<style>
  :root { --ink: #f4f1ff; --mut: #a9a3c9; --panel: rgba(18, 12, 38, .78); --line: rgba(255, 255, 255, .14); --acc: #ff5fa8; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0718; color: var(--ink);
    font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(0, 0, 0, .45); }
  button { font: inherit; color: inherit; cursor: pointer; }
  #home { position: fixed; top: 10px; left: 10px; color: var(--ink); text-decoration: none; font-weight: 800; font-size: 13px; padding: 6px 10px; z-index: 5; }
  /* song select */
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding: 56px 12px 24px; box-sizing: border-box; }
  #menu h1 { margin: 0; font-size: clamp(38px, 8vw, 70px); font-weight: 900; letter-spacing: 2px; font-style: italic;
    background: linear-gradient(90deg, #ff5fa8, #ffd36a, #6ff0ff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 20px rgba(255, 95, 168, .45)); }
  #menu .tag { color: var(--mut); margin: 2px 0 14px; font-weight: 600; text-align: center; }
  #stats { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
  .pill { padding: 6px 12px; font-weight: 800; font-size: 13px; }
  .pill b { color: #ffd36a; }
  #songs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; width: min(1100px, 100%); }
  .song { display: flex; gap: 12px; padding: 10px; align-items: center; position: relative; overflow: hidden; }
  .song canvas { width: 96px; height: 96px; border-radius: 12px; flex: none; }
  .song .info { flex: 1; min-width: 0; }
  .song .ttl { font-weight: 900; font-size: 17px; }
  .song .meta { color: var(--mut); font-size: 12px; margin: 2px 0 8px; }
  .diffs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .diffs button { flex: 1; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); border-radius: 10px; padding: 6px 0 5px; font-weight: 800; font-size: 12px; line-height: 1.2; }
  .diffs button small { display: block; font-size: 11px; color: #ffd36a; font-weight: 800; min-height: 13px; }
  .diffs button:hover:not(:disabled) { border-color: rgba(255, 255, 255, .45); background: rgba(255, 255, 255, .1); }
  .diffs button:disabled { opacity: .35; cursor: default; }
  .lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 6, 24, .72); font-weight: 900; border-radius: 16px; }
  #settings { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 16px; padding: 10px 14px; font-size: 13px; font-weight: 700; color: var(--mut); }
  #settings label { display: flex; align-items: center; gap: 8px; }
  #settings input { accent-color: #ff5fa8; width: 110px; }
  #settings b { color: var(--ink); min-width: 46px; display: inline-block; }
  .keys { color: var(--mut); font-size: 12px; margin-top: 10px; text-align: center; }
  kbd { background: rgba(255, 255, 255, .12); border-radius: 5px; padding: 1px 6px; font-weight: 800; color: var(--ink); }
  /* in-game */
  #pauseBtn { position: fixed; top: 10px; right: 10px; padding: 7px 12px; font-weight: 800; z-index: 5; }
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6, 3, 16, .6); padding: 12px; z-index: 6; }
  .modal.on { display: flex; }
  .panel { width: min(430px, 100%); max-height: calc(100dvh - 24px); overflow-y: auto; padding: 20px; box-sizing: border-box; text-align: center; }
  .grade { font-size: 84px; font-weight: 900; line-height: 1; font-style: italic; margin: 4px 0; }
  .big { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .row { display: flex; justify-content: center; gap: 14px; margin: 10px 0; font-weight: 800; font-size: 13px; }
  .row span { display: flex; flex-direction: column; } .row small { color: var(--mut); font-size: 11px; }
  .cta { width: 100%; border: 0; border-radius: 12px; padding: 13px; font-weight: 900; font-size: 16px; margin-top: 10px; background: linear-gradient(90deg, #ff5fa8, #ff9a5a); color: #fff; }
  .ghost { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px; font-weight: 800; margin-top: 8px; background: none; }
  #lb { margin: 12px auto 0; }
  .newbest { color: #ffd36a; font-weight: 900; letter-spacing: 1px; }
</style>
</head>

</div></div>

  const bars = 14; for (let i = 0; i < bars; i++) { const bh = h * (0.12 + 0.4 * Math.abs(Math.sin(i * 1.7 + song.bpm))); g.fillStyle = `hsla(${hue + 180},90%,85%,.75)`; g.fillRect(i * w / bars + 1, h - bh, w / bars - 2, bh); }

  g.fillStyle = '#fff'; g.font = `900 ${w * 0.13}px system-ui`; g.fillText(song.title.split(' ')[0].toUpperCase(), w * 0.07, h * 0.8);

const JUDGE = [{ name: 'PERFECT', win: 0.045, val: 1, col: '#ffe680' }, { name: 'GREAT', win: 0.09, val: 0.8, col: '#7dffb0' }, { name: 'GOOD', win: 0.14, val: 0.45, col: '#7fc8ff' }];

function start(song, diff) {

  G = { song, diff, music, notes, idx: 0, sched: 0, t0: ac.currentTime + 2.2, score: 0, combo: 0, maxCombo: 0, counts: [0, 0, 0, 0], perNote: 1e6 / notes.length, hp: 100,

const outLat = () => (ac.outputLatency || ac.baseLatency || 0);

function burst(lane, n) {

function drawRoad(t, beat, hue) {
  // road surface
  const far = laneScreen(0, 1, 0), farR = laneScreen(LANES - 1, 1, 1), nearL = laneScreen(0, -0.06, 0), nearR = laneScreen(LANES - 1, -0.06, 1);
  const rg = ctx.createLinearGradient(0, horizon, 0, H);
  rg.addColorStop(0, 'rgba(10,6,24,.2)'); rg.addColorStop(1, 'rgba(10,6,24,.88)');
  ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(far.x, far.y); ctx.lineTo(farR.x, farR.y); ctx.lineTo(nearR.x, nearR.y + 40); ctx.lineTo(nearL.x, nearL.y + 40); ctx.fill();
  // lane press glow
  for (let l = 0; l < LANES; l++) if (G.press[l] > 0) {
    const a = laneScreen(l, 1, 0), b = laneScreen(l, 1, 1), c = laneScreen(l, 0, 1), d = laneScreen(l, 0, 0);
    const lg = ctx.createLinearGradient(0, hitY, 0, horizon); lg.addColorStop(0, LANE_COL[l] + Math.round(G.press[l] * 90).toString(16).padStart(2, '0')); lg.addColorStop(1, LANE_COL[l] + '00');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.fill();
  }
  // moving cross lines on every beat
  const la = lookahead(), spb = G.music.spb;
  ctx.lineWidth = 1;
  for (let k = Math.ceil(t / spb); k * spb < t + la; k++) {
    const z = (k * spb - t) / la, l = laneScreen(0, z, 0), r = laneScreen(LANES - 1, z, 1);
    ctx.strokeStyle = `hsla(${hue + 40},100%,80%,${(k % 4 === 0 ? 0.35 : 0.12) * (1 - z)})`; ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(r.x, r.y); ctx.stroke();
  }
  // lane dividers
  for (let l = 0; l <= LANES; l++) {
    const edge = l === 0 || l === LANES, a = laneScreen(Math.min(l, LANES - 1), 1, l === LANES ? 1 : 0), b = laneScreen(Math.min(l, LANES - 1), -0.06, l === LANES ? 1 : 0);
    ctx.strokeStyle = edge ? `hsla(${hue + 60},100%,75%,.8)` : 'rgba(255,255,255,.12)'; ctx.lineWidth = edge ? 2.5 : 1;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // hit line + receptors
  const hl = laneScreen(0, 0, 0), hr = laneScreen(LANES - 1, 0, 1);
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3; ctx.shadowColor = '#fff'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(hl.x, hitY); ctx.lineTo(hr.x, hitY); ctx.stroke(); ctx.shadowBlur = 0;
  for (let l = 0; l < LANES; l++) {
    const p = laneScreen(l, 0), w = roadW / LANES * 0.8, pr = G.press[l];
    ctx.fillStyle = LANE_COL[l] + (pr > 0 ? 'cc' : '33'); ctx.beginPath(); ctx.roundRect(p.x - w / 2, hitY - 9 - pr * 3, w, 18 + pr * 6, 9); ctx.fill();
    ctx.strokeStyle = LANE_COL[l]; ctx.lineWidth = 2; ctx.stroke();
    if (W > 700) { ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.font = '800 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText(KEYS[l].slice(3), p.x, hitY + 30); }
  }
}
function drawNotes(t) {
  const la = lookahead();
  for (let i = G.notes.length - 1; i >= G.idx; i--) {
    const n = G.notes[i];
    if (n.done || (n.hit && !n.holding)) continue;
    const z0 = (n.t - t) / la; if (z0 > 1.05) continue;
    const col = LANE_COL[n.lane];
    if (n.dur > 0) { // hold trail
      const zs = Math.max(0, z0), ze = Math.min(1, (n.t + n.dur - t) / la);
      if (ze > zs) {
        const a = laneScreen(n.lane, zs, 0.3), b = laneScreen(n.lane, zs, 0.7), c = laneScreen(n.lane, ze, 0.7), d = laneScreen(n.lane, ze, 0.3);
        const tg = ctx.createLinearGradient(0, a.y, 0, c.y); tg.addColorStop(0, col + (n.holding ? 'ee' : '99')); tg.addColorStop(1, col + '33');
        ctx.fillStyle = tg; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.fill();
      }
      if (n.holding) continue;
    }
    if (z0 < -0.08) continue;
    const p = laneScreen(n.lane, Math.max(z0, -0.08)), w = roadW / LANES * 0.82 * p.s, h = 16 * p.s + 4;
    ctx.shadowColor = col; ctx.shadowBlur = 18 * p.s;
    const ng = ctx.createLinearGradient(0, p.y - h, 0, p.y + h); ng.addColorStop(0, '#ffffff'); ng.addColorStop(0.35, col); ng.addColorStop(1, col);
    ctx.fillStyle = ng; ctx.beginPath(); ctx.roundRect(p.x - w / 2, p.y - h / 2, w, h, h / 2); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(p.x - w * 0.3, p.y - h * 0.22, w * 0.6, Math.max(1, h * 0.14));
  }
}
function drawHud(t) {
  // judgement + combo
  if (G.judge && G.judge.t > 0) {
    const k = G.judge.t / 0.5, y = hitY - H * 0.24 - (1 - k) * 12;
    ctx.globalAlpha = Math.min(1, k * 2); ctx.textAlign = 'center';
    ctx.font = `900 ${Math.round(30 + (1 - k) * 4)}px system-ui`; ctx.fillStyle = G.judge.col; ctx.shadowColor = G.judge.col; ctx.shadowBlur = 16;
    ctx.fillText(G.judge.name, W / 2, y); ctx.shadowBlur = 0;
    if (G.judge.early) { ctx.font = '800 12px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillText(G.judge.early, W / 2, y + 20); }
    ctx.globalAlpha = 1;
  }
  if (G.combo >= 3) {
    ctx.textAlign = 'center'; ctx.font = `900 ${Math.min(64, 34 + G.combo / 10)}px system-ui`; ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.fillText(G.combo, W / 2, H * 0.42); ctx.font = '800 12px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillText('COMBO', W / 2, H * 0.42 + 18);
  }
  // score + progress
  ctx.textAlign = 'right'; ctx.font = '900 22px system-ui'; ctx.fillStyle = '#fff';
  ctx.fillText(Math.max(0, Math.round(G.score)).toLocaleString().padStart(7, ' '), W - 64, 32);
  const judged = G.counts.reduce((x, y) => x + y, 0);
  if (judged) { // the grade this run is on track for, from the notes judged so far
    const g = gradeOf(Math.round(G.score / (G.perNote * judged) * 1e6));
    ctx.textAlign = 'right'; ctx.font = '900 30px system-ui'; ctx.fillStyle = GRADE_COL[g]; ctx.shadowColor = GRADE_COL[g]; ctx.shadowBlur = g === 'SS' ? 16 : 8;
    ctx.fillText(g, W - 64, 88); ctx.shadowBlur = 0;
  }
  if (G.board) { // where this score would place on the song's leaderboard right now
    const r = 1 + G.board.filter((x) => x > G.score).length, full = G.board.length >= 100 && r > 100;
    ctx.font = '800 13px system-ui'; ctx.fillStyle = r <= 3 ? '#ffd36a' : 'rgba(255,255,255,.75)';
    ctx.fillText(full ? 'RANK 100+' : `RANK #${r}${r <= 3 ? ' 🏆' : ''}`, W - 64, 52);
  }
  ctx.textAlign = 'left'; ctx.font = '800 13px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText(`${G.song.title} · ${DIFFS.find((d) => d.id === G.diff).name}`, 14, 30);
  const bw = Math.min(180, W * 0.4), hp = G.hp / 100, low = hp < 0.3 && Math.sin(performance.now() / 90) > 0; // blinks when low
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.beginPath(); ctx.roundRect(14, 40, bw, 8, 4); ctx.fill();
  ctx.fillStyle = low ? '#fff' : hp > 0.5 ? '#7dffb0' : hp > 0.3 ? '#ffd36a' : '#ff6b7a';
  ctx.beginPath(); ctx.roundRect(14, 40, Math.max(4, bw * hp), 8, 4); ctx.fill();
  ctx.font = '800 10px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillText('ENERGY', 18 + bw, 48);
  const prog = clamp(t / G.music.length, 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, 0, W, 4); ctx.fillStyle = LANE_COL[0]; ctx.fillRect(0, 0, W * prog, 4);
  if (t < 0) { ctx.textAlign = 'center'; ctx.font = '900 46px system-ui'; ctx.fillStyle = '#fff'; ctx.fillText(Math.ceil(-t) > 2 ? 'READY' : Math.ceil(-t), W / 2, H * 0.4); }
}
function draw(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (state === 'menu' || !G) { drawBg(now / 1000, now / 1000 * 1.9, 290, 0); return; }
  const t = state === 'result' ? G.music.length : songTime(), beat = Math.max(0, t) / G.music.spb;
  const level = G.bloom * 0.6 + Math.min(1, G.combo / 80) * 0.4;
  drawBg(now / 1000, beat, G.song.hue, level);
  ctx.globalCompositeOperation = 'lighter'; drawWarp(state === 'play' ? 1 / 60 : 0, G.song.hue, level); ctx.globalCompositeOperation = 'source-over';
  drawRoad(t, beat, G.song.hue);
  ctx.globalCompositeOperation = 'lighter'; drawPillars(t, G.song.hue); ctx.globalCompositeOperation = 'source-over';
  drawNotes(t);
  for (const p of G.pops) { const q = laneScreen(p.lane, 0), k = p.t / 0.3; ctx.strokeStyle = LANE_COL[p.lane]; ctx.globalAlpha = k; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(q.x, hitY, roadW / LANES * (0.6 - k * 0.2), 22 * (1.4 - k), 0, 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'lighter';
  for (const p of G.parts) { ctx.globalAlpha = Math.min(1, p.t * 3); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r); }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,60,90,${G.flash * 0.5})`; ctx.fillRect(0, 0, W, H); }
  drawHud(t);
}

renderMenu();
let last = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); draw(now); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
