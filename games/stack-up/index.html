<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Stack Up</title>
<script src="../cloudsave.js" data-game="stack-up" data-keys="stackup-best stackup-floors"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #fff; font: 16px system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; cursor: pointer; }
  #home { position: fixed; top: 12px; left: 12px; color: #fffc; text-decoration: none; font-size: 14px; font-weight: 700;
    background: #0005; padding: 6px 10px; border-radius: 8px; }
  #over { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; background: #0008; text-align: center; overflow-y: auto; justify-content: safe center; padding: 16px 0; box-sizing: border-box; }
  #over[hidden] { display: none; }
  #over h2 { margin: 0; font-size: 18px; letter-spacing: 2px; opacity: .8; }
  #final { font-size: 72px; font-weight: 900; line-height: 1; }
  #newBest { color: #ffd84a; font-weight: 800; }
  #bestTxt { opacity: .7; }
  .btns { display: flex; gap: 10px; margin-top: 10px; }
  button { font: 700 16px system-ui, sans-serif; padding: 12px 22px; border: 0; border-radius: 12px; cursor: pointer; }
  #retry { background: #fff; color: #111; }
  #share { background: #0006; color: #fff; border: 1px solid #fff6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- Shown only when played standalone; inside the blog's iframe the site navbar covers it. -->
<a id="home" href="https://rank-game.com/">← Home</a>
<script>if (top !== self) home.remove();</script>
<div id="over" hidden>
  <h2>SCORE</h2>
  <div id="final">0</div>
  <div id="floorsTxt" style="opacity:.7;font-weight:700"></div>
  <div id="newBest" hidden>★ NEW BEST! ★</div>
  <div id="bestTxt"></div>
  <div id="lb"></div>
  <div class="btns"><button id="retry">Play again</button><button id="share">Share</button></div>
  <div id="ad"></div>
</div>
<script src="../leaderboard.js"></script>
<script src="../ad.js"></script>
<script>adBanner(document.getElementById('ad'));</script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H;
function resize() {
  const dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

const BH = 26, PERFECT = 5, lb = leaderboard(document.getElementById('lb'), 'stack-up');
let best = 0;
let bestFloors = 0; // the dashed BEST line marks your highest tower
try { best = +localStorage.getItem('stackup-best') || 0; bestFloors = +localStorage.getItem('stackup-floors') || 0; } catch {}
let stack, cur, falling, parts, popups, combo, points, state = 'ready', cam, zoom, baseW, hue0, overAt;

const floors = () => stack.length - 1;
// points: +1 per block; a perfect drop adds the combo on top (+2, +3, +4… capped at +11)
const gain = () => 1 + Math.min(combo, 10);
const hue = (i) => (hue0 + i * 4) % 360;
const groundY = () => H - 60;
const sy = (bottom) => groundY() - bottom - BH + cam; // screen y of a block's top edge

function reset() {
  baseW = Math.min(W * 0.55, 260);
  hue0 = Math.random() * 360;
  stack = [{ x: (W - baseW) / 2, w: baseW }];
  combo = 0; points = 0; falling = []; parts = []; popups = []; cam = 0; zoom = 1;
  spawn();
}

function spawn() {
  const top = stack[stack.length - 1], span = baseW * 0.9, fromLeft = stack.length % 2;
  cur = { w: top.w, x: top.x + (fromLeft ? -span : span), dir: fromLeft ? 1 : -1, min: top.x - span, max: top.x + span };
}

function drop() {
  const top = stack[stack.length - 1], lvl = stack.length;
  if (Math.abs(cur.x - top.x) <= PERFECT) {
    combo++;
    let { x, w } = top;
    if (combo >= 3 && w < baseW) { const g = Math.min(12, baseW - w); w += g; x -= g / 2; } // streak regrows the block
    stack.push({ x, w, flash: 1 });
    burst(x, w, lvl);
    points += gain();
    popup(combo > 1 ? `PERFECT ×${combo}  +${gain()}` : `PERFECT  +${gain()}`);
    tone(440 * 2 ** ([0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24][Math.min(combo - 1, 10)] / 12), 0.25, 'sine', 0.2);
    navigator.vibrate?.(15);
  } else {
    const L = Math.max(cur.x, top.x), R = Math.min(cur.x + cur.w, top.x + top.w);
    if (R <= L) { falling.push(piece(cur.x, cur.w, lvl, cur.dir)); return gameOver(); }
    combo = 0; points += 1;
    if (cur.x < top.x) falling.push(piece(cur.x, top.x - cur.x, lvl, -1));
    else falling.push(piece(R, cur.x + cur.w - R, lvl, 1));
    stack.push({ x: L, w: R - L });
    tone(130, 0.08, 'square', 0.05);
  }
  if (best > 0 && points > best && points - gain() <= best) popup('NEW RECORD!');
  else if (floors() % 25 === 0) popup(`${floors()} floors 🔥`);
  spawn();
}

const piece = (x, w, lvl, dir) => ({ x, w, y: lvl * BH, vy: 0, vx: dir * 60, rot: 0, vr: dir * 2, h: hue(lvl) });

function burst(x, w, lvl) {
  for (let i = 0; i < 18; i++) {
    const side = i % 2 ? x + w : x;
    parts.push({ x: side, y: lvl * BH + BH, vx: (side === x ? -1 : 1) * (40 + Math.random() * 120), vy: Math.random() * 160, t: 0.6 });
  }
}
const popup = (text) => popups.push({ text, t: 1 });

function gameOver() {
  state = 'over'; overAt = performance.now();
  tone(196, 0.5, 'sawtooth', 0.08);
  const s = points, isBest = s > best;
  if (isBest) { best = s; try { localStorage.setItem('stackup-best', s); } catch {} }
  if (floors() > bestFloors) { bestFloors = floors(); try { localStorage.setItem('stackup-floors', bestFloors); } catch {} }
  setTimeout(() => {
    document.getElementById('final').textContent = s;
    document.getElementById('floorsTxt').textContent = `${floors()} floors`;
    document.getElementById('newBest').hidden = !isBest;
    document.getElementById('bestTxt').textContent = `Best: ${best} points`;
    document.getElementById('over').hidden = false;
    lb.show(s);
  }, 900);
}

let ac;
function tone(f, d, type, v) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(ac.destination); o.start(); o.stop(t + d);
}

function act() {
  try { ac ||= new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  if (state === 'ready') state = 'play';
  else if (state === 'play') drop();
  else if (!document.getElementById('over').hidden && performance.now() - overAt > 1200) retry();
}
function retry() { document.getElementById('over').hidden = true; reset(); state = 'play'; }

cv.addEventListener('pointerdown', act);
addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); act(); } });
document.getElementById('retry').onclick = retry;
document.getElementById('share').onclick = async (e) => {
  const text = `I scored ${points} points (${floors()} floors) in Stack Up! Can you beat me?`, url = 'https://rank-game.com/games/stack-up';
  try {
    if (navigator.share) await navigator.share({ title: 'Stack Up', text, url });
    else { await navigator.clipboard.writeText(`${text} ${url}`); e.target.textContent = 'Copied!'; }
  } catch {}
};

function update(dt) {
  if (state === 'play') {
    const speed = Math.min(170 + floors() * 6, 480);
    cur.x += cur.dir * speed * dt;
    if (cur.x > cur.max) { cur.x = cur.max; cur.dir = -1; }
    if (cur.x < cur.min) { cur.x = cur.min; cur.dir = 1; }
  }
  const towerH = (stack.length + 1) * BH;
  const camT = state === 'over' ? 0 : Math.max(0, towerH - H * 0.45);
  const zoomT = state === 'over' ? Math.min(1, (H * 0.7) / towerH) : 1;
  cam += (camT - cam) * Math.min(1, dt * 6);
  zoom += (zoomT - zoom) * Math.min(1, dt * 3);
  for (const p of falling) { p.vy += 1400 * dt; p.y -= p.vy * dt; p.x += p.vx * dt; p.rot += p.vr * dt; }
  falling = falling.filter((p) => sy(p.y) < H / zoom + 200);
  for (const p of parts) { p.vy -= 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; }
  parts = parts.filter((p) => p.t > 0);
  for (const p of popups) p.t -= dt * 0.9;
  popups = popups.filter((p) => p.t > 0);
  for (const b of stack) if (b.flash) b.flash = Math.max(0, b.flash - dt * 3);
}

function block(x, y, w, h, alpha = 1) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = `hsl(${h},70%,58%)`; ctx.fillRect(x, y, w, BH);
  ctx.fillStyle = `hsl(${h},80%,72%)`; ctx.fillRect(x, y, w, 5);
  ctx.fillStyle = `hsl(${h},60%,42%)`; ctx.fillRect(x, y + BH - 4, w, 4);
  ctx.globalAlpha = 1;
}

function draw() {
  const h = hue(floors());
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, `hsl(${(h + 180) % 360},45%,22%)`);
  bg.addColorStop(1, `hsl(${(h + 200) % 360},35%,8%)`);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2, groundY()); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -groundY());

  ctx.fillStyle = '#0006'; ctx.fillRect(-W * 4, groundY() + cam, W * 9, H * 4); // ground

  if (bestFloors > 0) {
    const y = sy(bestFloors * BH);
    ctx.strokeStyle = '#ffd84a'; ctx.setLineDash([8, 8]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-W * 4, y); ctx.lineTo(W * 5, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#ffd84a'; ctx.font = '700 12px system-ui'; ctx.textAlign = 'right';
    ctx.fillText(`BEST ${bestFloors} floors`, W - 12, y - 6);
  }

  stack.forEach((b, i) => {
    block(b.x, sy(i * BH), b.w, hue(i));
    if (b.flash) { ctx.fillStyle = `rgba(255,255,255,${b.flash})`; ctx.fillRect(b.x - 3, sy(i * BH) - 3, b.w + 6, BH + 6); }
  });
  if (state === 'play') block(cur.x, sy(stack.length * BH), cur.w, hue(stack.length));

  for (const p of falling) {
    ctx.save(); ctx.translate(p.x + p.w / 2, sy(p.y) + BH / 2); ctx.rotate(p.rot);
    block(-p.w / 2, -BH / 2, p.w, p.h, 0.9); ctx.restore();
  }
  ctx.fillStyle = '#fff';
  for (const p of parts) { ctx.globalAlpha = p.t / 0.6; ctx.fillRect(p.x - 2, sy(p.y) + BH - 2, 4, 4); }
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  if (state === 'ready') {
    ctx.font = '900 44px system-ui'; ctx.fillText('STACK UP', W / 2, H * 0.28);
    ctx.font = '600 16px system-ui'; ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 300);
    ctx.fillText('Tap or press Space to drop', W / 2, H * 0.28 + 36);
    ctx.globalAlpha = 1;
    if (best) { ctx.font = '600 14px system-ui'; ctx.fillText(`Best: ${best} points`, W / 2, H * 0.28 + 64); }
  } else if (state === 'play') {
    ctx.font = '900 56px system-ui'; ctx.globalAlpha = 0.9; ctx.fillText(points, W / 2, 80);
    ctx.font = '700 14px system-ui'; ctx.globalAlpha = 0.65; ctx.fillText(`${floors()} floors`, W / 2, 102);
    if (combo >= 2) { ctx.globalAlpha = 1; ctx.fillStyle = '#ffd84a'; ctx.font = '900 18px system-ui'; ctx.fillText(`COMBO ×${combo}`, W / 2, 128); ctx.fillStyle = '#fff'; }
    ctx.globalAlpha = 1;
  }
  popups.forEach((p, i) => {
    ctx.globalAlpha = Math.min(1, p.t * 2);
    ctx.font = '900 26px system-ui'; ctx.fillStyle = '#fff';
    ctx.fillText(p.text, W / 2, H * 0.22 + 30 + i * 32 - (1 - p.t) * 40);
  });
  ctx.globalAlpha = 1;
}

let last = performance.now();
function loop(now) {
  update(Math.min((now - last) / 1000, 0.05));
  last = now;
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
