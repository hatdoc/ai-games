<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Goose Guard</title>
<script src="../cloudsave.js" data-game="goose-guard" data-keys="gooseguard-save"></script>
<script src="../share.js"></script>
<style>
  :root { --ink: #fffdf4; --dim: #c9d3c1; --gold: #ffc93d; --green: #5fe07a; --red: #ff5a4d; --panel: #1d2a1c;
    --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", Nunito, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #142013; color: var(--ink); font: 16px/1.35 var(--font);
    user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  button { font-family: var(--font); }

  #hud { position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center;
    padding: 0 12px; pointer-events: none; text-shadow: 0 2px 6px #000a; font-weight: 900; }
  #hud[hidden], #ctl[hidden] { display: none; }
  .hb { display: flex; align-items: center; gap: 6px; font-size: 20px; }
  .hb.r { justify-content: flex-end; }
  .hb div { flex: 1; max-width: 220px; height: 12px; border-radius: 99px; background: #0007; overflow: hidden; border: 2px solid #ffffff33; }
  .hb i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #4fd06a, #a6f06a); transition: width .2s; }
  .hb.r i { margin-left: auto; background: linear-gradient(90deg, #ff6a4d, #c43a6a); }
  #stg { text-align: center; font-size: 15px; line-height: 1.1; white-space: nowrap; }
  #stg small { display: block; font-size: 11px; color: var(--dim); letter-spacing: 1px; }
  #tools { position: fixed; top: 10px; right: 10px; z-index: 20; display: flex; gap: 6px; }
  body.playing #tools { top: 56px; }
  #tools button { width: 36px; height: 36px; border: 0; border-radius: 11px; background: #0000004d; color: #fff; font-size: 16px; font-weight: 900; cursor: pointer; }
  #tools button[hidden] { display: none; }
  #spd.on { background: var(--gold); color: #2a1a00; }

  #ctl { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(#1b2a18ee, #0f180ef5); border-top: 2px solid #ffffff1a; }
  #mid { flex: 1 1 100%; order: -1; min-width: 0; }
  #grain { position: relative; height: 18px; border-radius: 99px; background: #0008; overflow: hidden; margin-bottom: 6px; border: 1px solid #ffffff22; }
  #grain i { position: absolute; inset: 0; width: 0; background: linear-gradient(90deg, #d9a72a, #ffe066); }
  #grain span { position: relative; display: block; text-align: center; font-size: 12px; font-weight: 900; line-height: 16px; color: #2a1a00; text-shadow: 0 0 4px #fff8; }
  #cards { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  #cards::-webkit-scrollbar { display: none; }
  .cd { position: relative; flex: 1 0 44px; max-width: 78px; height: 62px; border: 0; border-radius: 13px; cursor: pointer; overflow: hidden;
    background: linear-gradient(#fff6dc, #f0d79a); box-shadow: 0 4px 0 #9c7a2e; color: #2a1a00; padding: 0; transition: transform .06s; }
  .cd:active { transform: translateY(3px); box-shadow: 0 1px 0 #9c7a2e; }
  .cd b { display: block; font-size: 28px; line-height: 36px; }
  .cd span { display: block; font-size: 12px; font-weight: 900; }
  .cd kbd { position: absolute; top: 3px; left: 5px; font: 800 10px var(--font); opacity: .5; }
  .cd::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: var(--cd, 0%); background: #0007; }
  .cd.poor { filter: grayscale(.8) brightness(.75); }
  .cd.lock { background: #ffffff14; box-shadow: none; color: #fff8; cursor: default; }
  .cd.lock b { font-size: 20px; }
  .mv { width: 64px; height: 54px; border: 0; border-radius: 14px; background: #ffffff1f; color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 4px 0 #0006; }
  .mv.on { background: #ffffff44; }
  #honk { margin-left: auto; position: relative; width: 112px; height: 54px; border: 0; border-radius: 16px; cursor: pointer; overflow: hidden; color: #2a1a00;
    font: 900 19px var(--font); background: linear-gradient(#ffe27a, #ffb21f); box-shadow: 0 4px 0 #a8650f; }
  #honk::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: var(--cd, 0%); background: #000a; }
  #honk small { display: block; font-size: 10px; opacity: .7; }
  @media (min-width: 760px) and (orientation: landscape) {
    #ctl { flex-wrap: nowrap; }
    #mid { order: 0; flex: 1 1 auto; }
    #honk { margin-left: 0; }
  }

  .screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px;
    padding: 24px 14px; text-align: center; overflow-y: auto; touch-action: pan-y; background: radial-gradient(ellipse at 50% 35%, #142013a8, #0a1209f2); }
  .screen[hidden] { display: none; }
  h1 { margin: 0; font-size: clamp(54px, 15vw, 106px); line-height: .86; font-weight: 900; letter-spacing: -2px; color: #fff; transform: rotate(-3deg);
    text-shadow: 0 5px 0 #2d6b2a, 0 14px 34px #8cff7a55; }
  h1 b { display: block; color: var(--gold); text-shadow: 0 5px 0 #9a5a0c, 0 14px 34px #ffb21f66; }
  .tag { font-size: 17px; color: var(--dim); max-width: 360px; }
  .how { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 480px; }
  .how div { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 14px; background: #ffffff12; border: 1px solid #ffffff1c; font-size: 14px; font-weight: 700; }
  .how span { font-size: 20px; }
  .btn { font: 900 19px var(--font); padding: 13px 28px; border: 0; border-radius: 18px; cursor: pointer; color: #2a1a00;
    background: linear-gradient(#ffe27a, #ffb21f); box-shadow: 0 6px 0 #a8650f, 0 12px 26px #ffb21f44; transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a8650f; }
  .btn.alt { color: #fff; background: #ffffff1f; box-shadow: 0 6px 0 #00000055; }
  .btn.grn { color: #072a0c; background: linear-gradient(#a6f59a, #4fd06a); box-shadow: 0 6px 0 #23793a; }
  .btn:disabled { opacity: .45; cursor: default; }
  #play { font-size: 26px; padding: 16px 56px; animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: scale(1.06); } }
  #home { position: fixed; top: 16px; left: 14px; z-index: 20; color: #fffc; text-decoration: none; font-size: 14px; font-weight: 800; background: #0006; padding: 7px 11px; border-radius: 10px; }
  .sub { color: var(--dim); font-size: 13px; font-weight: 700; }

  #map { justify-content: flex-start; gap: 12px; }
  .bar { width: min(560px, 100%); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .pill { padding: 7px 12px; border-radius: 99px; background: #ffffff16; font-weight: 900; font-size: 15px; }
  .world { width: min(560px, 100%); padding: 12px; border-radius: 20px; background: var(--wbg, #ffffff10); border: 1px solid #ffffff1f; text-align: left; }
  .world h3 { margin: 0 0 8px; font-size: 16px; display: flex; justify-content: space-between; }
  .world h3 span { color: var(--gold); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .st { height: 54px; border: 0; border-radius: 12px; cursor: pointer; font: 900 17px var(--font); color: #2a1a00; background: linear-gradient(#fff6dc, #e9cf8e);
    box-shadow: 0 3px 0 #8c6a24; line-height: 1.05; padding: 0; }
  .st small { display: block; font-size: 10px; letter-spacing: -1px; }
  .st.boss { background: linear-gradient(#ffb3a3, #ff6a4d); box-shadow: 0 3px 0 #8e2a1a; }
  .st.cur { outline: 3px solid #fff; animation: bob 1.4s ease-in-out infinite; }
  .st:disabled { background: #ffffff14; color: #ffffff55; box-shadow: none; cursor: default; }

  .card { width: min(380px, 94vw); padding: 20px 18px; border-radius: 24px; background: linear-gradient(#25381f, #172515); border: 1px solid #ffffff22; box-shadow: 0 20px 60px #000a; }
  #rTag { font-weight: 900; letter-spacing: 3px; font-size: 13px; }
  #rBig { font-size: 40px; font-weight: 900; line-height: 1.05; margin-top: 4px; }
  #rStars { font-size: 44px; letter-spacing: 4px; margin: 6px 0; min-height: 52px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .stats div { padding: 8px 4px; border-radius: 12px; background: #ffffff10; font-size: 12px; color: var(--dim); font-weight: 700; }
  .stats b { display: block; font-size: 20px; color: #fff; }
  #rNote { color: var(--green); font-weight: 900; min-height: 20px; }
  .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .btns .btn { padding: 11px 16px; font-size: 16px; }

  #shop .row { width: min(460px, 100%); display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 16px; background: #ffffff10; text-align: left; }
  #shop .row > b { font-size: 30px; width: 40px; text-align: center; }
  #shop .row div { flex: 1; min-width: 0; }
  #shop .row strong { display: block; font-size: 15px; }
  #shop .row small { color: var(--dim); font-size: 12px; font-weight: 700; }
  #shop .row button { padding: 9px 12px; font-size: 14px; white-space: nowrap; }
  #toast { position: fixed; left: 50%; top: 110px; transform: translateX(-50%); z-index: 30; padding: 10px 18px; border-radius: 16px; background: #000c; font-weight: 900;
    pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden>
  <div class="hb"><span>🏠</span><div><i id="hbB"></i></div></div>
  <div id="stg"></div>
  <div class="hb r"><div><i id="hbT"></i></div><span id="tIcon">🌿</span></div>
</div>
<div id="tools"><button id="spd" hidden aria-label="Speed">2×</button><button id="quit" hidden aria-label="Quit">✕</button><button id="mute" aria-label="Sound">🔊</button></div>
<div id="ctl" hidden>
  <button class="mv" id="bl" aria-label="Move left">◀</button><button class="mv" id="br" aria-label="Move right">▶</button>
  <div id="mid"><div id="grain"><i></i><span id="gTxt"></span></div><div id="cards"></div></div>
  <button id="honk">HONK!<small id="honkK">Space</small></button>
</div>
<div id="toast"></div>

<div id="menu" class="screen">
  <a id="home" href="https://rank-game.com/">← Home</a>
  <script>if (top !== self) home.remove();</script>
  <h1>GOOSE<b>GUARD!</b></h1>
  <div class="tag">The Weed Horde wants your barn. Lead the farm, smash their tower.</div>
  <div class="how">
    <div><span>🪿</span>Walk your goose knight</div>
    <div><span>🌾</span>Spend grain on troops</div>
    <div><span>📣</span>HONK to blast the horde</div>
  </div>
  <button id="play" class="btn">PLAY</button>
  <div id="mStars" class="sub"></div>
</div>

<div id="map" class="screen" hidden>
  <div class="bar"><button class="btn alt" id="mBack">←</button><span class="pill" id="pAcorn"></span><span class="pill" id="pStar"></span></div>
  <div class="bar"><button class="btn" id="mShop">⬆️ Upgrades</button><button class="btn grn" id="mEndless">🏆 Endless Horde</button></div>
  <div id="worlds" style="display:contents"></div>
</div>

<div id="shop" class="screen" hidden>
  <div class="bar"><button class="btn alt" id="sBack">← Map</button><span class="pill" id="sAcorn"></span></div>
  <div class="sub">Upgrades carry over to every stage and to Endless Horde.</div>
  <div id="rows" style="display:contents"></div>
</div>

<div id="res" class="screen" hidden>
  <div class="card">
    <div id="rTag"></div>
    <div id="rBig"></div>
    <div id="rStars"></div>
    <div class="stats"><div><b id="rKills">0</b>weeds pulled</div><div><b id="rTroops">0</b>troops</div><div><b id="rAcorn">0</b>acorns</div></div>
    <div id="rNote"></div>
    <div class="btns" style="margin-top:10px"><button id="rNext" class="btn">Next ▶</button><button id="rRetry" class="btn alt">Retry</button><button id="rShare" class="btn alt">Share</button><button id="rMap" class="btn alt">Map</button></div>
  </div>
  <div id="lb"></div>
  <div id="ad"></div>
</div>

<script src="../leaderboard.js"></script>
<script src="../ad.js"></script>
<script>
const $ = (id) => document.getElementById(id);
adBanner($('ad'));
const lb = leaderboard($('lb'), 'goose-guard', (s) => `${s.toLocaleString()} pts`);
const cv = $('c'), ctx = cv.getContext('2d');
const EMOJI = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
const FONT = 'ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", Nunito, system-ui, sans-serif';
const URL_ = 'https://rank-game.com/games/goose-guard';
const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v)), pick = (a) => a[Math.random() * a.length | 0];

// ---- content ----
// hp/dmg are level 1 stats; rate = seconds between attacks; range in world units (a lane is ~1500-2200 long)
const UNITS = [
  { id: 'chick', e: '🐣', name: 'Chick', cost: 20, cd: 1.2, hp: 50, dmg: 8, rate: .7, range: 24, spd: 80, size: 30, unlock: 1, desc: 'Cheap and fast' },
  { id: 'hen', e: '🐔', name: 'Egg Hen', cost: 45, cd: 3, hp: 60, dmg: 15, rate: 1.6, range: 170, spd: 46, size: 34, unlock: 3, shot: 'egg', splash: 36, desc: 'Lobs exploding eggs' },
  { id: 'ram', e: '🐏', name: 'Ram', cost: 75, cd: 5, hp: 320, dmg: 16, rate: 1.1, range: 28, spd: 42, size: 40, unlock: 6, knock: 26, desc: 'Tank, knocks foes back' },
  { id: 'bee', e: '🐝', name: 'Bee Swarm', cost: 35, cd: 2, hp: 34, dmg: 6, rate: .3, range: 22, spd: 130, size: 26, fly: 1, unlock: 11, desc: 'Flies fast, stings fast' },
  { id: 'pig', e: '🐖', name: 'War Pig', cost: 110, cd: 6, hp: 460, dmg: 44, rate: 1.2, range: 30, spd: 52, size: 44, unlock: 16, desc: 'Heavy hitter' },
  { id: 'rooster', e: '🐓', name: 'Fire Rooster', cost: 150, cd: 8, hp: 130, dmg: 34, rate: 1.8, range: 210, spd: 44, size: 38, unlock: 24, shot: 'fire', splash: 64, desc: 'Fireballs hit crowds' },
  { id: 'cow', e: '🐄', name: 'Moo Tank', cost: 230, cd: 12, hp: 1200, dmg: 80, rate: 1.5, range: 34, spd: 30, size: 56, unlock: 33, splash: 50, knock: 46, desc: 'Stomps everything' },
];
// from = first stage it appears; w = spawn weight
const FOES = [
  { e: '🌱', hp: 42, dmg: 6, rate: .8, range: 22, spd: 55, size: 34, pts: 5, from: 1, w: 10 },
  { e: '🐛', hp: 32, dmg: 5, rate: .5, range: 20, spd: 95, size: 26, pts: 6, from: 2, w: 6 },
  { e: '🍄', hp: 55, dmg: 12, rate: 1.8, range: 150, spd: 40, size: 30, pts: 10, from: 4, w: 5, shot: 'spore' },
  { e: '🥔', hp: 250, dmg: 14, rate: 1.2, range: 26, spd: 34, size: 36, pts: 15, from: 7, w: 4 },
  { e: '🌵', hp: 170, dmg: 20, rate: 1, range: 26, spd: 40, size: 40, pts: 14, from: 13, w: 4, thorns: .3 },
  { e: '🌶️', hp: 48, dmg: 70, rate: 9, range: 20, spd: 88, size: 30, pts: 12, from: 18, w: 3, boom: 64 },
  { e: '🦟', hp: 38, dmg: 8, rate: .4, range: 22, spd: 112, size: 24, pts: 8, from: 22, w: 4, fly: 1 },
  { e: '🎃', hp: 640, dmg: 46, rate: 1.6, range: 32, spd: 28, size: 50, pts: 30, from: 28, w: 2, splash: 50 },
  { e: '🧅', hp: 130, dmg: 18, rate: 2, range: 185, spd: 38, size: 32, pts: 18, from: 35, w: 3, shot: 'tear', splash: 42 },
  { e: '🍆', hp: 950, dmg: 62, rate: 1.4, range: 30, spd: 30, size: 52, pts: 40, from: 45, w: 2, knock: 40 },
];
const BOSSES = [
  { e: '🥕', name: 'Carrot Czar', hp: 1500, dmg: 46, rate: 1.6, range: 40, spd: 24, size: 44, pts: 300, splash: 70, knock: 34 },
  { e: '🥦', name: 'Broccolossus', hp: 2100, dmg: 56, rate: 1.7, range: 42, spd: 22, size: 46, pts: 450, splash: 80, knock: 40 },
  { e: '🍄‍🟫', name: 'Morel Monarch', hp: 2400, dmg: 40, rate: 2.2, range: 220, spd: 22, size: 46, pts: 600, shot: 'spore', splash: 90 },
  { e: '🍍', name: 'Pineapple Pharaoh', hp: 2800, dmg: 62, rate: 1.6, range: 44, spd: 24, size: 48, pts: 800, splash: 80, knock: 50, thorns: .25 },
  { e: '🥬', name: 'Bog Cabbage', hp: 2900, dmg: 62, rate: 1.5, range: 44, spd: 22, size: 50, pts: 1000, splash: 90, knock: 50 },
  { e: '🌳', name: 'The Elder Weed', hp: 3000, dmg: 60, rate: 1.5, range: 48, spd: 20, size: 56, pts: 1500, splash: 80, knock: 40, thorns: .15 },
];
const WORLDS = [
  { name: 'Sunny Meadow', sky: ['#8fd3ff', '#d9f3ff'], far: '#8ccf7a', near: '#5fb456', ground: '#4c9a3e', dirt: '#8a6a3c', props: ['🌼', '🌷', '🌾'], bg: '#2b4a2433' },
  { name: 'Pumpkin Patch', sky: ['#ffb36b', '#ffe3b0'], far: '#c99a4a', near: '#9c7a33', ground: '#7d8a32', dirt: '#7a5528', props: ['🍂', '🌾', '🪵'], bg: '#5a3a1433' },
  { name: 'Mushroom Woods', sky: ['#5e5aa8', '#a89ad8'], far: '#3f6a4a', near: '#2e5236', ground: '#2f6a3a', dirt: '#5a4632', props: ['🍄', '🌲', '🌿'], bg: '#3a2a5a33' },
  { name: 'Cactus Canyon', sky: ['#ff9d5c', '#ffe08a'], far: '#d98a52', near: '#c26a3a', ground: '#d6a85a', dirt: '#a8743c', props: ['🌵', '🪨', '🦴'], bg: '#6a3a1a33' },
  { name: 'Soggy Swamp', sky: ['#5f8a7a', '#b8d4b0'], far: '#4a6a4a', near: '#365a3a', ground: '#4a6a32', dirt: '#3e4a2a', props: ['🪷', '🐸', '🌿'], bg: '#1a3a2a33' },
  { name: 'Moonlit Harvest', sky: ['#101634', '#3a3a7a'], far: '#2a2e5a', near: '#1e2448', ground: '#2a3a3a', dirt: '#2a2622', props: ['🕯️', '🌾', '🪦'], bg: '#1a1a3a55' },
];
const STAGES = 60, AURA = 170, HONK_R = 230;
const UPS = [
  { k: 'hero', e: '🪿', name: 'Goose Knight', base: 40, desc: (l) => `HP ${Math.round(heroHp(l))} · peck ${Math.round(heroDmg(l))}` },
  { k: 'honk', e: '📣', name: 'Mega Honk', base: 45, desc: (l) => `${Math.round(honkDmg(l))} damage · ${honkCd(l).toFixed(1)}s cooldown` },
  { k: 'grain', e: '🌾', name: 'Grain Silo', base: 35, desc: (l) => `${grainRate(l).toFixed(1)} grain/s · holds ${grainCap(l)}` },
  { k: 'barn', e: '🏠', name: 'Barn Walls', base: 30, desc: (l) => `Barn HP ${Math.round(barnHp(l))}` },
];
const heroHp = (l) => 300 * (1 + .25 * (l - 1)), heroDmg = (l) => 18 * (1 + .25 * (l - 1));
const honkDmg = (l) => 70 * (1 + .3 * (l - 1)), honkCd = (l) => 15 - .7 * (l - 1);
const grainRate = (l) => 9 * (1 + .12 * (l - 1)), grainCap = (l) => 120 + 40 * (l - 1);
const barnHp = (l) => 700 * (1 + .3 * (l - 1)), unitMul = (l) => 1 + .25 * (l - 1);
const upCost = (base, l) => Math.round(base * Math.pow(1.5, l - 1)), MAXLV = 10;
const TITLES = [[0, '🥚', 'Egg'], [6, '🐣', 'Gosling'], [24, '🛡️', 'Barn Guard'], [54, '📣', 'Honk Sergeant'], [96, '🎖️', 'Feather Captain'], [138, '⚔️', 'Goose General'], [170, '👑', 'Legend of the Pond'], [180, '🪿', 'Supreme Honker']];

// ---- save ----
const SAVE_KEY = 'gooseguard-save';
let save = { stars: {}, acorns: 0, best: 0, up: { hero: 1, honk: 1, grain: 1, barn: 1 }, u: UNITS.map(() => 1) };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = { ...save, ...s, up: { ...save.up, ...s.up }, u: UNITS.map((_, i) => s.u?.[i] || 1) }; } catch {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch {} };
const cleared = () => { let n = 0; while (save.stars[n + 1]) n++; return n; };
const reached = () => Math.min(STAGES, cleared() + 1);

    ctx.strokeStyle = '#fff8'; ctx.lineWidth = 1.5; ctx.strokeRect(mx + S.cam * k, my - 7, Math.min(mw, viewW * k), 14);
    for (const e of S.ents) { ctx.fillStyle = e.side === 1 ? '#bfffb0' : e.boss ? '#ff2a2a' : '#ff8a6a'; ctx.fillRect(mx + e.x * k - 1.5, my - 2, e.boss ? 6 : 3, 4); }
    if (h.dead <= 0) { ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(mx + h.x * k, my, 4.5, 0, 7); ctx.fill(); }
    ctx.font = `14px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🏠', mx + 6, my); if (S.tower) ctx.fillText('🌿', mx + mw - 6, my);
    ctx.textBaseline = 'alphabetic';
  }
  if (S.banner && S.banner.t > 0 && !S.bot) {
    const a = Math.min(1, S.banner.t * 2, (2.6 - S.banner.t) * 4); ctx.globalAlpha = a; ctx.textAlign = 'center';
    ctx.font = `900 ${Math.min(34, W / 13)}px ${FONT}`; ctx.lineWidth = 6; ctx.strokeStyle = '#000a'; ctx.fillStyle = '#fff';
    const y = Math.max(130, groundY - 220 * sc); ctx.strokeText(S.banner.a, W / 2, y); ctx.fillText(S.banner.a, W / 2, y);
    if (S.banner.b) { ctx.font = `800 16px ${FONT}`; ctx.lineWidth = 4; ctx.strokeText(S.banner.b, W / 2, y + 26); ctx.fillStyle = '#ffd84a'; ctx.fillText(S.banner.b, W / 2, y + 26); }
    ctx.globalAlpha = 1;
  }
}

// ---- loop ----
let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, .05); lastT = now;
  if (S) for (let i = 0; i < S.speed; i++) update(dt);
  draw(); hud();
  requestAnimationFrame(loop);
}
layout();
$('mStars').textContent = totalStars() ? `${title()[1]} ${title()[2]} · ⭐ ${totalStars()}/180` : '60 stages · 6 bosses · endless leaderboard';
demo(); // the menu sits over a battle the bot plays by itself
requestAnimationFrame(loop);
window.gg = { get S() { return S; }, start, update, summon, honk, buy, finish, stageCfg, get save() { return save; }, UNITS, go, openMap }; // for scripts/check-goose-guard.mjs and the preview recorder
</script>
