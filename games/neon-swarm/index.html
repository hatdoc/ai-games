<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Neon Swarm</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07070f; color: #fff; font: 16px system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #home { position: fixed; top: 12px; left: 12px; color: #fffc; text-decoration: none; font-size: 14px; font-weight: 700;
    background: #0008; padding: 6px 10px; border-radius: 8px; }
  #over { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center;
    gap: 10px; background: #07070fcc; text-align: center; overflow-y: auto; padding: 16px 0; box-sizing: border-box; }
  #over[hidden] { display: none; }
  #over h2 { margin: 0; font-size: 18px; letter-spacing: 2px; opacity: .8; }
  #final { font-size: 64px; font-weight: 900; line-height: 1; color: #5ff; text-shadow: 0 0 20px #0ff8; }
  #newBest { color: #ffd84a; font-weight: 800; }
  #stats { opacity: .7; }
  .btns { display: flex; gap: 10px; margin-top: 6px; }
  button { font: 700 16px system-ui, sans-serif; padding: 12px 22px; border: 0; border-radius: 12px; cursor: pointer; }
  #retry { background: #5ff; color: #07070f; }
  #share { background: #0006; color: #fff; border: 1px solid #fff6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- Shown only when played standalone; inside the blog's iframe the site navbar covers it. -->
<a id="home" href="https://rank-game.com/">← Home</a>
<script>if (top !== self) home.remove();</script>
<div id="over" hidden>
  <h2>SCORE</h2>
  <div id="final">0</div>
  <div id="newBest" hidden>★ NEW BEST! ★</div>
  <div id="stats"></div>
  <div id="lb"></div>
  <div class="btns"><button id="retry">Play again</button><button id="share">Share</button></div>
  <div id="ad"></div>
</div>
<script src="../leaderboard.js"></script>
<script src="../ad.js"></script>
<script>adBanner(document.getElementById('ad'));</script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), $ = (id) => document.getElementById(id);
let W, H;
function resize() {
  const dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

const lb = leaderboard($('lb'), 'neon-swarm');
let best = 0;
try { best = +localStorage.getItem('neonswarm-best') || 0; } catch {}

const TYPES = {
  grunt:  { r: 12, speed: 85,  hp: 1, pts: 10, color: '#ff4fa3' },
  runner: { r: 9,  speed: 165, hp: 1, pts: 15, color: '#ffd84a' },
  brute:  { r: 22, speed: 52,  hp: 7, pts: 60, color: '#a66bff' },
  shooter: { r: 11, speed: 75, hp: 2, pts: 30, color: '#ff8a3d' }, // keeps its distance and fires at you
  charger: { r: 13, speed: 70, hp: 3, pts: 45, color: '#ff3b3b' }, // stops, aims (warning line), then lunges
};
const POWERS = {
  rapid:  { icon: '⚡', color: '#ffd84a', label: 'RAPID FIRE' },
  spread: { icon: '🔱', color: '#5ff',    label: 'TRIPLE SHOT' },
  shield: { icon: '🛡️', color: '#6f6',    label: 'SHIELD' },
  bomb:   { icon: '💣', color: '#ff7a3d', label: 'BOOM!' },
  heart:  { icon: '❤️', color: '#ff4f6a', label: '+1 HEART' },
};

let state = 'ready', P, run, enemies, bullets, ebullets, parts, powers, popups, overAt;

function reset() {
  P = { x: W / 2, y: H / 2, r: 12, dir: [1, 0], inv: 0, dashT: 0, dashCd: 0, shield: false };
  run = { t: 0, score: 0, kills: 0, chain: 0, mult: 1, multT: 0, hearts: 3, fireT: 0, rapidT: 0, spreadT: 0,
    spawnT: 1, swarmT: 20, swarms: 0, shake: 0 };
  enemies = []; bullets = []; ebullets = []; parts = []; powers = []; popups = [];
}

// ---------- input ----------
const keys = {};
let joy = null;
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if (['Space', 'ShiftLeft', 'ShiftRight', 'Enter'].includes(e.code)) {
    if (state === 'play' && e.code !== 'Enter') dash();
    else if (!e.repeat) startOrRetry();
  }
});
addEventListener('keyup', (e) => (keys[e.code] = false));
addEventListener('blur', () => { for (const k in keys) keys[k] = false; joy = null; });
cv.addEventListener('pointerdown', (e) => {
  if (state !== 'play') return startOrRetry();
  if (joy) return dash(); // second finger
  joy = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY, t: performance.now() };
});
addEventListener('pointermove', (e) => { if (joy && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
const release = (e) => {
  if (!joy || e.pointerId !== joy.id) return;
  if (performance.now() - joy.t < 180 && Math.hypot(joy.x - joy.ox, joy.y - joy.oy) < 12) dash(); // quick tap
  joy = null;
};
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

function moveDir() {
  let x = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let y = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  if (joy) {
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, m = Math.hypot(dx, dy);
    if (m > 6) { x = dx / Math.max(m, 40); y = dy / Math.max(m, 40); }
  }
  const m = Math.hypot(x, y);
  return m > 1 ? [x / m, y / m] : [x, y];
}

function startOrRetry() {
  ensureAudio();
  if (state === 'ready' || (!$('over').hidden && performance.now() - overAt > 1200)) {
    $('over').hidden = true; reset(); state = 'play';
  }
}

const DASH_CD = 2;
function dash() {
  if (P.dashCd > 0) return;
  P.dashT = 0.18; P.dashCd = DASH_CD; P.inv = Math.max(P.inv, 0.25);
  tone(520, 0.12, 'triangle', 0.08);
}

// ---------- audio ----------
let ac;
function ensureAudio() { try { ac ||= new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
function tone(f, d, type, v) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(ac.destination); o.start(); o.stop(t + d);
}

// ---------- game ----------
function spawnEnemy(kind, x, y) {
  const T = TYPES[kind];
  enemies.push({ ...T, kind, x, y, hp: T.hp, flash: 0, cd: 1 + Math.random() * 2, speed: T.speed * (1 + run.t / 75), mode: 'walk' });
}
function spawnAtEdge() {
  const r = Math.random(), t = run.t;
  const kind = t > 30 && r < 0.12 ? 'brute' : t > 28 && r < 0.24 ? 'charger' : t > 15 && r < 0.38 ? 'shooter' : t > 5 && r < 0.6 ? 'runner' : 'grunt';
  const side = Math.random() * 4 | 0, m = 30;
  const x = side === 0 ? -m : side === 1 ? W + m : Math.random() * W;
  const y = side === 2 ? -m : side === 3 ? H + m : Math.random() * H;
  spawnEnemy(kind, x, y);
}
function swarm() {
  run.swarms++;
  const n = 18 + run.swarms * 8, R = Math.max(W, H) * 0.6;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    spawnEnemy(run.swarms > 1 && i % 3 === 0 ? 'runner' : 'grunt', P.x + Math.cos(a) * R, P.y + Math.sin(a) * R);
  }
  popup('SWARM!', '#ff4fa3');
  tone(150, 0.5, 'triangle', 0.12);
}

function fire() {
  let target = null, bd = Infinity;
  for (const e of enemies) {
    if (e.x < -10 || e.x > W + 10 || e.y < -10 || e.y > H + 10) continue;
    const d = (e.x - P.x) ** 2 + (e.y - P.y) ** 2;
    if (d < bd) { bd = d; target = e; }
  }
  if (!target) return false;
  const a = Math.atan2(target.y - P.y, target.x - P.x);
  for (const off of run.spreadT > 0 ? [-0.22, 0, 0.22] : [0]) {
    bullets.push({ x: P.x, y: P.y, vx: Math.cos(a + off) * 640, vy: Math.sin(a + off) * 640 });
  }
  return true;
}

function burst(x, y, color, n, spd = 220) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0.5 + Math.random() * 0.3, color });
  }
}
const popup = (text, color = '#fff') => popups.push({ text, color, t: 1.2 });

function kill(e) {
  e.dead = true;
  run.kills++; run.chain++; run.multT = 2;
  run.mult = Math.min(10, 1 + Math.floor(run.chain / 6));
  run.score += e.pts * run.mult;
  burst(e.x, e.y, e.color, e.kind === 'brute' ? 30 : 12);
  run.shake = Math.max(run.shake, e.kind === 'brute' ? 8 : 2);
  tone(260 + run.mult * 50, 0.06, 'square', 0.035);
  if (Math.random() < (e.kind === 'brute' ? 0.45 : e.kind === 'charger' ? 0.1 : 0.02)) {
    const pool = ['rapid', 'rapid', 'spread', 'spread', 'shield', 'bomb'];
    if (e.kind === 'brute' && run.hearts < 3) pool.push('heart', 'heart');
    powers.push({ x: e.x, y: e.y, type: pool[Math.random() * pool.length | 0], t: 9 });
  }
}

function blast(x, y, R) {
  for (const e of enemies) if ((e.x - x) ** 2 + (e.y - y) ** 2 < R * R) { e.dead = true; burst(e.x, e.y, e.color, 8); }
  for (const b of ebullets) if ((b.x - x) ** 2 + (b.y - y) ** 2 < R * R) b.dead = true;
  for (let i = 0; i < 40; i++) parts.push({ x, y, vx: Math.cos(i / 6.4) * 500, vy: Math.sin(i / 6.4) * 500, t: 0.35, color: '#fff' });
}

function hurt() {
  if (P.shield) {
    P.shield = false; P.inv = 1; blast(P.x, P.y, 80);
    tone(300, 0.2, 'sine', 0.12);
    return;
  }
  run.hearts--; P.inv = 1.6; run.shake = 16;
  blast(P.x, P.y, 55); // a little breathing room after a hit
  tone(90, 0.35, 'sawtooth', 0.15);
  navigator.vibrate?.(80);
  if (run.hearts <= 0) gameOver();
}

function pickUp(p) {
  const T = POWERS[p.type];
  popup(T.label, T.color);
  tone(880, 0.15, 'sine', 0.15);
  if (p.type === 'rapid') run.rapidT = 8;
  if (p.type === 'spread') run.spreadT = 8;
  if (p.type === 'shield') P.shield = true;
  if (p.type === 'heart') run.hearts = Math.min(3, run.hearts + 1);
  if (p.type === 'bomb') { for (const e of enemies) if (!e.dead) kill(e); run.shake = 20; }
}

function gameOver() {
  state = 'over'; overAt = performance.now();
  burst(P.x, P.y, '#5ff', 60, 400);
  const isBest = run.score > best;
  if (isBest) { best = run.score; try { localStorage.setItem('neonswarm-best', best); } catch {} }
  setTimeout(() => {
    $('final').textContent = run.score.toLocaleString();
    $('newBest').hidden = !isBest;
    $('stats').textContent = `${run.kills} kills · survived ${fmtTime(run.t)} · best ${best.toLocaleString()}`;
    $('over').hidden = false;
    lb.show(run.score);
  }, 1000);
}
const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

$('retry').onclick = startOrRetry;
$('share').onclick = async (e) => {
  const text = `I scored ${run.score.toLocaleString()} in Neon Swarm and survived ${fmtTime(run.t)}. Can you beat me?`, url = 'https://rank-game.com/games/neon-swarm';
  try {
    if (navigator.share) await navigator.share({ title: 'Neon Swarm', text, url });
    else { await navigator.clipboard.writeText(`${text} ${url}`); e.target.textContent = 'Copied!'; }
  } catch {}
};

function update(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.t -= dt; }
  parts = parts.filter((p) => p.t > 0);
  for (const p of popups) p.t -= dt;
  popups = popups.filter((p) => p.t > 0);
  if (state !== 'play') return;

  run.t += dt;
  run.shake *= 0.85;
  if ((run.multT -= dt) <= 0) { run.chain = 0; run.mult = 1; }
  run.rapidT -= dt; run.spreadT -= dt;

  // player
  const [mx, my] = moveDir();
  if (mx || my) P.dir = [mx / Math.hypot(mx, my), my / Math.hypot(mx, my)];
  if (P.dashT > 0) {
    P.dashT -= dt;
    P.x += P.dir[0] * 950 * dt; P.y += P.dir[1] * 950 * dt;
    parts.push({ x: P.x, y: P.y, vx: 0, vy: 0, t: 0.25, color: '#5ff' });
  } else {
    P.x += mx * 240 * dt; P.y += my * 240 * dt;
  }
  P.x = Math.max(P.r, Math.min(W - P.r, P.x));
  P.y = Math.max(P.r, Math.min(H - P.r, P.y));
  P.dashCd -= dt; P.inv -= dt;

  // shooting: gets faster with kills, much faster with RAPID FIRE
  if ((run.fireT -= dt) <= 0 && fire()) {
    run.fireT = Math.max(0.13, 0.32 - run.kills * 0.0006) / (run.rapidT > 0 ? 2.5 : 1);
  }
  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  bullets = bullets.filter((b) => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

  // spawning
  if ((run.spawnT -= dt) <= 0) {
    spawnAtEdge();
    run.spawnT = Math.max(0.08, 0.55 - run.t * 0.014) * (0.6 + Math.random() * 0.8);
  }
  if ((run.swarmT -= dt) <= 0) { run.swarmT = 20; swarm(); }

  // enemies chase the player
  for (const e of enemies) {
    const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
    const onScreen = e.x > 30 && e.x < W - 30 && e.y > 30 && e.y < H - 30;
    const back = e.kind === 'shooter' && d < 230 && onScreen ? -0.6 : 1;
    e.flash -= dt;
    if (e.kind === 'charger' && e.mode !== 'walk') { // aim (frozen, locked direction) → lunge
      if ((e.modeT -= dt) <= 0) {
        if (e.mode === 'aim') { e.mode = 'lunge'; e.modeT = 0.45; tone(180, 0.15, 'sawtooth', 0.05); }
        else { e.mode = 'walk'; e.cd = 2 + Math.random(); }
      }
      if (e.mode === 'lunge') { e.x += e.ax * 620 * dt; e.y += e.ay * 620 * dt; }
      continue;
    }
    e.x += (dx / d) * e.speed * back * dt; e.y += (dy / d) * e.speed * back * dt;
    if (e.kind === 'charger' && onScreen && d < 320 && (e.cd -= dt) <= 0) {
      e.mode = 'aim'; e.modeT = 0.6; e.ax = dx / d; e.ay = dy / d;
    }
    if (e.kind === 'shooter' && onScreen && (e.cd -= dt) <= 0) {
      e.cd = 1.4 + Math.random() * 0.8;
      ebullets.push({ x: e.x, y: e.y, vx: (dx / d) * 280, vy: (dy / d) * 280 });
    }
  }
  // ponytail: O(bullets × enemies) collision; a spatial grid if counts ever reach the thousands
  for (const b of bullets) {
    for (const e of enemies) {
      if (e.dead || (b.x - e.x) ** 2 + (b.y - e.y) ** 2 > (e.r + 4) ** 2) continue;
      b.dead = true; e.hp--; e.flash = 0.08;
      e.x += b.vx * 0.012; e.y += b.vy * 0.012; // knockback
      if (e.hp <= 0) kill(e);
      break;
    }
  }
  for (const b of ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  ebullets = ebullets.filter((b) => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);
  if (P.inv <= 0) {
    const hit = ebullets.find((b) => (b.x - P.x) ** 2 + (b.y - P.y) ** 2 < (P.r + 3) ** 2);
    if (hit) { hit.dead = true; hurt(); }
  }
  if (P.inv <= 0) {
    for (const e of enemies) {
      if (!e.dead && (e.x - P.x) ** 2 + (e.y - P.y) ** 2 < (e.r + P.r - 3) ** 2) { hurt(); break; }
    }
  }
  enemies = enemies.filter((e) => !e.dead);

  for (const p of powers) {
    p.t -= dt;
    if ((p.x - P.x) ** 2 + (p.y - P.y) ** 2 < 30 ** 2) { p.t = 0; pickUp(p); }
  }
  powers = powers.filter((p) => p.t > 0);
}

function glow(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.18; ctx.beginPath(); ctx.arc(x, y, r * 2, 0, 7); ctx.fill();
  ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}

function draw() {
  ctx.fillStyle = '#07070f'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (run.shake > 0.5) ctx.translate((Math.random() - 0.5) * run.shake, (Math.random() - 0.5) * run.shake);

  // grid
  ctx.strokeStyle = '#3a3aa022'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x < W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y < H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  ctx.globalCompositeOperation = 'lighter';
  for (const p of powers) {
    if (p.t < 2 && Math.floor(p.t * 8) % 2) continue; // blink before vanishing
    glow(p.x, p.y, 13, POWERS[p.type].color);
  }
  for (const e of enemies) {
    glow(e.x, e.y, e.r, e.flash > 0 ? '#fff' : e.color);
    if (e.kind === 'brute') { ctx.fillStyle = '#07070f'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.45, 0, 7); ctx.fill(); }
    if (e.mode === 'aim') { // warning line where it's about to lunge
      ctx.strokeStyle = `rgba(255,59,59,${0.3 + 0.5 * Math.abs(Math.sin(e.modeT * 30))})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + e.ax * 280, e.y + e.ay * 280); ctx.stroke();
    }
  }
  ctx.fillStyle = '#bff';
  for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, 7); ctx.fill(); }
  for (const b of ebullets) glow(b.x, b.y, 5, '#ff8a3d');
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;

  if (state === 'play' && !(P.inv > 0 && P.dashT <= 0 && Math.floor(P.inv * 12) % 2)) {
    glow(P.x, P.y, P.r, '#5ff');
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(P.x + P.dir[0] * 6, P.y + P.dir[1] * 6, 4, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  if (state === 'play') {
    if (P.shield) { ctx.strokeStyle = '#6f6'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(P.x, P.y, P.r + 9, 0, 7); ctx.stroke(); }
    if (P.dashCd > 0) { // dash recharge arc
      ctx.strokeStyle = '#5ff8'; ctx.lineWidth = 3; ctx.beginPath();
      ctx.arc(P.x, P.y, P.r + 5, -Math.PI / 2, -Math.PI / 2 + (1 - P.dashCd / DASH_CD) * Math.PI * 2); ctx.stroke();
    }
  }
  ctx.font = '20px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of powers) if (!(p.t < 2 && Math.floor(p.t * 8) % 2)) ctx.fillText(POWERS[p.type].icon, p.x, p.y + 1);
  ctx.restore();

  // joystick
  if (joy && state === 'play') {
    ctx.strokeStyle = '#fff3'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 40, 0, 7); ctx.stroke();
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, m = Math.max(1, Math.hypot(dx, dy) / 40);
    ctx.fillStyle = '#fff4'; ctx.beginPath(); ctx.arc(joy.ox + dx / m, joy.oy + dy / m, 16, 0, 7); ctx.fill();
  }

  // HUD
  ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff';
  if (state === 'ready') {
    ctx.font = '900 44px system-ui'; ctx.fillStyle = '#5ff'; ctx.fillText('NEON SWARM', W / 2, H * 0.32);
    ctx.fillStyle = '#fff'; ctx.font = '600 15px system-ui';
    const touch = matchMedia('(pointer: coarse)').matches;
    ctx.fillText(touch ? 'Drag to move · Tap to dash' : 'WASD / Arrows to move · Space to dash', W / 2, H * 0.32 + 38);
    ctx.fillText('You fire automatically. Survive the swarm!', W / 2, H * 0.32 + 62);
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 300);
    ctx.font = '800 18px system-ui'; ctx.fillText(touch ? 'Tap to start' : 'Press Space to start', W / 2, H * 0.32 + 104);
    ctx.globalAlpha = 1;
    if (best) { ctx.font = '600 14px system-ui'; ctx.fillText(`Best: ${best.toLocaleString()}`, W / 2, H * 0.32 + 134); }
  } else if (state === 'play') {
    ctx.font = '900 34px system-ui'; ctx.fillText(run.score.toLocaleString(), W / 2, 48);
    if (run.mult > 1) {
      ctx.font = `900 ${18 + run.mult * 1.5}px system-ui`; ctx.fillStyle = `hsl(${50 - run.mult * 5},100%,60%)`;
      ctx.fillText(`×${run.mult}`, W / 2, 80);
    }
    ctx.textAlign = 'right'; ctx.font = '20px system-ui'; ctx.fillStyle = '#fff';
    ctx.fillText('❤️'.repeat(run.hearts) + '🖤'.repeat(Math.max(0, 3 - run.hearts)), W - 12, 34);
    ctx.font = '600 13px system-ui'; ctx.globalAlpha = 0.7;
    ctx.fillText(fmtTime(run.t), W - 12, 56);
    const buffs = [run.rapidT > 0 && '⚡', run.spreadT > 0 && '🔱'].filter(Boolean).join(' ');
    if (buffs) { ctx.font = '18px system-ui'; ctx.globalAlpha = 1; ctx.fillText(buffs, W - 12, 82); }
    ctx.globalAlpha = 1; ctx.textAlign = 'center';
  }
  popups.forEach((p, i) => {
    ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.color;
    ctx.font = '900 28px system-ui'; ctx.fillText(p.text, W / 2, H * 0.3 + i * 34 - (1.2 - p.t) * 30);
  });
  ctx.globalAlpha = 1;
}

let last = performance.now();
function loop(now) {
  update(Math.min((now - last) / 1000, 0.05));
  last = now;
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
