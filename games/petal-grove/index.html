<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Petal Grove</title>
<script src="../cloudsave.js" data-game="petal-grove" data-keys="petalgrove-save"></script>
<style>
  :root { --card: rgba(255, 250, 240, .88); --ink: #3d3428; --mut: #8a7c68; --line: rgba(80, 60, 30, .14); --accent: #d9737f; --leaf: #6f9e57; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6d0; color: var(--ink);
    font: 15px "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 6px 22px rgba(60, 40, 20, .14);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #home { position: fixed; top: 10px; left: 10px; color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 800; padding: 6px 10px; }
  #top { position: fixed; top: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 96px); }
  .pill { display: flex; align-items: center; gap: 6px; padding: 6px 11px; font-weight: 800; font-size: 13px; white-space: nowrap; }
  .pill b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .tb { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 6px 11px; font-weight: 800; font-size: 13px; }
  #tray { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; }
  .tool { border: 0; background: none; border-radius: 12px; padding: 6px 10px; min-width: 62px; font-weight: 800; font-size: 11px; color: var(--mut);
    display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tool canvas, .tool .ic { width: 34px; height: 34px; font-size: 24px; line-height: 34px; text-align: center; }
  .tool.on { background: rgba(217, 115, 127, .16); color: var(--accent); }
  #toast { position: fixed; left: 50%; top: 58px; transform: translateX(-50%); padding: 9px 16px; font-weight: 800; pointer-events: none;
    opacity: 0; transition: opacity .4s, transform .4s; white-space: nowrap; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(60, 50, 30, .25); padding: 12px; }
  .modal.on { display: flex; }
  .panel { width: min(520px, 100%); max-height: calc(100dvh - 24px); overflow-y: auto; padding: 18px; box-sizing: border-box; }
  .panel h2 { margin: 0 0 2px; font-size: 21px; }
  .sub { color: var(--mut); font-size: 13px; }
  .x { float: right; border: 0; background: none; font-size: 24px; line-height: 1; color: var(--mut); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; margin-top: 12px; }
  .it { border: 1px solid var(--line); border-radius: 14px; padding: 8px 6px; text-align: center; background: rgba(255, 255, 255, .5); font-size: 12px; }
  .it canvas { width: 72px; height: 72px; display: block; margin: 0 auto; }
  .it b { display: block; font-size: 13px; }
  .it small { color: var(--mut); display: block; min-height: 30px; }
  .it.sel { outline: 2px solid var(--accent); }
  .it button { margin-top: 6px; border: 0; border-radius: 10px; padding: 6px 10px; font-weight: 800; background: var(--accent); color: #fff; width: 100%; }
  .it button:disabled { background: rgba(0, 0, 0, .1); color: var(--mut); cursor: default; }
  .it.locked canvas { filter: grayscale(1) opacity(.35); }
  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tabs button { border: 1px solid var(--line); background: none; border-radius: 10px; padding: 5px 10px; font-weight: 800; font-size: 12px; color: var(--mut); }
  .tabs button.on { background: var(--accent); color: #fff; border-color: transparent; }
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; transition: opacity 1s; }
  #title h1 { margin: 0; font-size: clamp(44px, 9vw, 88px); color: #fff; font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 400;
    text-shadow: 0 4px 24px rgba(80, 60, 40, .35); letter-spacing: 1px; }
  #title p { margin: 4px 0 0; color: #fff; font-weight: 700; text-shadow: 0 2px 10px rgba(60, 40, 20, .4); }
  #title .go { margin-top: 22px; padding: 9px 18px; font-weight: 800; animation: breathe 3s infinite; }
  @keyframes breathe { 50% { opacity: .6; } }
  @media (max-width: 560px) { .lbl { display: none; } .tool { min-width: 52px; padding: 5px 6px; } .pill, .tb { padding: 5px 8px; font-size: 12px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- Shown only when played standalone; inside the blog's iframe the site navbar covers it. -->
<a id="home" class="card" href="https://rank-game.com/">← Home</a>
<script>if (top !== self) home.remove();</script>
<div id="top">
  <div class="pill card">🌸 <b id="petals">0</b></div>
  <div class="pill card" id="season">🌱 Spring</div>
  <button class="tb" id="seedBtn">🌱<span class="lbl"> Seeds</span></button>
  <button class="tb" id="decoBtn">🏡<span class="lbl"> Garden</span></button>
  <button class="tb" id="bookBtn">📔<span class="lbl"> Journal</span></button>
  <button class="tb" id="musicBtn" aria-label="Toggle music">🎵</button>
</div>
<div id="tray" class="card">
  <button class="tool on" data-tool="plant"><canvas id="seedIc" width="68" height="68"></canvas><span id="seedName">Daisy</span></button>
  <button class="tool" data-tool="water"><div class="ic">💧</div>Water</button>
  <button class="tool" data-tool="deco"><canvas id="decoIc" width="68" height="68"></canvas><span id="decoName">Decor</span></button>
  <button class="tool" data-tool="clear"><div class="ic">🧤</div>Clear</button>
</div>
<div id="toast" class="card"></div>
<div id="title">
  <h1>Petal Grove</h1>
  <p>Grow a garden. Welcome its visitors. Take your time.</p>
  <div class="go card">Tap anywhere to begin</div>
</div>
<div class="modal" id="seeds"><div class="panel card">
  <button class="x" data-close>×</button>
  <h2>Seeds</h2><div class="sub">Pick a flower to plant. New seeds are bought once with petals and are yours forever.</div>
  <div class="grid" id="seedGrid"></div>
</div></div>
<div class="modal" id="decos"><div class="panel card">
  <button class="x" data-close>×</button>
  <h2>Garden</h2><div class="sub">Make room for more flowers, and add touches that visitors love.</div>
  <div class="grid" id="decoGrid"></div>
</div></div>
<div class="modal" id="book"><div class="panel card" style="width:min(620px,100%)">
  <button class="x" data-close>×</button>
  <h2>Garden Journal</h2><div class="sub" id="bookSub"></div>
  <div class="tabs"><button data-tab="visitors" class="on">Visitors</button><button data-tab="flowers">Flowers</button></div>
  <div class="grid" id="bookGrid"></div>
</div></div>
<script>
// Petal Grove — original game: code, art (canvas-drawn) and music (generated live) all made from scratch.
const cv = document.getElementById('c'), $ = (id) => document.getElementById(id);
let ctx = cv.getContext('2d'); // swapped briefly when drawing journal portraits
const rand = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => '#' + hex(a).map((v, i) => Math.round(lerp(v, hex(b)[i], t)).toString(16).padStart(2, '0')).join('');
let W, H, dpr;

// ---------- data ----------
// grow: seconds to bloom · yield petals every `every` seconds once in bloom
const FLOWERS = [
  { id: 'daisy', name: 'Daisy', cost: 0, grow: 30, yield: 1, every: 8, h: 0.55, kind: 'radial', n: 13, petal: '#ffffff', center: '#f4c430', note: 'Cheerful and quick. Every garden starts here.' },
  { id: 'tulip', name: 'Tulip', cost: 25, grow: 45, yield: 2, every: 10, h: 0.6, kind: 'cup', petal: '#ef5a6f', center: '#7a2a35', note: 'A cup of colour on a tall green stem.' },
  { id: 'poppy', name: 'Poppy', cost: 60, grow: 60, yield: 3, every: 12, h: 0.62, kind: 'radial', n: 4, wide: true, petal: '#e8462e', center: '#1e1a18', note: 'Paper-thin petals that flutter in the breeze.' },
  { id: 'lavender', name: 'Lavender', cost: 120, grow: 75, yield: 3, every: 10, h: 0.7, kind: 'spike', petal: '#9b7fd0', center: '#6c55a8', note: 'Smells of summer. Bees can\'t resist it.' },
  { id: 'sunflower', name: 'Sunflower', cost: 250, grow: 120, yield: 6, every: 15, h: 1.0, kind: 'radial', n: 20, big: true, petal: '#f7c235', center: '#6b4220', note: 'Turns its face to follow the sun.' },
  { id: 'bluebell', name: 'Bluebell', cost: 400, grow: 90, yield: 5, every: 12, h: 0.55, kind: 'bells', petal: '#6d8fe0', center: '#4a68c0', note: 'Nodding blue bells from old woodlands.' },
  { id: 'rose', name: 'Rose', cost: 700, grow: 150, yield: 9, every: 15, h: 0.66, kind: 'rose', petal: '#d93c5c', center: '#9e1f3c', note: 'Layer upon layer of velvet petals.' },
  { id: 'lily', name: 'Lily', cost: 1100, grow: 180, yield: 12, every: 16, h: 0.75, kind: 'star', n: 6, petal: '#fbe3ec', center: '#e88aa8', note: 'Six pointed petals, freckled pink inside.' },
  { id: 'peony', name: 'Peony', cost: 1800, grow: 210, yield: 16, every: 16, h: 0.62, kind: 'fluff', petal: '#f6a8c0', center: '#f088a8', note: 'Fluffy as a cloud, heavy with perfume.' },
  { id: 'cherry', name: 'Cherry Tree', cost: 3000, grow: 300, yield: 30, every: 20, h: 1.5, kind: 'tree', petal: '#f8c4d4', center: '#e898b0', note: 'A little tree that showers the garden in pink.' },
  { id: 'moonflower', name: 'Moonflower', cost: 4500, grow: 200, yield: 25, every: 14, h: 0.7, kind: 'trumpet', petal: '#f4f7ff', center: '#c8d8ff', night: true, note: 'Opens only after dark, glowing softly. Triple petals at night.' },
  { id: 'snowdrop', name: 'Snowdrop', cost: 6000, grow: 150, yield: 20, every: 12, h: 0.45, kind: 'bells', petal: '#ffffff', center: '#bfe0c0', winter: true, note: 'Blooms through the snow. Triple petals in winter.' },
  { id: 'lotus', name: 'Lotus', cost: 9000, grow: 240, yield: 45, every: 18, h: 0.5, kind: 'star', n: 10, petal: '#ffc8dc', center: '#ffe6a0', note: 'Rises from the mud, perfectly clean.' },
  { id: 'goldlotus', name: 'Golden Lotus', cost: 20000, grow: 420, yield: 120, every: 20, h: 0.55, kind: 'star', n: 12, petal: '#ffd86a', center: '#fff3c0', glow: true, note: 'Said to bloom once in a thousand years. Yours blooms forever.' },
];
const FL = Object.fromEntries(FLOWERS.map((f) => [f.id, f]));
const DECOS = [
  { id: 'stone', name: 'Stepping Stones', cost: 30, note: 'A gentle path.' },
  { id: 'lantern', name: 'Lantern', cost: 150, note: 'Glows warmly at night.' },
  { id: 'bench', name: 'Bench', cost: 300, note: 'Somewhere to sit and watch.' },
  { id: 'birdbath', name: 'Birdbath', cost: 500, note: 'Birds stop by for a splash.' },
  { id: 'chime', name: 'Wind Chime', cost: 600, note: 'Sings softly in the breeze.' },
  { id: 'pond', name: 'Pond', cost: 900, note: 'Still water for frogs and dragonflies.' },
  { id: 'sprinkler', name: 'Sprinkler', cost: 1200, note: 'Keeps its neighbours watered.' },
  { id: 'gnome', name: 'Garden Gnome', cost: 2000, note: 'Watches over everything.' },
];
const DC = Object.fromEntries(DECOS.map((d) => [d.id, d]));
// visitors: when `want` holds, they may arrive; each one present adds +6% petals
const cnt = (id) => garden.filter((p) => p?.f === id && p.g >= 1).length;
const blooms = () => garden.filter((p) => p?.f && p.g >= 1).length;
const has = (id) => garden.some((p) => p?.d === id);
const VISITORS = [
  { id: 'cabbage', name: 'Cabbage White', kind: 'butterfly', col: ['#f8f8f2', '#d8d8cc'], hint: 'Any three flowers in bloom.', want: () => blooms() >= 3 && !isNight() },
  { id: 'bee', name: 'Honeybee', kind: 'bee', hint: 'Lavender or sunflowers.', want: () => (cnt('lavender') + cnt('sunflower')) >= 2 && !isNight() },
  { id: 'ladybug', name: 'Ladybird', kind: 'ladybug', hint: 'A rose in bloom.', want: () => cnt('rose') >= 1 && !isNight() },
  { id: 'monarch', name: 'Monarch', kind: 'butterfly', col: ['#f08a24', '#2a1a10'], hint: 'Three poppies.', want: () => cnt('poppy') >= 3 && !isNight() },
  { id: 'morpho', name: 'Blue Morpho', kind: 'butterfly', col: ['#3a8ff0', '#173a7a'], hint: 'Two bluebells.', want: () => cnt('bluebell') >= 2 && !isNight() },
  { id: 'emperor', name: 'Purple Emperor', kind: 'butterfly', col: ['#9a6ae0', '#3a2060'], hint: 'Three lavender.', want: () => cnt('lavender') >= 3 && !isNight() },
  { id: 'robin', name: 'Robin', kind: 'bird', col: ['#7a5a40', '#e2703a'], hint: 'A birdbath.', want: () => has('birdbath') && !isNight() },
  { id: 'hummingbird', name: 'Hummingbird', kind: 'hummer', hint: 'Tulips and lilies together.', want: () => cnt('tulip') >= 2 && cnt('lily') >= 1 && !isNight() },
  { id: 'frog', name: 'Pond Frog', kind: 'frog', hint: 'A pond.', want: () => has('pond') },
  { id: 'dragonfly', name: 'Dragonfly', kind: 'dragonfly', hint: 'A pond and a lotus.', want: () => has('pond') && (cnt('lotus') + cnt('goldlotus')) >= 1 && !isNight() },
  { id: 'cat', name: 'Sleepy Cat', kind: 'cat', hint: 'A bench in a garden of eight blooms.', want: () => has('bench') && blooms() >= 8 },
  { id: 'hedgehog', name: 'Hedgehog', kind: 'hedgehog', hint: 'Twelve flowers… at dusk or night.', want: () => blooms() >= 12 && clock > 0.6 },
  { id: 'fireflies', name: 'Fireflies', kind: 'fireflies', hint: 'A night garden of six blooms.', want: () => isNight() && blooms() >= 6 },
  { id: 'luna', name: 'Luna Moth', kind: 'butterfly', col: ['#bff0c8', '#7ac08a'], hint: 'Moonflowers under the moon.', want: () => isNight() && cnt('moonflower') >= 1 },
  { id: 'owl', name: 'Little Owl', kind: 'owl', hint: 'A lantern, late at night.', want: () => isNight() && has('lantern') },
  { id: 'bluebird', name: 'Bluebird', kind: 'bird', col: ['#3a6ad0', '#e89a5a'], hint: 'A birdbath and a cherry tree.', want: () => has('birdbath') && cnt('cherry') >= 1 && !isNight() },
  { id: 'koi', name: 'Golden Koi', kind: 'koi', hint: 'A pond and a golden lotus.', want: () => has('pond') && cnt('goldlotus') >= 1 },
];
const COLS = 6, ROWS = 4, PLOTS = COLS * ROWS;
// unlock order: front row first, centre outwards
const ORDER = Array.from({ length: PLOTS }, (_, i) => i).sort((a, b) => {
  const k = (i) => (ROWS - 1 - Math.floor(i / COLS)) * 10 + Math.abs((i % COLS) - (COLS - 1) / 2);
  return k(a) - k(b);
});
const plotCost = (n) => Math.round(20 * 1.42 ** (n - 6));

// ---------- save ----------
let save = { petals: 0, open: 6, seeds: ['daisy'], seed: 'daisy', deco: 'stone', garden: [], met: {}, grown: {}, time: 0.3, day: 0, last: Date.now(), music: true, total: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem('petalgrove-save')) || {}); } catch {}
let garden = Array.from({ length: PLOTS }, (_, i) => save.garden[i] || null); // { f, g, w, y } plant · { d } decoration
const persist = () => { save.garden = garden; save.last = Date.now(); try { localStorage.setItem('petalgrove-save', JSON.stringify(save)); } catch {} };
const isOpen = (i) => ORDER.indexOf(i) < save.open;

// ---------- time: one day = 4 minutes, one season = 5 minutes ----------
const DAY = 240, SEASON = 300, SEASONS = [['Spring', '🌱'], ['Summer', '☀️'], ['Autumn', '🍂'], ['Winter', '❄️']];
let clock = save.time; // 0..1, 0.25 = noon-ish
const season = () => Math.floor((save.day + clock) * DAY / SEASON) % 4;
const isNight = () => clock > 0.72 || clock < 0.04;
const daylight = () => { const t = clock; return t < 0.04 ? 0.2 : t < 0.12 ? lerp(0.35, 1, (t - 0.04) / 0.08) : t < 0.6 ? 1 : t < 0.72 ? lerp(1, 0.35, (t - 0.6) / 0.12) : 0.2; };
let raining = 0, rainT = rand(90, 160);

// ---------- audio: generative ambient ----------
let ac, master, padT = 0, chimeT = 2, chord = 0;
const PENTA = [0, 2, 4, 7, 9];
function audio() { try { if (!ac) { ac = new AudioContext(); master = ac.createGain(); master.gain.value = save.music ? 0.9 : 0; master.connect(ac.destination); } if (ac.state === 'suspended') ac.resume(); } catch {} return ac; }
function note(freq, dur, type = 'sine', vol = 0.05, attack = 0.02, delay = 0) {
  if (!ac || !save.music) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
}
const midi = (m) => 440 * 2 ** ((m - 69) / 12);
const CHORDS = [[48, 55, 64], [45, 52, 60], [41, 48, 57], [43, 50, 59]]; // C, Am, F, G
function music(dt) {
  if (!ac || !save.music) return;
  if ((padT -= dt) <= 0) { // soft pad, one chord every ~8 s
    padT = 8; chord = (chord + 1) % CHORDS.length;
    for (const m of CHORDS[chord]) { note(midi(m), 9, 'sine', 0.018, 2.5); note(midi(m) * 1.003, 9, 'triangle', 0.006, 3); }
  }
  if ((chimeT -= dt) <= 0) { // gentle pentatonic melody
    chimeT = rand(1.4, 4.5) * (isNight() ? 1.6 : 1);
    const m = 72 + PENTA[Math.floor(Math.random() * 5)] + (Math.random() < 0.3 ? 12 : 0);
    note(midi(m), 2.6, 'triangle', 0.03, 0.01);
    if (Math.random() < 0.3) note(midi(m + 7), 2.2, 'sine', 0.015, 0.01, 0.35);
  }
}
const pluck = (i = 0) => { audio(); note(midi(76 + PENTA[i % 5] + 12 * Math.floor(i / 5)), 1.2, 'triangle', 0.05, 0.005); };
function chirp() { if (!ac || !save.music) return; const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime; o.frequency.setValueAtTime(2600, t); o.frequency.exponentialRampToValueAtTime(3600, t + 0.07); o.frequency.exponentialRampToValueAtTime(2400, t + 0.14); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.015, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16); o.connect(g).connect(master); o.start(t); o.stop(t + 0.2); }

// ---------- layout ----------
let groundTop, groundBot, plotPos = [];
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  groundTop = H * (W < H ? 0.42 : 0.42); groundBot = H - 96;
  plotPos = [];
  for (let i = 0; i < PLOTS; i++) {
    const r = Math.floor(i / COLS), c = i % COLS, t = (r + 0.5) / ROWS, s = 0.6 + 0.4 * t;
    const spacing = Math.min(W * 0.94 / COLS, 170) * (0.75 + 0.25 * s);
    plotPos.push({ x: W / 2 + (c - (COLS - 1) / 2) * spacing, y: groundTop + (groundBot - groundTop) * (0.1 + 0.86 * t), s: s * Math.min(1.25, spacing / 120), sp: spacing });
  }
  buildScenery();
}
let hills, grassTex;
function buildScenery() {
  hills = []; for (let i = 0; i < 3; i++) hills.push(Array.from({ length: 8 }, () => rand(0, 6)));
  grassTex = Array.from({ length: Math.round(W * H / 3500) }, () => ({ x: rand(0, W), y: rand(groundTop, H), h: rand(4, 10), c: rand(-0.12, 0.12), ph: rand(0, 6) }));
}

// ---------- state ----------
let state = 'title', tool = 'plant', petalsFx = [], rainDrops = [], fall = [], visitors = [], sparkles = [], toastT, visitT = 4, hoverPlot = -1, down = false;
function toast(msg, ms = 2600) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), ms); }
const growSpeed = () => (season() === 3 ? 0.6 : season() === 1 ? 1.15 : 1);

// ---------- interaction ----------
function plotAt(x, y) {
  let best = -1, bd = Infinity;
  plotPos.forEach((p, i) => { const dx = (x - p.x) / (p.sp * 0.5), dy = (y - p.y) / (p.sp * 0.32); const d = dx * dx + dy * dy; if (d < 1 && d < bd) { bd = d; best = i; } });
  return best;
}
function act(i, dragging) {
  if (i < 0) return;
  if (!isOpen(i)) { if (!dragging) buyPlot(); return; }
  const p = garden[i];
  if (tool === 'water') { if (p?.f) { if (p.w < 0.95) { p.w = 1; splashFx(i); } } return; }
  if (dragging) return;
  if (tool === 'clear') { if (p) { garden[i] = null; persist(); leafFx(i); pluck(0); } return; }
  if (p?.f && p.g >= 1) { collect(i, true); return; } // tap a bloom to gather petals now
  if (p) return toast(p.f ? 'Still growing… a little water helps.' : 'Something is already here.');
  if (tool === 'plant') { garden[i] = { f: save.seed, g: 0, w: 1, y: 0 }; pluck(2); splashFx(i, '#8a6a4a'); }
  if (tool === 'deco') {
    const d = DC[save.deco];
    if (save.petals < d.cost) return toast(`${d.name} costs 🌸 ${d.cost}.`);

}
function openDecos() {
  $('decoGrid').innerHTML = '';
  const nextPlot = save.open < PLOTS ? plotCost(save.open) : null;
  const plot = document.createElement('div'); plot.className = 'it';
  plot.innerHTML = `<div style="font-size:44px;line-height:72px">🌿</div><b>New patch</b><small>${save.open}/${PLOTS} patches cleared</small>`;
  const pb = document.createElement('button'); pb.textContent = nextPlot ? `🌸 ${nextPlot.toLocaleString()}` : 'All cleared'; pb.disabled = !nextPlot || save.petals < nextPlot; pb.onclick = () => { buyPlot(); openDecos(); };
  plot.append(pb); $('decoGrid').append(plot);
  for (const d of DECOS) {
    const e = document.createElement('div'); e.className = 'it' + (save.deco === d.id ? ' sel' : '');
    const c = document.createElement('canvas'); c.width = 144; c.height = 144; decoIcon(c, d.id); e.append(c);
    e.insertAdjacentHTML('beforeend', `<b>${d.name}</b><small>${d.note} 🌸 ${d.cost} each</small>`);
    const b = document.createElement('button'); b.textContent = 'Place';
    b.onclick = () => { save.deco = d.id; selectTool('deco'); persist(); updateHud(); close(); toast(`Tap a free patch to place the ${d.name.toLowerCase()}.`); };
    e.append(b); $('decoGrid').append(e);
  }
  open('decos');
}
let tab = 'visitors';
function openBook() {
  const met = Object.keys(save.met).length, grown = Object.keys(save.grown).length;
  $('bookSub').textContent = `${met}/${VISITORS.length} visitors met · ${grown}/${FLOWERS.length} flowers grown · ${Math.floor(save.total).toLocaleString()} petals gathered in all`;
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  $('bookGrid').innerHTML = '';
  if (tab === 'visitors') for (const v of VISITORS) {
    const m = save.met[v.id], d = document.createElement('div'); d.className = 'it' + (m ? '' : ' locked');
    const c = document.createElement('canvas'); c.width = 144; c.height = 144;
    icon(c, (g) => { const keep = ctx; const a = { v, t: 2, x: 72, y: v.kind === 'owl' ? 283 : ['bird'].includes(v.kind) ? 150 : ['cat'].includes(v.kind) ? 110 : ['hedgehog', 'frog', 'koi'].includes(v.kind) ? 92 : 72, s: 2.2, dir: 1, leaving: false, fade: 1, flies: Array.from({ length: 6 }, (_, i) => ({ x: 30 + i * 16, y: 50 + (i % 3) * 20, p: i })) };
      g.save(); if (!['cat', 'bird', 'owl', 'frog', 'koi', 'ladybug'].includes(v.kind)) { const z = v.kind === 'hedgehog' || v.kind === 'fireflies' ? 2.2 : 3.6; g.translate(72, 72); g.scale(z, z); g.translate(-72, -72); } if (v.kind === 'ladybug') { g.translate(72, 72); g.scale(4, 4); g.translate(-72, -72); a.s = 1; }
      ctx = g; drawVisitor(a, 2); ctx = keep; g.restore(); });
    d.append(c);
    d.insertAdjacentHTML('beforeend', m ? `<b>${v.name}</b><small>Likes: ${v.hint}</small>` : `<b>???</b><small>${v.hint}</small>`);
    $('bookGrid').append(d);
  } else for (const f of FLOWERS) {
    const g2 = save.grown[f.id], d = document.createElement('div'); d.className = 'it' + (g2 ? '' : ' locked');
    const c = document.createElement('canvas'); c.width = 144; c.height = 144; flowerIcon(c, f); d.append(c);
    d.insertAdjacentHTML('beforeend', `<b>${g2 ? f.name : '???'}</b><small>${g2 ? f.note : 'Not grown yet'}</small>`);
    $('bookGrid').append(d);
  }
  open('book');
}
document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => { tab = b.dataset.tab; openBook(); }));
function selectTool(t) { tool = t; document.querySelectorAll('.tool').forEach((x) => x.classList.toggle('on', x.dataset.tool === t)); }
const open = (id) => { close(); $(id).classList.add('on'); pluck(5); };
function close() { for (const m of ['seeds', 'decos', 'book']) $(m).classList.remove('on'); }
$('seedBtn').onclick = openSeeds; $('decoBtn').onclick = openDecos; $('bookBtn').onclick = openBook;
for (const b of document.querySelectorAll('[data-close]')) b.onclick = close;
for (const m of ['seeds', 'decos', 'book']) $(m).addEventListener('click', (e) => { if (e.target.id === m) close(); });
addEventListener('keydown', (e) => { if (e.code === 'Escape') close(); });
$('musicBtn').onclick = () => { audio(); save.music = !save.music; if (master) master.gain.value = save.music ? 0.9 : 0; $('musicBtn').textContent = save.music ? '🎵' : '🔇'; persist(); };
$('musicBtn').textContent = save.music ? '🎵' : '🔇';

// ---------- start: catch up on time away ----------
addEventListener('resize', resize); resize();
(() => {
  const away = clamp((Date.now() - save.last) / 1000, 0, 8 * 3600);
  if (away < 60 || !garden.some((p) => p?.f)) return;
  let got = 0;
  garden.forEach((p, i) => { if (p?.f && isOpen(i)) { for (let s = 0; s < away; s += 30) got += produce(p, Math.min(30, away - s), true); p.w = 0.5; } });
  if (got) { save.petals += got; save.total += got; }
  const mins = Math.round(away / 60);
  setTimeout(() => toast(`While you were away (${mins >= 60 ? Math.round(mins / 60) + 'h' : mins + 'm'}), your garden gathered 🌸 ${got.toLocaleString()}`, 4500), 600);
})();
updateHud();
addEventListener('beforeunload', persist);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
