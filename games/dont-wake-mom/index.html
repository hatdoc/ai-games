<script>
const $ = (s) => document.querySelector(s), app = $('#app');
const T = (h, m, s = 0) => h * 3600 + m * 60 + s;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.random() * a.length | 0];
const fmtT = (s) => { s = (s % 86400 + 86400) % 86400; let h = s / 3600 | 0; const m = s / 60 % 60 | 0, ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')} ${ap}`; };

// ---------- content helpers ----------
// o(label, [lowDb, highDb], seconds, extras): one tactical option.
//  tag 'step' = footsteps (socks help) · spike [chance, lowDb, highDb] = rare loud event · ex = extra detection from light/smell

const o = (t, db, sec, x = {}) => ({ t, db, sec, ...x });
const doorOpts = (to, close) => [
  o(close ? 'Ease the door shut, guiding the latch by hand' : 'Crack the door open 10% and slip through sideways', [17, 29], 14, { to, r: 'Quietest · slowest',
    say: close ? 'The latch meets the frame with a whisper.' : 'The hinge stays silent. Cool hallway air brushes your face.' }),
  o(close ? 'Push it closed at normal speed' : 'Open the door 50%', [30, 46], 6, { to, r: 'Faster · hinge may squeak', loud: 'A thin squeak cuts the dark.' }),
  o(close ? 'Let it swing shut' : 'Swing it wide and walk out', [44, 64], 2, { to, r: 'Fastest · the hinge or latch will announce you', loud: close ? 'CLACK. The latch rings through the house.' : 'The hinge screams a long, rising note.' }),
];
const walkOpts = (to, x = {}) => [
  o('Slow heel-to-toe along the wall edge', [16, 32], 40, { to, tag: 'step', r: 'Quietest · slowest', ...x }),
  o('Normal walk down the middle', [30, 50], 14, { to, tag: 'step', r: 'Balanced', ...x }),
  o('Sprint', [50, 72], 5, { to, tag: 'step', r: 'Fastest · the floor vibrates', loud: 'Your feet hammer the boards.', ...x }),
  o('Phone flashlight on the floor to dodge creaks', [16, 30], 30, { to, tag: 'step', ex: 9, ei: '💡', r: 'Avoids creaks · light leaks under doors', ...x }),

const stairOpts = (to, x = {}) => [
  o('Hug the wall side, skip the squeaky steps (3 and 11)', [17, 31], 35, { to, tag: 'step', r: 'Quietest · slowest', ...x }),
  o('Hand on the rail, middle of each step', [32, 52], 15, { to, tag: 'step', r: 'Balanced', ...x }),
  o('Take them two at a time', [46, 68], 6, { to, tag: 'step', r: 'Fastest · lands heavy', loud: 'THUD-THUD. The stairs boom.', ...x }),
];
// the trip back to your room (stairs optional): reused by every scenario
const homeNodes = (hasStairs, win = 'WIN') => ({
  ...(hasStairs ? { up: { loc: 'Staircase (Going Up)', vis: 'Moonlight on the rail. The landing is a darker square above.', aud: 'Your own pulse, the fridge hum fading below.',
    txt: 'Almost home. The way up is the same thirteen steps, but now your legs are tired and your hands are shaky.', opts: stairOpts('hall2') } } : {}),
  hall2: { loc: 'Master Hallway (2nd Floor)', vis: "Light leak under Mom's door, now to your side. Your door is 6 m ahead.", aud: 'Breathing from behind the door.',

  door2: { loc: 'Your Bedroom Door', vis: 'Your room, a dark rectangle. Safe.', aud: 'Your mattress seems to call you.',

});

  q: ['Silence. Nice and smooth.', "Nothing stirs. Mom's breathing stays slow.", 'Clean. The house does not notice you.', 'A cat would be noisier.'],
  m: ['A creak. Mom turns over.', 'A soft squeak. Her breathing hitches, then settles.', 'The floor groans. Across the way a mattress shifts.', 'Too loud. A sheet rustles, then silence.'],
  h: ['Oops, that was LOUD! A bed creaks: someone is stirring.', 'A bed frame groans and a lamp clicks on, then off. Mom is about to check.', 'Floorboards complain upstairs. Someone is awake and curious.'],
};
const MOMAUD = (w) => [`Slow, deep breathing from ${w}.`, `${w[0].toUpperCase() + w.slice(1)}: breathing is lighter now. A sheet rustles.`,
  `Movement from ${w}: springs creak, a sleepy murmur.`, `Someone is half-awake in ${w}: coughing, the frame shifting.`, `It has gone very quiet in ${w}. Any second now she will check...`];

const SC = [
  { id: 'ramen', emoji: '🍜', name: 'Midnight Ramen Ops', board: 'dont-wake-mom-ramen',

      stairs: { loc: 'Staircase (2nd → 1st Floor)', vis: 'Moonlight through the landing window paints the rail silver.', aud: 'The fridge hum grows. Step 3 and step 11 are known squeakers.',

      kit: { loc: 'Kitchen (1st Floor)', vis: 'Green glow from the microwave clock. A seam of fridge light.', aud: "The fridge compressor rumbles on and off, a perfect noise mask when it kicks in.",

          o('Open the cabinet door 10% and lift the cup straight up', [18, 32], 18, { to: 'pack', add: ['Cup Noodles'], r: 'Quiet · cup in hand' }),
          o('Open the cabinet fully and grab it', [30, 48], 6, { to: 'pack', add: ['Cup Noodles'], r: 'Fast', loud: 'The hinge squeals.' }),
          o('Wait for the fridge compressor to kick in, then open', [17, 26], 35, { to: 'pack', add: ['Cup Noodles'], r: 'Uses the noise mask · waiting costs time' })] },
      pack: { loc: 'Kitchen (1st Floor)', vis: 'The cup sits on the counter, its plastic wrap shining.', aud: 'Plastic is the loudest material in this house.',
        txt: 'A seal, a peel tab, a wrapper. The crinkle is high-frequency and carries up stairs like a flare.', opts: [

  { id: 'ranked', emoji: '🎮', name: '3 AM Secret Ranked Match', board: 'dont-wake-mom-ranked',

    ${S.log.length ? `<div class="log">${S.log.map((l) => `<p>${l}</p>`).join('')}</div>` : ''}
    <p class="story">${esc(n.txt)}</p>${n.map ? `<div class="map">${esc(n.map)}</div>` : ''}
    <div class="opts">${opts.map((x, i) => { const e = evaluate(x), rc = e.pB >= 20 ? 'bad' : e.pN >= 50 || e.pB > 0 ? 'warn' : 'ok';
      return `<button class="opt${x.freeze ? ' fr' : ''}" data-i="${i}"><span class="k">${i + 1}</span>${esc(x.t)}<span class="m">🔊 ${e.lo}–${e.hi} dB · <b class="${rc}">noise ${e.pN}% · bust ${e.pB}%</b>${x.ex ? ` · ${x.ei || '⚠️'} +${x.ex} detect` : ''} · ⏱ ${x.sec}s<br>🎁 ${esc(x.r || '')}</span></button>`; }).join('')}</div>`;
  app.querySelectorAll('.opt').forEach((b) => (b.onclick = () => choose(+b.dataset.i)));
  $('#fx').style.setProperty('--al', clamp((S.alert - 30) / 100, 0, 0.6));
  clearInterval(S.ease);
  S.ease = setInterval(() => { // meter eases back to ambient
    if (S.shown <= 22) return clearInterval(S.ease);
    S.shown = Math.max(22, S.shown - 3);
    const b = $('#dbb'), t = $('#dbt'); if (!b) return clearInterval(S.ease);
    b.textContent = bar(clamp(Math.round((S.shown - 10) / 90 * 16), 0, 16), 16); t.textContent = Math.round(S.shown);
  }, 90);
}

function choose(i) {
  const op = S.opts[i]; if (!op || S.over) return;
  const d = roll(op), dl = delta(op, d);
  if (op.freeze) S.froze[S.node] = 1;
  S.t += op.sec; S.turns++; S.db = d; S.shown = d;
  S.alert = clamp(S.alert + dl, S.floor, 100); S.maxAlert = Math.max(S.maxAlert, S.alert);
  if (d > S.worst.db) S.worst = { db: d, t: op.t };
  (op.add || []).forEach((g) => S.gear.push(g)); (op.rem || []).forEach((g) => { const k = S.gear.indexOf(g); if (k >= 0) S.gear.splice(k, 1); });
  if (op.meet) S.meet = true;
  S.bonus += op.bonus || 0;
  const tr = tier(d), story = d > 30 ? (op.loud || pick(FLAV[d > 55 ? 'h' : 'm'])) : (op.say || pick(FLAV.q));
  S.log.unshift(`[${d} dB · ${tr}] ${esc(op.t)}: ${esc(story)}${d > 30 && d <= 80 ? ' ' + esc(d > 55 ? pick(FLAV.h) : pick(FLAV.m)) : ''}`);
  S.log = S.log.slice(0, 3);
  burst(d, op.freeze);
  const sc = S.sc, shake = d >= 56 ? 's3' : d > 30 ? 's2' : '';
  if (sc.deadline && !S.meet && S.t >= sc.t0 + sc.deadline) return bust(`DING-DONG! The driver rang the bell at ${fmtT(S.t)}.`, 94);
  if (d >= 81 || S.alert >= 100) return bust(d >= 81 ? op.loud || `${d} dB, off the chart.` : 'Mom is awake and not amused.', Math.max(d, 82));
  if (op.to === 'WIN') return win();
  if (op.to) { S.node = op.to; const at = node().at; if (at) S.t = at; }
  render();
  if (shake) { app.classList.remove('s2', 's3'); void app.offsetWidth; app.classList.add(shake); }
}

function end(html) {
  S.over = true; clearInterval(S.ease); clearTimeout(heart);
  app.innerHTML = `<div class="end">${html}<div id="lb"></div><div id="ad"></div></div>`;
  adBanner($('#ad'));
}
function bust(why, d) {
  burst(Math.max(d, 82)); $('#fx').style.setProperty('--al', 0.9);
  end(`<h2 class="bad">BUSTED</h2><p>${esc(pick(S.sc.bust))}</p><p class="lbl">${esc(why)}</p>
    <p class="lbl">Loudest moment: ${S.worst.db} dB · ${esc(S.worst.t)} · Mom detectability peaked at ${Math.round(S.maxAlert)}%</p>
    <div class="btns"><button class="btn" id="again">Try again</button><button class="btn alt" id="mn">Choose scenario</button></div>`);
  $('#again').onclick = () => start(S.i); $('#mn').onclick = menu;
}
function win() {
  const rise = S.maxAlert - S.floor, score = Math.round(clamp(400 + (100 - rise) * 4.5 - S.turns * 5 + S.bonus, 100, 1000));
  const grade = score >= 850 ? ['S', 'GHOST'] : score >= 700 ? ['A', 'NINJA'] : score >= 550 ? ['B', 'SNEAKY'] : ['C', 'LUCKY'];
  const isBest = score > (best[S.sc.id] || 0); if (isBest) { best[S.sc.id] = score; saveBest(); }
  const sc = S.sc, i = S.i;
  end(`<h2 class="ok">MISSION COMPLETE</h2><p>${sc.emoji} ${esc(sc.name)}: <b>undetected.</b></p>
    <div class="sc">${score}</div><div><b>Grade ${grade[0]} · ${grade[1]}</b>${isBest ? ' · <span class="warn">★ NEW BEST!</span>' : ''}</div>
    <p class="lbl">Loudest moment: ${S.worst.db} dB · Mom peaked at ${Math.round(S.maxAlert)}% · ${S.turns} moves</p>
    <div class="btns"><button class="btn" id="again">Play again</button><button class="btn alt" id="mn">Next scenario</button><button class="btn alt" id="share">Share</button></div>`);
  leaderboard($('#lb'), sc.board).show(score);
  $('#again').onclick = () => start(i); $('#mn').onclick = menu;
  $('#share').onclick = async (e) => {
    const text = `I finished "${sc.name}" in Don't Wake Mom! with ${score} points (Grade ${grade[0]}). Can you beat me?`, url = 'https://rank-game.com/games/dont-wake-mom';
    try { if (navigator.share) await navigator.share({ title: "Midnight Stealth: Don't Wake Mom!", text, url }); else { await navigator.clipboard.writeText(`${text} ${url}`); e.target.textContent = 'Copied!'; } } catch {}
  };
}
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('.lb')) return;
  if (/^[1-9]$/.test(e.key)) { if (S.sc && !S.over) choose(+e.key - 1); else if (!S.sc) { const c = SC[+e.key - 1]; if (c) start(+e.key - 1); } }
  else if (e.key === 'm') $('#mute').click();
});
menu();
</script>
</body>
</html>
