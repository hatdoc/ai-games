<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>철거 러시 · Demolition Rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1420; color: #fff;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  [hidden] { display: none !important; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 10px 12px; pointer-events: none; }
  #hud .row { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .pill { background: #000a; padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 15px; }
  #time.low { background: #c0262dcc; }
  #combo { opacity: 0; transition: opacity .2s; color: #ffcf4a; }
  #bar { height: 6px; background: #0007; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  #bar div { height: 100%; width: 0; background: linear-gradient(90deg, #ffb020, #ff6a3d); }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0b0f18d9; padding: 16px; }
  .panel { background: #1b2333; border-radius: 18px; padding: 20px; width: 100%; max-width: 440px;
    max-height: 92vh; overflow: auto; text-align: center; box-shadow: 0 20px 60px #0009; box-sizing: border-box; }
  .panel h1 { margin: 4px 0 6px; font-size: 26px; }
  .panel p { margin: 0 0 6px; color: #b8c2d8; line-height: 1.5; font-size: 14px; }
.sponsor { background: #252f44; border-radius: 10px; padding: 8px 10px; margin-top: 10px !important; color: #ffe2a8 !important; }
  .sponsor a { color: #ffcf4a; font-weight: 800; }
  .coins { font-size: 18px; font-weight: 800; color: #ffcf4a; margin: 10px 0 4px; }
  .shop { display: grid; gap: 8px; margin: 12px 0 16px; }
  .item { display: flex; align-items: center; gap: 10px; background: #252f44; border-radius: 12px; padding: 10px 12px; text-align: left; }
  .item .ic { font-size: 26px; width: 34px; text-align: center; }
  .item b { display: block; font-size: 14px; }
  .item small { color: #9aa6bf; font-size: 12px; }
  .item button { margin-left: auto; min-width: 86px; padding: 8px 10px; font-size: 13px; }
  button { font: inherit; font-weight: 800; border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer;
    background: #ffb020; color: #1a1200; }
  button:disabled { opacity: .35; cursor: default; }
  #go { width: 100%; font-size: 17px; }
  #tnt, #mute { position: fixed; bottom: 16px; padding: 12px 14px; font-size: 18px; }
  #tnt { right: 16px; }
  #tnt.armed { background: #ff4d3d; color: #fff; animation: pulse .6s infinite alternate; }
  #mute { left: 16px; background: #000a; color: #fff; }
  @keyframes pulse { to { transform: scale(1.08); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="row">
    <span class="pill" id="stage"></span>
    <span class="pill" id="combo"></span>
    <span class="pill" id="time"></span>
    <span class="pill" id="coins"></span>
  </div>
  <div id="bar"><div></div></div>
</div>
<button id="tnt" hidden></button>
<button id="mute">🔊</button>
<div id="ov" class="overlay">
  <div class="panel">
    <h1 id="ovTitle"></h1>
    <p id="ovSub"></p>
    <p id="ovSponsor" class="sponsor"></p>
    <div class="coins" id="ovCoins"></div>
    <div class="shop" id="shop"></div>
    <button id="go"></button>
  </div>
</div>
<script>
// 철거 러시 (Demolition Rush) — original game: code, art (canvas-drawn) and sound (synthesized) all made from scratch.
const $ = (id) => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');

const MATS = [
  { name: '나무', hp: 3,  coin: 1, c: '#b07a45', d: '#7a5230', win: '#f7d98a' },
  { name: '벽돌', hp: 6,  coin: 2, c: '#b5523b', d: '#7d3526', win: '#ffe6a0' },
  { name: '콘크리트', hp: 11, coin: 4, c: '#9aa0a8', d: '#6b7078', win: '#cfe8ff' },
  { name: '강철', hp: 18, coin: 7, c: '#5d7f9e', d: '#3c566e', win: '#9fe0ff' },
];
const TOOLS = [['👊', '맨주먹'], ['🔨', '망치'], ['⛏️', '곡괭이'], ['🪚', '전기톱'], ['🚜', '굴착기'], ['🏗️', '철거 크레인'], ['☄️', '운석']];
const tier = (l) => Math.min(TOOLS.length - 1, Math.floor(l / 3));
const dmg = (l) => Math.round((1 + l) * (1 + tier(l) * 0.4));

const UP = {
  power: { ic: (l) => TOOLS[tier(l)][0], name: '도구 파워', desc: (l) => `${TOOLS[tier(l)][1]} · 타격력 ${dmg(l)}`, cost: (l) => Math.round(12 * 1.5 ** l) },
  blast: { ic: () => '💥', name: '타격 범위', max: 3, desc: (l) => (l ? `반경 ${l}칸` : '한 칸씩'), cost: (l) => Math.round(80 * 3 ** l) },
  crew:  { ic: () => '👷', name: '철거 인부', desc: (l) => (l ? `${l}명이 자동으로 부숨` : '자동 타격 없음'), cost: (l) => Math.round(40 * 1.75 ** l) },
  time:  { ic: () => '⏱️', name: '추가 시간', max: 6, desc: (l) => `제한 시간 +${l * 5}초`, cost: (l) => Math.round(30 * 1.9 ** l) },
  tnt:   { ic: () => '🧨', name: '다이너마이트', max: 3, desc: (l) => (l ? `스테이지마다 ${l}개` : '대폭발!'), cost: (l) => Math.round(150 * 2.4 ** l) },
};

// ---------- save ----------
const KEY = 'demolition-rush-v1';
let save = { stage: 1, best: 1, coins: 0, up: { power: 0, blast: 0, crew: 0, time: 0, tnt: 0 } };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) save = { ...save, ...s, up: { ...save.up, ...s.up } }; } catch {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch {} };
const fmt = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : String(Math.floor(n)));

// ---------- state ----------
let W, H, bs, bx, groundY, skyline = [];
let grid = [], cols = 0, rows = 0, total = 1, left = 0;
let state = 'menu', timeLeft = 0, tntLeft = 0, armed = false;
let combo = 0, lastHit = 0, crewTimer = 0, shake = 0, swing = 0, endTimer = 0;
let px = -100, py = -100, pointerFine = matchMedia('(pointer:fine)').matches;
let parts = [], floats = [];

// ---------- sponsors ----------
// Edit sponsors.json (next to this file) to add sponsor names, e.g.
// { "name": "Jed's Cafe", "color": "#1f7a4d" }. Stage N shows sponsor N (cycling).
let sponsors = [], contact = '', signY = null;
const sponsor = () => (sponsors.length ? sponsors[(save.stage - 1) % sponsors.length] : null);
fetch('sponsors.json', { cache: 'no-store' }).then((r) => r.json()).then((d) => {
  sponsors = (d.sponsors || []).filter((x) => x && x.name);
  contact = d.contact || '';
  if (state === 'menu') showMenu(menuKind);
}).catch(() => {});

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout();
  skyline = [];
  for (let x = -20; x < W + 20;) {
    const w = 30 + Math.random() * 60, h = H * (0.12 + Math.random() * 0.28);
    skyline.push({ x, w, h, lit: Array.from({ length: 30 }, () => Math.random() < 0.3) });
    x += w + 4;
  }
}
function layout() {
  groundY = H - Math.max(44, H * 0.09);
  if (!cols) return;
  bs = Math.floor(Math.min((W * 0.86) / cols, (groundY - 90) / rows, 58));
  bx = Math.round((W - cols * bs) / 2);
}

function buildStage() {
  const n = save.stage;
  cols = Math.min(5 + Math.floor(n / 2), 10);
  rows = Math.min(6 + n * 2, 22);
  const top = Math.min(MATS.length - 1, Math.floor((n - 1) / 3));
  const scale = 1 + (n - 1) * 0.12;
  grid = [];
  for (let c = 0; c < cols; c++) {
    const col = [];
    for (let r = 0; r < rows; r++) {
      const m = Math.max(0, top - Math.floor((r / rows) * 2)); // ground floors are the toughest
      const hp = Math.ceil(MATS[m].hp * scale);
      col.push({ m, hp, max: hp, y: 0, v: 0, seed: Math.random() * 1e4 });
    }
    grid.push(col);
  }
  total = left = cols * rows;
  timeLeft = 30 + save.up.time * 5;
  tntLeft = save.up.tnt; armed = false;
  combo = 0; crewTimer = 0; parts = []; floats = []; signY = null;
  layout();
  state = 'play';
  $('ov').hidden = true;
}

// ---------- audio (synthesized) ----------
let AC, noiseBuf, muted = false, lastSfx = {};
function sfx(type) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (!noiseBuf) {
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
  } catch { return; }
  const now = AC.currentTime;
  if (now - (lastSfx[type] || 0) < 0.035) return;
  lastSfx[type] = now;
  const noise = (dur, freq, kind, vol) => {
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = kind; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    s.connect(f).connect(g).connect(AC.destination); s.start(now, Math.random() * 0.5); s.stop(now + dur);
  };
  const tone = (f1, f2, dur, vol, wave = 'sine', at = 0) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = wave; o.frequency.setValueAtTime(f1, now + at); o.frequency.exponentialRampToValueAtTime(f2, now + at + dur);
    g.gain.setValueAtTime(vol, now + at); g.gain.exponentialRampToValueAtTime(0.001, now + at + dur);
    o.connect(g).connect(AC.destination); o.start(now + at); o.stop(now + at + dur);
  };
  if (type === 'hit') noise(0.07, 1400, 'bandpass', 0.35);
  if (type === 'break') { noise(0.28, 700, 'lowpass', 0.45); tone(110, 45, 0.2, 0.3); }
  if (type === 'boom') { noise(1.1, 320, 'lowpass', 0.9); tone(70, 25, 0.8, 0.6); }
  if (type === 'coin') tone(880, 1320, 0.08, 0.08, 'square');
  if (type === 'clear') [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.18, 0.12, 'square', i * 0.1));
  if (type === 'fail') tone(300, 90, 0.6, 0.2, 'sawtooth');
}

// ---------- smashing ----------
const blockY = (r, b) => groundY - (r + 1) * bs - b.y;
function blockAt(x, y) {
  const c = Math.floor((x - bx) / bs);
  const col = grid[c];
  if (!col || !col.length) return null;
  let r = Math.floor((groundY - y) / bs);
  if (r < 0) return null;
  if (r >= col.length) {
    if (r > col.length) return null; // allow tapping just above the top block
    r = col.length - 1;
  }
  return [c, r];
}

function smash(c, r, power, radius, user) {
  const hits = [];
  for (let dc = -radius; dc <= radius; dc++)
    for (let dr = -radius; dr <= radius; dr++) {
      const d = Math.abs(dc) + Math.abs(dr);
      const col = grid[c + dc];
      if (d > radius || !col || r + dr < 0 || r + dr >= col.length) continue;
      const b = col[r + dr];
      b.hp -= power * (d ? 0.6 : 1);
      hits.push([c + dc, r + dr, b]);
    }
  if (!hits.length) return;

  if (user) {
    const t = performance.now();
    combo = t - lastHit < 650 ? combo + 1 : 1;
    lastHit = t;
  }
  const mult = Math.min(5, 1 + Math.floor(combo / 10) * 0.5);
  const byCol = {};
  for (const [cc, rr, b] of hits) {
    const x = bx + cc * bs + bs / 2, y = blockY(rr, b) + bs / 2;
    if (b.hp > 0) spark(x, y, 3);
    else (byCol[cc] = byCol[cc] || []).push(rr);
  }
  let broke = 0;
  for (const cc in byCol) {
    const col = grid[cc];
    byCol[cc].sort((a, b) => b - a).forEach((rr) => {
      const b = col[rr], M = MATS[b.m];
      const x = bx + cc * bs, y = blockY(rr, b);
      debris(x, y, M);
      const g = Math.ceil(M.coin * (1 + 0.15 * (save.stage - 1)) * mult);
      save.coins += g;
      floats.push({ x: x + bs / 2, y, t: `+${g}`, life: 0.9 });
      col.splice(rr, 1);
      for (let i = rr; i < col.length; i++) col[i].y += bs; // everything above drops one floor
      broke++; left--;
    });
  }
  sfx(broke ? 'break' : 'hit');
  if (broke) { shake = Math.min(14, shake + 3 + broke); sfx('coin'); }
  if (left <= 0 && state === 'play') stageClear();
}

function crewHit() {
  const live = grid.map((col, c) => [col, c]).filter(([col]) => col.length);
  if (!live.length) return;
  const [col, c] = live[(Math.random() * live.length) | 0];
  smash(c, col.length - 1, Math.max(1, dmg(save.up.power) * 0.5), 0, false);
}

// ---------- effects ----------
function debris(x, y, M) {
  for (let i = 0; i < 6; i++)
    parts.push({ k: 'chunk', x: x + Math.random() * bs, y: y + Math.random() * bs, vx: (Math.random() - 0.5) * 420,
      vy: -Math.random() * 520, r: Math.random() * 6, vr: (Math.random() - 0.5) * 12,
      s: bs * (0.15 + Math.random() * 0.22), c: Math.random() < 0.5 ? M.c : M.d, life: 1.4 + Math.random() });
  for (let i = 0; i < 3; i++)
    parts.push({ k: 'dust', x: x + bs / 2, y: y + bs / 2, vx: (Math.random() - 0.5) * 60, vy: -20 - Math.random() * 30,
      s: bs * 0.4, life: 0.9 });
  if (parts.length > 700) parts.splice(0, parts.length - 700);
}
function spark(x, y, n, color = '#ffd36b') {
  for (let i = 0; i < n; i++)
    parts.push({ k: 'spark', x, y, vx: (Math.random() - 0.5) * 500, vy: (Math.random() - 0.7) * 500, s: 3, c: color, life: 0.35 });
}

// ---------- flow ----------
function stageClear() {
  state = 'clear'; endTimer = 1.4;
  const bonus = Math.round(timeLeft * save.stage * 2);
  save.coins += bonus;
  floats.push({ x: W / 2, y: H * 0.4, t: `클리어! 시간 보너스 +${bonus}`, life: 1.6, big: true });
  for (let i = 0; i < 6; i++) spark(W * Math.random(), H * 0.3 * Math.random() + 80, 20, `hsl(${Math.random() * 360},90%,65%)`);
  save.stage++; save.best = Math.max(save.best, save.stage); persist();
  sfx('clear');
}
function stageFail() {
  state = 'fail'; endTimer = 1; persist(); sfx('fail');
}

let menuKind = 'menu';
function showMenu(kind) {
  menuKind = kind;
  const pct = Math.round((1 - left / total) * 100);
  const title = { menu: '🏗️ 철거 러시', clear: '🎉 스테이지 클리어!', fail: '⏰ 시간 초과!' }[kind];
  const sub = {
    menu: '건물을 클릭(터치)해서 제한 시간 안에 전부 부수세요! 빠르게 연타하면 콤보 보너스. 번 코인으로 도구를 업그레이드하세요.',
    clear: `다음은 스테이지 ${save.stage} — 더 높고 단단한 건물이 기다립니다.`,
    fail: `${pct}% 철거했어요. 업그레이드하고 다시 도전!`,
  }[kind];
  $('ovTitle').textContent = title;
  $('ovSub').textContent = sub + (kind === 'menu' && save.best > 1 ? ` (최고 기록: 스테이지 ${save.best})` : '');
  const sp = sponsor(), sl = $('ovSponsor');
  sl.textContent = '';
  if (sp) sl.append(`🏢 이번 건물 스폰서: ${sp.name}`);
  else {
    sl.append('📣 이 건물에 당신의 이름이나 브랜드를 넣고 싶다면 연락주세요! ');
    if (contact) {
      const a = document.createElement('a');
      a.href = contact.includes('@') && !contact.startsWith('http') ? `mailto:${contact}` : contact;
      a.target = '_blank'; a.rel = 'noopener'; a.textContent = contact.includes('@') ? contact : '문의하기';
      sl.append(a);
    }
  }
  $('go').textContent = kind === 'fail' ? `다시 도전 ▶ 스테이지 ${save.stage}` : `시작 ▶ 스테이지 ${save.stage}`;
  renderShop();
  $('ov').hidden = false;
}
function renderShop() {
  $('ovCoins').textContent = `🪙 ${fmt(save.coins)}`;
  $('shop').innerHTML = Object.entries(UP).map(([k, u]) => {
    const l = save.up[k], maxed = u.max != null && l >= u.max, cost = u.cost(l);
    return `<div class="item"><span class="ic">${u.ic(l)}</span><div><b>${u.name} Lv.${l}</b><small>${u.desc(l)}${maxed ? '' : ` → ${u.desc(l + 1)}`}</small></div>
      <button data-k="${k}" ${maxed || save.coins < cost ? 'disabled' : ''}>${maxed ? 'MAX' : '🪙 ' + fmt(cost)}</button></div>`;
  }).join('');
}
$('shop').addEventListener('click', (e) => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k) return;
  const cost = UP[k].cost(save.up[k]);
  if (save.coins < cost) return;
  save.coins -= cost; save.up[k]++; persist(); sfx('coin'); renderShop();
});
$('go').onclick = () => { sfx('hit'); buildStage(); };
$('mute').onclick = () => { muted = !muted; $('mute').textContent = muted ? '🔇' : '🔊'; };
$('tnt').onclick = () => { armed = !armed; };

cv.addEventListener('pointermove', (e) => { px = e.clientX; py = e.clientY; pointerFine = e.pointerType === 'mouse'; });
cv.addEventListener('pointerdown', (e) => {
  px = e.clientX; py = e.clientY; pointerFine = e.pointerType === 'mouse';
  if (state !== 'play') return;
  const at = blockAt(px, py);
  swing = 0.14;
  if (!at) return;
  if (armed && tntLeft > 0) {
    tntLeft--; armed = false;
    smash(at[0], at[1], dmg(save.up.power) * 6 + 20, 3, false);
    shake = 24; sfx('boom');
    for (let i = 0; i < 4; i++) spark(px, py, 20, i % 2 ? '#ff7a2f' : '#ffd36b');
  } else {
    smash(at[0], at[1], dmg(save.up.power), save.up.blast, true);
  }
});

// ---------- loop ----------
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
function update(dt) {
  if (state === 'play') {
    timeLeft -= dt;
    if (save.up.crew) {
      crewTimer += dt * save.up.crew;
      while (crewTimer >= 1.2 && state === 'play') { crewTimer -= 1.2; crewHit(); }
    }
    if (timeLeft <= 0 && state === 'play') { timeLeft = 0; stageFail(); }
    if (performance.now() - lastHit > 900) combo = 0;
  } else if (state === 'clear' || state === 'fail') {
    endTimer -= dt;
    if (endTimer <= 0) { showMenu(state); state = 'menu'; }
  }
  for (const col of grid)
    for (const b of col)
      if (b.y > 0) {
        b.v += 2400 * dt; b.y -= b.v * dt;
        if (b.y <= 0) { b.y = 0; b.v = 0; }
      }
  for (const p of parts) {
    p.life -= dt;
    if (p.k === 'dust') { p.x += p.vx * dt; p.y += p.vy * dt; p.s += 40 * dt; continue; }
    p.vy += 1800 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.k === 'chunk') {
      p.r += p.vr * dt;
      if (p.y > groundY - p.s / 2) { p.y = groundY - p.s / 2; p.vy *= -0.3; p.vx *= 0.6; p.vr *= 0.6; }
    }
  }
  parts = parts.filter((p) => p.life > 0);
  for (const f of floats) { f.life -= dt; f.y -= (f.big ? 20 : 50) * dt; }
  floats = floats.filter((f) => f.life > 0);
  if (grid.length) {
    const tallest = Math.max(0, ...grid.map((col) => (col.length ? col.length * bs + col[col.length - 1].y : 0)));
    const target = groundY - tallest - 6;
    signY = signY == null ? target : signY + (target - signY) * Math.min(1, dt * 10);
  }
  shake = Math.max(0, shake - 40 * dt);
  swing = Math.max(0, swing - dt);

  // HUD
  $('stage').textContent = `🏢 스테이지 ${save.stage}`;
  $('time').textContent = `⏱ ${Math.ceil(timeLeft)}s`;
  $('time').classList.toggle('low', state === 'play' && timeLeft < 6);
  $('coins').textContent = `🪙 ${fmt(save.coins)}`;
  const mult = Math.min(5, 1 + Math.floor(combo / 10) * 0.5);
  $('combo').textContent = `🔥 ${combo} 콤보${mult > 1 ? ` ×${mult}` : ''}`;
  $('combo').style.opacity = combo >= 5 ? 1 : 0;
  $('bar').firstChild.style.width = `${(1 - left / total) * 100}%`;
  $('tnt').hidden = state !== 'play' || tntLeft <= 0;
  $('tnt').textContent = armed ? '🧨 건물을 터치!' : `🧨 ×${tntLeft}`;
  $('tnt').classList.toggle('armed', armed);
}

function drawBlock(b, x, y, isTop) {
  const M = MATS[b.m];
  ctx.fillStyle = M.c; ctx.fillRect(x, y, bs, bs);
  ctx.fillStyle = M.d; ctx.fillRect(x, y + bs - 2, bs, 2); ctx.fillRect(x + bs - 1, y, 1, bs);
  const p = bs * 0.26;
  ctx.fillStyle = M.win; ctx.globalAlpha = 0.85;
  ctx.fillRect(x + p, y + p, bs - 2 * p, bs - 2.3 * p);
  ctx.globalAlpha = 1;
  if (isTop) { ctx.fillStyle = '#2a2f3a'; ctx.fillRect(x - 1, y - 4, bs + 2, 5); }
  const dmgR = 1 - b.hp / b.max;
  if (dmgR > 0) {
    let s = b.seed;
    const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    ctx.strokeStyle = 'rgba(20,12,8,.8)'; ctx.lineWidth = Math.max(1, bs / 28);
    ctx.beginPath();
    for (let i = 0; i < Math.ceil(dmgR * 5); i++) {
      let cx = x + rnd() * bs, cy = y + rnd() * bs;
      ctx.moveTo(cx, cy);
      for (let j = 0; j < 3; j++) { cx += (rnd() - 0.5) * bs * 0.6; cy += (rnd() - 0.5) * bs * 0.6; ctx.lineTo(cx, cy); }
    }
    ctx.stroke();
  }
}

function drawSign() {
  if (!grid.length || left <= 0 || signY == null) return;
  const sp = sponsor();
  const w = Math.max(170, Math.min(W - 24, cols * bs * 0.95)), h = Math.max(30, Math.min(54, bs * 1.1));
  const x = (W - w) / 2, y = signY - h - 10;
  ctx.fillStyle = '#2a2f3a';
  ctx.fillRect(x + w * 0.2, y + h, 4, 10); ctx.fillRect(x + w * 0.8 - 4, y + h, 4, 10);
  ctx.fillStyle = sp ? sp.color || '#ffffff' : '#ffc61a';
  ctx.fillRect(x, y, w, h);
  ctx.lineWidth = 3; ctx.strokeStyle = '#2a2f3a';
  if (!sp) ctx.setLineDash([8, 5]);
  ctx.strokeRect(x, y, w, h); ctx.setLineDash([]);
  const text = sp ? sp.name : '광고 문의 · YOUR NAME HERE';
  const dark = !sp || !sp.color || isLight(sp.color);
  let fs = h * 0.5;
  ctx.font = `900 ${fs}px system-ui, sans-serif`;
  while (ctx.measureText(text).width > w - 20 && fs > 9) ctx.font = `900 ${(fs -= 1)}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = dark ? '#1a1a1a' : '#ffffff';
  ctx.fillText(text, x + w / 2, y + h / 2 + 2);
  // Paid placements must be labeled as ads (표시광고법)
  ctx.font = `800 ${Math.max(8, h * 0.2)}px system-ui, sans-serif`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(sp ? '스폰서' : 'AD', x + 5, y + 3);
  ctx.textBaseline = 'alphabetic';
}
const isLight = (hex) => {
  const n = parseInt(hex.replace('#', '').padEnd(6, '0').slice(0, 6), 16);
  return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 150;
};

function draw() {
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  // sky
  const g = ctx.createLinearGradient(0, 0, 0, groundY);
  g.addColorStop(0, '#1c2a4a'); g.addColorStop(0.6, '#e2725b'); g.addColorStop(1, '#f6b26b');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, groundY + 20);
  ctx.fillStyle = '#ffe2a8'; ctx.beginPath(); ctx.arc(W * 0.8, groundY * 0.55, Math.min(W, H) * 0.07, 0, 7); ctx.fill();
  // skyline
  for (const s of skyline) {
    ctx.fillStyle = '#3a2f4a'; ctx.fillRect(s.x, groundY - s.h, s.w, s.h);
    ctx.fillStyle = '#ffd98a55';
    let i = 0;
    for (let wy = groundY - s.h + 8; wy < groundY - 10; wy += 16)
      for (let wx = s.x + 6; wx < s.x + s.w - 8; wx += 12) if (s.lit[i++ % 30]) ctx.fillRect(wx, wy, 5, 7);
  }
  // building
  for (let c = 0; c < grid.length; c++) {
    const col = grid[c];
    for (let r = 0; r < col.length; r++) drawBlock(col[r], bx + c * bs, blockY(r, col[r]), r === col.length - 1);
  }
  drawSign();
  // ground
  ctx.fillStyle = '#3b3b40'; ctx.fillRect(-20, groundY, W + 40, H - groundY + 20);
  ctx.fillStyle = '#ffc61a';
  for (let x = -20; x < W + 20; x += 36) {
    ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x + 18, groundY); ctx.lineTo(x + 8, groundY + 10); ctx.lineTo(x - 10, groundY + 10); ctx.fill();
  }
  // particles
  for (const p of parts) {
    if (p.k === 'dust') {
      ctx.fillStyle = `rgba(200,190,175,${Math.max(0, p.life) * 0.45})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill();
    } else if (p.k === 'chunk') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); ctx.restore();
    } else {
      ctx.globalAlpha = Math.max(0, p.life / 0.35); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s); ctx.globalAlpha = 1;
    }
  }
  // floating text
  ctx.textAlign = 'center';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.font = `800 ${f.big ? 28 : 16}px system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = '#000a'; ctx.strokeText(f.t, f.x, f.y);
    ctx.fillStyle = '#ffcf4a'; ctx.fillText(f.t, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // tool cursor
  if (state === 'play' && (pointerFine || swing > 0)) {
    const size = Math.max(34, Math.min(56, bs * 1.1));
    ctx.save(); ctx.translate(px, py); ctx.rotate(swing > 0 ? -0.9 * (swing / 0.14) : 0.25);
    ctx.font = `${size}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(armed ? '🧨' : TOOLS[tier(save.up.power)][0], 0, 0);
    ctx.restore();
  }
}

addEventListener('resize', resize);
resize();
// Show a sample building behind the start menu
buildStage(); state = 'menu'; showMenu('menu');
requestAnimationFrame(frame);
</script>
</body>
</html>
