  #stickZone { position: absolute; left: 0; bottom: 0; width: 46%; height: 70%; pointer-events: auto; touch-action: none; }
  #stickBase { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 3px solid #ffffff55; background: #ffffff14; display: none; }
  #stickKnob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: #ffffffaa; }
  .tb { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; border: 3px solid #ffffff66; background: #ffffff1c; color: #fff; font-weight: 900; display: grid; place-items: center; backdrop-filter: blur(3px); line-height: 1; text-align: center; }
  .tb:active, .tb.dn { background: #ffffff55; transform: scale(.94); }
  #tShoot { right: max(16px, env(safe-area-inset-right)); bottom: 22px; width: 98px; height: 98px; background: #ff7a1a99; border-color: #ffb27a; font-size: 15px; }

  #tSpec { right: 58px; bottom: 128px; width: 74px; height: 74px; font-size: 26px; background: conic-gradient(#b6ff3c var(--cd, 0deg), #ffffff1c 0); }
  #tPause { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 8px; width: 40px; height: 40px; font-size: 16px; pointer-events: auto; }
  #tEmote { right: 14px; bottom: 126px; width: 40px; height: 40px; font-size: 20px; }
</style>
</head>

</div>

    <div class="stage"><div class="modes">${MODES.map((m) => `<button class="mode${mode === m.id ? ' on' : ''}" data-act="mode" data-m="${m.id}"><span class="em">${m.i}</span><span><b>${m.n}</b><small>${m.d}</small></span></button>`).join('')}</div><canvas id="mascot" width="460" height="460"></canvas></div>
    <div class="opts">${opts}</div>
    <button class="play" data-act="play">PLAY</button>
    <div class="dock"><button class="dk" data-act="locker"><span>👕</span>Customize</button><button class="dk" data-act="shop"><span>🛍️</span>Shop</button><button class="dk" data-act="friends"><span>🤝</span>Friends</button><button class="dk" data-act="boards"><span>🏆</span>Ranks</button><button class="dk" data-act="quests"><span>📋</span>Quests${open ? `<i>${open}</i>` : ''}</button><button class="dk" data-act="settings"><span>⚙️</span>Settings</button></div>`;
}
let mAn = 0;
function mascotTick(dt) {
  const el = $('#mascot'); if (!el || $('#home').hidden || !M) return; mAn += dt; const c = el.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 460, 460);
  const f = mine('face'), p = { x: 0, y: 0, vx: 90, vy: 0, r: 17, face: 0.2, rage: 0, stun: 0, kickT: Math.max(0, Math.sin(mAn * 3) * 0.22 * (Math.sin(mAn * 3) > 0.6 ? 1 : 0)), step: mAn * 7, celeT: 0, look: { e: f.e, hat: mine('hat').e, kit: mine('kit'), shoe: mine('shoe').c }, role: 'field', ai: { glitchT: 0 } };
  c.scale(2, 2); const bob = Math.abs(Math.sin(mAn * 3)) * 10;
  c.fillStyle = '#ffffff10'; c.beginPath(); c.arc(115, 125, 100, 0, TAU); c.fill();
  drawPlayer(c, p, 100, 130 - bob, 4.2); drawBall(c, { x: 168 + Math.sin(mAn * 3) * 6, y: 168 - Math.abs(Math.sin(mAn * 3 + 1)) * 26, r: 16, rot: mAn * 4, vx: 0, vy: 0, trail: [], last: null }, {}, 0);
}
function startBg() { if (PEN) return; startMatch({ mode: 'quick', size: 2, diff: 1, chaos: true, demo: true, bg: true, dur: 600 }); }
window.startDemo = () => { closeSheet(); hideHome(); const m = startMatch({ mode: 'quick', size: 2, diff: 1.1, chaos: true, demo: true, dur: 90 }); m.stT = 0.3; m.next = 2.5; };

// ---------- lockers, shop, quests, friends, settings ----------
function itemIcon(cat, it) {
  if (it.e !== undefined && cat !== 'face') return it.e || '🚫';
  if (cat === 'face') return it.e;
  if (cat === 'kit') return `<div class="sw" style="background:linear-gradient(135deg,${it.a} 50%,${it.b} 50%)"></div>`;
  if (cat === 'shoe') return `<div class="sw" style="background:${it.c}"></div>`;
  if (cat === 'ball') return `<div class="sw" style="border-radius:50%;background:radial-gradient(circle at 35% 35%,${it.a},${it.b})"></div>`;
  if (cat === 'trail') return { lime: '🟢', fire: '🔥', ice: '❄️', stars: '⭐', rainbow: '🌈' }[it.id];
  return '?';
}
function lockerSheet(cat = 'face', shop = false) {
  const items = COS[cat].filter((it) => !shop || !owned(cat, it)).sort((a, b) => shop ? costOf(a) - costOf(b) : 0);
  const tabs = CATS.map(([k, n, i]) => `<button class="${k === cat ? 'on' : ''}" data-act="${shop ? 'shoptab' : 'lockertab'}" data-cat="${k}">${i} ${n}</button>`).join('');
  const grid = items.map((it) => {
    const ow = owned(cat, it), eq = ow && S[cat] === it.id, rc = RAR[it.r].c;
    const sub = eq ? 'EQUIPPED' : ow ? 'Tap to equip' : it.reward ? 'Win the Chaos Cup' : `🪙 ${costOf(it)}${it.lvl ? ` · or Lv ${it.lvl}` : ''}`;
    return `<button class="it${eq ? ' eq' : ''}${ow ? '' : ' lock'}" style="--rc:${rc}" data-act="cos" data-cat="${cat}" data-id="${it.id}"><span class="rb">${RAR[it.r].n}</span><span class="ic">${itemIcon(cat, it)}</span>${esc(it.n)}<small>${sub}</small></button>`;
  }).join('') || '<p class="muted">Everything in this tab is unlocked!</p>';
  sheet(`<h2>${shop ? '🛍️ Shop' : '👕 Customize'}</h2><p class="muted" style="margin:0">🪙 ${S.coins} · Level ${S.level}. Play matches to earn coins, XP and level unlocks.</p>${shop ? '' : '<canvas id="prev" width="220" height="150" style="margin:6px auto;display:block"></canvas>'}<div class="tabs">${tabs}</div><div class="grid">${grid}</div><div class="btns"><button class="btn" data-act="close">Done</button></div>`, true);
  if (!shop) { const c = $('#prev').getContext('2d'), p = { x: 0, y: 0, vx: 0, vy: 0, r: 17, face: 0, rage: 0, stun: 0, kickT: 0, step: 0, celeT: 0, look: { e: mine('face').e, hat: mine('hat').e, kit: mine('kit'), shoe: mine('shoe').c }, role: 'field', ai: { glitchT: 0 } }; drawPlayer(c, p, 75, 80, 2.9); drawBall(c, { x: 160, y: 108, r: 18, rot: 0.4, vx: 0, vy: 0, trail: [], last: null }, {}, 0); c.font = '34px serif'; c.textAlign = 'center'; c.fillText(mine('emote').e, 185, 40); }
}
function boardsSheet() {
  sheet(`<h2>🏆 Chaos Cup Ranks</h2><div id="lbHost"></div><p class="fine">Score = 1000 per round cleared (×round number) + 100 per goal + 100 per goal of margin + 2000 for winning the cup. Sign in on rank-game.com to appear on the board. Your best: <b>${S.st.cupBest}</b></p><div id="gp" class="gp"></div><div class="btns"><button class="btn" data-act="close">Close</button></div>`);
  leaderboard($('#lbHost'), 'goal-rush').show(0); guestPrompt();
}
function questsSheet() {
  ensureQuests(); save();
  const q = (arr, defs) => arr.map((x) => { const d = defs.find((y) => y.id === x.id); return `<div class="quest${x.done ? ' done' : ''}"><b><span>${x.done ? '✅ ' : ''}${esc(d.t)}</span><small>+${d.c} 🪙</small></b><div class="bar"><i style="width:${Math.round(x.p / d.tg * 100)}%"></i></div><small>${x.p} / ${d.tg}</small></div>`; }).join('');
  const ach = ACH.map((a) => `<div class="quest${S.ach[a.id] ? ' done' : ''}" style="opacity:${S.ach[a.id] ? 1 : 0.6}"><b><span>${S.ach[a.id] ? '🏅' : '🔒'} ${a.n}</span><small>+${a.c} 🪙</small></b><small>${a.d}</small></div>`).join('');
  sheet(`<h2>📋 Quests</h2><p class="muted" style="margin:0">🔥 ${S.ds.n}-day streak · play every day for bigger bonus coins (max +70)</p><h3>DAILY</h3>${q(S.ch.list, CH_DAILY)}<h3>WEEKLY</h3>${q(S.wk.list, CH_WEEK)}<h3>ACHIEVEMENTS</h3>${ach}<div class="stat"><div><b>MATCHES</b><span>${S.st.played}</span></div><div><b>WINS</b><span>${S.st.wins}</span></div><div><b>GOALS</b><span>${S.st.goals}</span></div><div><b>BEST WIN STREAK</b><span>${S.st.best}</span></div></div><div class="btns"><button class="btn" data-act="close">Close</button></div>`, true);
}
function friendsSheet() {
  const best = S.st.cupBest;
  sheet(`<h2>🤝 Friends</h2><p class="muted">Live online rooms are not built yet, so no pretending: challenge friends with a score link instead. They play the same Chaos Cup and try to beat your number.</p>
    <div class="stat"><div><b>YOUR BEST CUP SCORE</b><span>${best || '—'}</span></div><div><b>CUP WINS</b><span>${S.st.cups}</span></div></div>
    <div class="btns">${best ? '<button class="btn pri" data-act="challenge">🎯 Challenge a friend</button>' : '<button class="btn pri" data-act="cup">Play the Chaos Cup first</button>'}<button class="btn" data-act="invite">📣 Invite friends</button></div><div class="btns"><button class="btn" data-act="close">Close</button></div>`);
}
function settingsSheet() {
  const row = (k, lab, on) => `<div class="sw2"><span>${lab}</span><button class="btn${on ? ' on' : ''}" data-act="set" data-k="${k}">${on ? 'On' : 'Off'}</button></div>`;
  sheet(`<h2>⚙️ Settings</h2>${row('sound', '🔊 Sound', !S.muted)}${row('assist', '🎯 Aim assist (pulls near-misses into the goal)', S.assist)}${row('shake', '📳 Screen shake', S.shake)}${row('caps', '😂 Funny captions', S.caps)}
    <div class="sw2"><span>👤 Name</span><span class="muted">${esc(myName())} (sign in on rank-game.com to set a nickname)</span></div>
    <div class="btns"><button class="btn" data-act="how">How to play</button><button class="btn" data-act="reset">Reset progress</button><button class="btn pri" data-act="close">Done</button></div>`);
}
function howSheet() {
  sheet(`<h2>How to play</h2><ul><li><b>Goal:</b> outscore the rivals before the clock runs out. Level = tie? Golden Goal overtime.</li><li><b>Move</b> WASD / arrows · <b>aim</b> with the mouse · <b>click</b> to kick (hold to charge a power shot)</li><li><b>Curve:</b> kick while strafing and the ball bends back. <b>Trick shot:</b> kick mid-dash.</li><li><b>Space</b> dash (bowls rivals over) · <b>E</b> your special · <b>Q</b> emote · <b>Esc</b> pause</li><li><b>Rage Mode:</b> concede a goal and your team gets 5 seconds of speed and a stronger next shot. Watch for the warning.</li><li><b>Chaos:</b> every so often the rules change. Read the banner, then adapt.</li><li><b>Phone:</b> left thumb moves, hold SHOOT to charge, release to kick (auto-aimed toward goal).</li></ul><div class="btns"><button class="btn pri" data-act="close">Got it</button></div>`);
}

// ---------- actions ----------
function playSelected() {
  const c = S.cfg;
  if (c.mode === 'quick') startMatch({ mode: 'quick', size: c.size, diff: c.diff, chaos: c.chaos, ab: c.ab });
  else if (c.mode === 'cup') startCup();
  else if (c.mode === 'golden') startMatch({ mode: 'golden', size: Math.min(c.size, 2), diff: c.diff, chaos: true, ab: c.ab });
  else if (c.mode === 'pen') startPen();
  else startMatch({ mode: 'party', size: 2, diff: c.diff, chaos: true, dur: 90, ab: c.ab });
}
function startCup() { CUPRUN = { round: 0, score: 0, goals: 0 }; cupRound(); }
function cupRound() {
  const r = CUP[CUPRUN.round];
  sheet(`<h2>🏆 Chaos Cup</h2><p class="muted">${esc(r.n)} · ${r.size}v${r.size}</p><div class="big" style="font-size:44px">${CUPRUN.round + 1} / ${CUP.length}</div><p>${esc(r.note)}</p><p class="muted">Score so far: <b style="color:var(--gold)">${CUPRUN.score}</b>. Lose once and the run ends.</p><div class="btns"><button class="btn pri" data-act="cupgo">Kick off!</button><button class="btn" data-act="home">Back</button></div>`);
}
function leaveMatch() { closeSheet(); if (M) M.paused = false; PEN = null; M = null; renderHome(); }
const actions = {
  mode: (b) => { S.cfg.mode = b.dataset.m; save(); SFX.blip(); renderHome(); },
  opt: (b) => { const k = b.dataset.k, v = b.dataset.v; S.cfg[k] = k === 'size' || k === 'diff' ? +v : k === 'chaos' ? v === 'true' : v; save(); SFX.blip(); renderHome(); },
  play: () => { ac(); playSelected(); },
  locker: () => lockerSheet('face', false), lockertab: (b) => lockerSheet(b.dataset.cat, false), shop: () => lockerSheet('face', true), shoptab: (b) => lockerSheet(b.dataset.cat, true),
  cos: (b) => {
    const cat = b.dataset.cat, it = cosOf(cat, b.dataset.id), shop = $('.tabs button[data-act=shoptab]');
    if (owned(cat, it)) { S[cat] = it.id; save(); SFX.blip(); }
    else if (it.reward) return toast('👑 Win the Chaos Cup to unlock this');
    else if (S.coins >= costOf(it)) { S.coins -= costOf(it); S.own[cat + ':' + it.id] = 1; S[cat] = it.id; save(); SFX.coin(); toast(`Unlocked ${it.n}!`); }
    else return toast(`Need ${costOf(it) - S.coins} more coins. Play a match!`);
    lockerSheet(cat, !!shop); renderHomeSoft();
  },
  boards: boardsSheet, quests: questsSheet, friends: friendsSheet, settings: settingsSheet, how: howSheet,
  set: (b) => { const k = b.dataset.k; if (k === 'sound') S.muted = !S.muted; else S[k] = !S[k]; save(); settingsSheet(); },
  reset: () => { if (confirm('Reset all Goal Rush progress on this device?')) { localStorage.removeItem('goalrush'); location.reload(); } },
  close: () => { closeSheet(); if (M && M.paused) M.paused = false; if (PEN && PEN.paused) PEN.paused = false; },
  resume: () => { if (PEN) { PEN.paused = false; closeSheet(); } else { M.paused = false; closeSheet(); } },
  restart: () => { closeSheet(); if (PEN) startPen(); else if (M?.mode === 'cup') { cupRound0(); } else if (LAST) startMatch({ ...LAST }); },
  quit: leaveMatch, home: leaveMatch,
  rematch: () => { if (PEN || LAST?.mode === 'pen') startPen(); else startMatch({ ...LAST }); },
  again: () => { if (LAST?.mode === 'pen') startPen(); else startMatch({ ...LAST, teamName: undefined }); },
  cup: () => startCup(),
  cupgo: () => { const r = CUP[CUPRUN.round]; startMatch({ mode: 'cup', size: r.size, diff: r.d, arena: r.arena, wild: !!r.wild, chaos: true, dur: 60, ab: S.cfg.ab, round: CUPRUN.round + 1 }); },
  cupnext: () => cupRound(),
  share: shareResult,
  login: () => A().login?.(), guest: () => { const e = $('#gp'); if (e) e.innerHTML = ''; },
  invite: async () => { const t = '⚽ Goal Rush! One ball. Zero chill. Free in the browser, no download.'; try { if (navigator.share) { await navigator.share({ text: t, url: SITE_GAME }); return; } } catch (e) { if (e?.name === 'AbortError') return; } toast(await copy(`${t}\n${SITE_GAME}`) ? '🔗 Link copied! Send it to a friend' : SITE_GAME, 2600); },
  challenge: async () => { const t = `🎯 I scored ${S.st.cupBest} in the Goal Rush Chaos Cup. Beat me!`, link = `${SITE_GAME}#c=${S.st.cupBest}.${encodeURIComponent(myName().slice(0, 12))}`; try { if (navigator.share) { await navigator.share({ text: t, url: link }); return; } } catch (e) { if (e?.name === 'AbortError') return; } toast(await copy(`${t}\n${link}`) ? '🔗 Challenge link copied! Send it to a friend' : link, 2600); },
};
function cupRound0() { CUPRUN = CUPRUN || { round: 0, score: 0, goals: 0 }; actions.cupgo(); }
function renderHomeSoft() { if (!M || M.bg) { const el = $('#home'); if (!el.hidden) { const y = el.scrollTop; renderHome(); sheetEl.hidden = false; el.scrollTop = y; } } }
document.addEventListener('click', (e) => { const a = e.target.closest('[data-act]'); if (a) { ac(); actions[a.dataset.act]?.(a); } });
sheetEl.addEventListener('pointerdown', (e) => e.stopPropagation());
addEventListener('keydown', (e) => { if (e.code === 'Enter' && !$('#home').hidden && sheetEl.hidden) actions.play(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && M && !M.bg && M.state === 'play' && !M.paused) togglePause(); });

// ---------- boot ----------
leaderboard(document.createElement('div'), 'goal-rush'); // tells rank-game.com this game has a board (shows the nickname box)
resize(); requestAnimationFrame(loop); renderHome();
(function () {
  const m = /^#c=(\d{1,6})\.?([^&]*)$/.exec(location.hash);
  if (m) { let nm = ''; try { nm = decodeURIComponent(m[2]).slice(0, 12); } catch { /* ignore */ } sheet(`<h2>🎯 ${esc(nm || 'A friend')} challenged you!</h2><p class="muted">They scored <b style="color:var(--gold)">${+m[1]}</b> in the Chaos Cup. Five rounds, one ball, zero chill. Can you beat it?</p><div class="btns"><button class="btn pri" data-act="cup">Accept challenge</button><button class="btn" data-act="close">Not now</button></div>`); }
})();

// for tests and the preview recorder
window.gr = { get M() { return M; }, get S() { return S; }, update, startMatch, startPen, get PEN() { return PEN; }, kick, dif };
</script>
