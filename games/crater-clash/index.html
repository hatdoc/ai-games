<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Crater Clash</title>
<script src="../cloudsave.js" data-game="crater-clash" data-keys="craterclash"></script>
<script src="../share.js"></script>
<style>
  :root { --bg: #14102a; --panel: #231c46; --panel2: #31285f; --line: #ffffff22; --ink: #fff7ee; --dim: #b4aad9; --fire: #ff8a2b; --gold: #ffd24a; --mint: #5cf2c0; --pink: #ff5c93;
    --sans: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--sans); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  #app { height: 100%; height: 100dvh; display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  #cv { display: block; border-radius: 10px; background: #000; touch-action: none; }
  .btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 12px; padding: 10px 14px; font-weight: 800; }
  .btn:hover { background: #40357a; }
  .btn.pri { background: var(--fire); border-color: var(--fire); color: #2b1100; }
  .btn.pri:hover { background: #ffa653; }
  .btn.hot { background: var(--pink); border-color: var(--pink); color: #2a0714; }
  .btn.on { border-color: var(--gold); background: #4a3a1a; }
  .muted { color: var(--dim); } .fine { color: var(--dim); font-size: 12px; margin: 8px 0 0; }

  /* bottom control bar */
  #bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px; justify-content: center; flex-wrap: wrap; }
  #weps { display: flex; gap: 4px; }
  .wp { position: relative; width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); font-size: 22px; padding: 0; }
  .wp.on { border-color: var(--gold); background: #4a3a1a; transform: translateY(-3px); }
  .wp small { position: absolute; right: 2px; bottom: 0; font-size: 11px; font-weight: 900; color: var(--gold); text-shadow: 0 1px 2px #000; }
  .wp.out { opacity: .3; }
  .hb { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 18px; font-weight: 900; padding: 0; touch-action: none; }
  .hb:active { background: var(--panel2); }
  #fire { height: 44px; padding: 0 22px; border-radius: 12px; border: 0; background: var(--fire); color: #2b1100; font-weight: 900; font-size: 17px; letter-spacing: .5px; }
  #fire:disabled { opacity: .35; }
  .sep { width: 6px; }
  #bar.off { visibility: hidden; }

  /* home */
  #home { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 18px 16px 24px; background: radial-gradient(circle at 50% 0%, #4a2a6e, var(--bg) 70%); z-index: 5; }
  .wrap { width: min(520px, 100%); display: flex; flex-direction: column; gap: 10px; }
  .logo { text-align: center; font-weight: 900; font-size: 46px; line-height: 1; letter-spacing: 1px; margin-top: 6px; text-shadow: 0 4px 0 #0006; }
  .logo b { color: var(--fire); } .logo i { font-style: normal; color: var(--gold); }
  .tagline { text-align: center; color: var(--dim); margin: 0 0 4px; }
  .mode { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; padding: 13px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); }
  button.mode:hover { background: var(--panel2); }
  .mode .em { font-size: 28px; } .mode b { display: block; font-size: 17px; } .mode small { color: var(--dim); display: block; }
  .mode .tag { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--gold); white-space: nowrap; }
  .mode.daily { border-color: var(--fire); background: linear-gradient(135deg, #5a2e1a, var(--panel)); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .chips button { min-width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); font-size: 24px; padding: 0 6px; }
  .chips button.on { border-color: var(--gold); background: #4a3a1a; }
  .chips button.lock { opacity: .35; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .row3 .btn { padding: 10px 4px; font-size: 14px; }
  .h3 { font-size: 12px; letter-spacing: 1px; color: var(--dim); text-align: center; margin: 6px 0 -2px; }

  /* sheets */
  .sheet { position: fixed; inset: 0; background: #0a0618cc; display: flex; align-items: center; justify-content: center; z-index: 20; padding: 12px; backdrop-filter: blur(3px); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px; width: min(460px, 100%); max-height: calc(100dvh - 24px); overflow-y: auto; animation: rise .25s; text-align: center; }
  @keyframes rise { from { transform: translateY(18px); opacity: 0; } }
  .card h2 { margin: 0 0 4px; font-size: 26px; } .card h3 { margin: 12px 0 4px; font-size: 14px; color: var(--dim); }
  .card ul { text-align: left; padding-left: 18px; margin: 4px 0; } .card li { margin: 3px 0; }
  .big { font-size: 56px; font-weight: 900; color: var(--gold); line-height: 1.1; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; } .btns .btn { flex: 1 1 130px; }
  .tabs { display: flex; gap: 6px; justify-content: center; margin: 8px 0; } .tabs button { padding: 6px 14px; border-radius: 99px; border: 1px solid var(--line); background: none; font-weight: 800; } .tabs button.on { background: var(--fire); color: #2b1100; border-color: var(--fire); }
  .gp { margin-top: 10px; font-size: 13px; } .gp a { color: var(--gold); }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #000c; padding: 10px 16px; border-radius: 12px; z-index: 30; font-weight: 700; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="960" height="540"></canvas>
    <div id="home"></div>
  </div>
  <div id="bar" class="off">
    <button class="hb" data-hold="mvL" aria-label="Move left">◀</button>
    <button class="hb" data-hold="mvR" aria-label="Move right">▶</button>
    <span class="sep"></span>
    <button class="hb" data-hold="elU" aria-label="Aim up">⬆</button>
    <button class="hb" data-hold="elD" aria-label="Aim down">⬇</button>
    <button class="hb" data-hold="pwD" aria-label="Less power">➖</button>
    <button class="hb" data-hold="pwU" aria-label="More power">➕</button>
    <span class="sep"></span>
    <div id="weps"></div>
    <button id="fire">FIRE!</button>
    <button class="hb" id="menuBtn" aria-label="Menu">☰</button>
  </div>
</div>
<div id="sheet" class="sheet" hidden><div class="card" id="sheetBody"></div></div>

<script src="../leaderboard.js"></script>
<script src="../rgroom.js"></script>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const SITE_GAME = 'https://rank-game.com/games/crater-clash'; // share links always point at the blog copy (ads + rankings)
const W = 960, H = 540, WATER = 488, GRAV = 420, FUEL = 70;

// ---------- weapons ----------
const WEAPONS = [
  { id: 'shell', name: 'Shell', icon: '💣', r: 34, dmg: 34, kb: 170, ammo: Infinity },
  { id: 'big', name: 'Big Boom', icon: '☄️', r: 68, dmg: 58, kb: 280, ammo: 2 },
  { id: 'tri', name: 'Triple Trouble', icon: '🔱', r: 28, dmg: 24, kb: 150, ammo: 2 },
  { id: 'chicken', name: 'Rubber Chicken', icon: '🐔', r: 46, dmg: 42, kb: 220, ammo: 2 },
  { id: 'banana', name: 'Banana Bomb', icon: '🍌', r: 26, dmg: 22, kb: 140, ammo: 2 },
  { id: 'yeet', name: 'YEET Boot', icon: '🥾', r: 60, dmg: 6, kb: 470, up: 0.2, push: 0.8, ammo: 2 },
];
const MINI = { id: 'mini', name: 'Mini', icon: '🍌', r: 24, dmg: 20, kb: 130 };
const DRIVERS = ['🐸', '😼', '🐔', '🦆', '🐙', '🦄', '🐶', '🤖', '👽', '🐷'];
const HATS = [ // need(S) says whether the hat is unlocked; hint tells how
  { e: '', n: 'No hat', need: () => true, hint: '' },
  { e: '🧢', n: 'Cap', need: () => true, hint: '' },
  { e: '🎩', n: 'Top hat', need: (s) => s.stats.wins >= 1, hint: 'Win 1 match' },
  { e: '🚧', n: 'Traffic cone', need: (s) => s.stats.bestWave >= 3, hint: 'Reach Rampage wave 3' },
  { e: '🍕', n: 'Pizza', need: (s) => s.stats.kills >= 15, hint: 'Blast 15 tanks' },
  { e: '🧀', n: 'Cheese', need: (s) => s.ds.best >= 3, hint: '3-day Daily streak' },
  { e: '👑', n: 'Crown', need: (s) => s.stats.bestWave >= 6, hint: 'Reach Rampage wave 6' },
];
const NAMES = ['Sir Bonk', 'Captain Crumbs', 'Dr. Kaboom', 'Big Gary', 'Tiny Todd', 'Lady Oof', 'Chad Chonk', 'Waffle Boss', 'Karen Jr.', 'Count Boomula', 'Grandma Gunner', 'Steve'];
const LINES = {
  fire: ['Incoming!', 'Catch!', 'Sorry in advance', 'Hold still!', 'Special delivery!', 'Surprise!', 'Eat this!', 'Bye bye!'],
  hit: ['OOF!', 'Ouch!', 'Rude!', 'My hat!', 'Not the face!', 'That tickled', 'BONK!', 'Why meee'],
  miss: ['Wind did it', 'On purpose', 'Practice shot', 'Lag!', 'Missed by a mile', 'Ha. Nope.', 'Whoops', 'Bad map'],
  self: ['Oops 🤦', 'Why did I do that', 'Friendly fire!', 'Too close...'],
  win: ['GG easy', 'Told you so', 'Too good', 'Thank you, thank you'],
  yeet: ['YEEEEET', 'Bye!!', 'Fly, my pretty!'],
  late: ['Too slow!', 'Zzz... oh.', 'Panic shot!'],
};
const pick = (a, r = Math.random) => a[(r() * a.length) | 0];

// ---------- saved data ----------
const DEF = { driver: '🐸', hat: '🧢', stats: { played: 0, wins: 0, kills: 0, bestWave: 0, bestScore: 0 }, ds: { last: '', streak: 0, best: 0 }, daily: {}, muted: false, seenHow: false };
let S = (() => { try { const s = JSON.parse(localStorage.getItem('craterclash')); return { ...DEF, ...s, stats: { ...DEF.stats, ...s?.stats }, ds: { ...DEF.ds, ...s?.ds } }; } catch { return { ...DEF, stats: { ...DEF.stats }, ds: { ...DEF.ds } }; } })();
const save = () => { try { localStorage.setItem('craterclash', JSON.stringify(S)); } catch { /* private mode: play on */ } };
const A = () => window.rgAuth || { onSite: false, user: null };

// the day comes from the server clock, falling back to the device clock offline
let skew = 0;
const timeReady = Promise.race([
  fetch('https://rank-game.com/api/time', { cache: 'no-store' }).then((r) => r.json()).then((j) => { if (Math.abs(j.now - Date.now()) < 3 * 864e5) skew = j.now - Date.now(); }).catch(() => {}),
  sleep(1500),
]);
const today = () => new Date(Date.now() + skew).toISOString().slice(0, 10);
const dayNumber = (k) => Math.floor((Date.parse(k) - Date.parse('2026-10-26')) / 864e5) + 1;

// ---------- seeded random ----------
function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rngOf(seed) { let a = hash(seed); return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------- sound (all synthesized, no files) ----------
let AC = null, nbuf = null;
const ac = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { /* no audio */ } } return AC; };
function tone(f0, f1, dur, type = 'square', vol = 0.1, delay = 0) {
  const c = S.muted ? null : ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, f0, f1, vol = 0.3, type = 'lowpass') {
  const c = S.muted ? null : ac(); if (!c) return;
  if (!nbuf) { nbuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;
  s.buffer = nbuf; s.loop = true; f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(c.destination); s.start(t); s.stop(t + dur);
}
const SFX = {
  shoot: () => { tone(380, 80, 0.2, 'sawtooth', 0.09); noise(0.12, 2000, 300, 0.12); },
  boom: (r) => { noise(0.25 + r / 120, 900, 60, 0.45); tone(130, 28, 0.3 + r / 200, 'sawtooth', 0.16); },
  splash: () => noise(0.35, 3000, 800, 0.22, 'bandpass'),
  cluck: () => { tone(760, 520, 0.07, 'square', 0.07); tone(700, 480, 0.07, 'square', 0.07, 0.09); },
  hit: () => tone(200, 60, 0.14, 'triangle', 0.18),
  yeet: () => tone(180, 1100, 0.45, 'sine', 0.14),
  pick: () => [660, 880, 1320].forEach((f, i) => tone(f, f, 0.08, 'square', 0.07, i * 0.07)),
  blip: () => tone(500, 700, 0.06, 'square', 0.05),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 'square', 0.08, i * 0.12)),
  lose: () => [400, 330, 262, 196].forEach((f, i) => tone(f, f * 0.9, 0.2, 'triangle', 0.1, i * 0.16)),
  tick: () => tone(1000, 900, 0.04, 'square', 0.04),
};

// ---------- terrain (a bitmap + a solid mask) ----------
const cv = $('#cv'), g = cv.getContext('2d');
const tc = document.createElement('canvas'); tc.width = W; tc.height = H; const tg = tc.getContext('2d');
const mask = new Uint8Array(W * H);
const solid = (x, y) => { x |= 0; y |= 0; if (x < 0 || x >= W || y < 0) return false; if (y >= H) return true; return mask[y * W + x] === 1; };
const groundTop = (x, from = 0) => { x |= 0; for (let y = Math.max(0, from | 0); y < H; y++) if (solid(x, y)) return y; return H; };
let SKY = ['#5ec8ff', '#d9f4ff'], hillCol = '#2c7a57';
const SKIES = [['#5ec8ff', '#d9f4ff', '#2c7a57'], ['#ff9a5c', '#ffe3a8', '#7a3a4a'], ['#3a2d7a', '#d77aa8', '#2a2058'], ['#79d9b0', '#f4ffd9', '#2f6f58'], ['#2a3a6a', '#7a8fcb', '#202e55']];

function genTerrain(r) {
  const p1 = r() * 6.28, p2 = r() * 6.28, p3 = r() * 6.28, base = 270 + r() * 50, a1 = 40 + r() * 40;
  const valley = r() < 0.55, vx = W * (0.4 + r() * 0.2), vw = 70 + r() * 60;
  const hs = new Float32Array(W);
  for (let x = 0; x < W; x++) {
    let h = base + a1 * Math.sin(x / 150 + p1) + 30 * Math.sin(x / 62 + p2) + 10 * Math.sin(x / 21 + p3);
    if (valley) h += 110 * Math.exp(-(((x - vx) / vw) ** 2));
    hs[x] = Math.max(140, Math.min(WATER - 22, h));
  }
  mask.fill(0);
  for (let x = 0; x < W; x++) for (let y = hs[x] | 0; y < H; y++) mask[y * W + x] = 1;
  tg.clearRect(0, 0, W, H); tg.globalCompositeOperation = 'source-over';
  tg.beginPath(); tg.moveTo(0, H); for (let x = 0; x < W; x++) tg.lineTo(x, hs[x]); tg.lineTo(W, H); tg.closePath();
  const gr = tg.createLinearGradient(0, 130, 0, H); gr.addColorStop(0, '#9a6532'); gr.addColorStop(1, '#4a2a16'); tg.fillStyle = gr; tg.fill();
  tg.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 380; i++) { tg.fillStyle = r() < 0.5 ? '#00000022' : '#ffffff14'; tg.beginPath(); tg.ellipse(r() * W, 150 + r() * 400, 2 + r() * 7, 1.5 + r() * 4, 0, 0, 6.3); tg.fill(); }
  for (let i = 0; i < 26; i++) { tg.fillStyle = '#6b6b78'; tg.beginPath(); tg.ellipse(r() * W, 250 + r() * 250, 5 + r() * 9, 4 + r() * 6, 0, 0, 6.3); tg.fill(); }
  tg.beginPath(); for (let x = 0; x < W; x++) x ? tg.lineTo(x, hs[x]) : tg.moveTo(x, hs[x]);
  tg.strokeStyle = '#4fb53b'; tg.lineWidth = 12; tg.stroke(); tg.strokeStyle = '#86e05c'; tg.lineWidth = 4; tg.translate(0, -2); tg.stroke(); tg.setTransform(1, 0, 0, 1, 0, 0);
  tg.globalCompositeOperation = 'source-over';
  const sk = SKIES[(r() * SKIES.length) | 0]; SKY = [sk[0], sk[1]]; hillCol = sk[2];
}
function carve(cx, cy, r) {
  tg.globalCompositeOperation = 'source-atop'; tg.fillStyle = 'rgba(38,20,12,.85)'; tg.beginPath(); tg.arc(cx, cy, r + 5, 0, 6.3); tg.fill();
  tg.globalCompositeOperation = 'destination-out'; tg.beginPath(); tg.arc(cx, cy, r, 0, 6.3); tg.fill(); tg.globalCompositeOperation = 'source-over';
  const r2 = r * r;
  for (let dy = -r; dy <= r; dy++) { const y = (cy + dy) | 0; if (y < 0 || y >= H) continue; for (let dx = -r; dx <= r; dx++) { const x = (cx + dx) | 0; if (x >= 0 && x < W && dx * dx + dy * dy <= r2) mask[y * W + x] = 0; } }
}

// ---------- game state ----------
let G = null;        // current match
let paused = false;
const hold = new Set();
const fx = { parts: [], texts: [], rings: [], shake: 0, flash: 0 };
const clouds = Array.from({ length: 6 }, (_, i) => ({ x: i * 170, y: 30 + (i % 3) * 40, s: 0.6 + (i % 4) * 0.25, v: 6 + i * 2 }));

function mkTank(o) {
  return { team: 0, name: 'Tank', emoji: '🐸', hat: '', hp: 100, x: 100, y: 0, vx: 0, vy: 0, rot: 0, vr: 0, air: false, f: 1, el: 45, pw: 60, wi: 0,
    ammo: WEAPONS.map((w) => w.ammo), fuel: FUEL, ai: false, say: null, hurt: 0, recoil: 0, dead: false, ...o };
}
function placeTank(t, x) {
  x = Math.max(24, Math.min(W - 24, x));
  for (let i = 0; i < 60 && groundTop(x) > WATER - 14; i++) x += (i % 2 ? 1 : -1) * 14 * (1 + (i >> 1));
  t.x = Math.max(20, Math.min(W - 20, x)); t.y = groundTop(t.x); t.vx = t.vy = 0; t.air = false; t.rot = 0; t.vr = 0; t.fuel = FUEL; t.dead = false;
}
const alive = (team) => G.tanks.filter((t) => !t.dead && (team === undefined || t.team === team));

function startMatch(o) {
  closeSheet(); $('#home').hidden = true; $('#bar').classList.remove('off'); paused = false;
  const seed = o.seed || Math.random().toString(36).slice(2, 8);
  G = { mode: o.mode, seed, diff: o.diff || 'normal', target: o.target, chalName: o.chalName, demo: !!o.demo, wave: 1, shots: 0, turns: 0, kills: 0, dmg: 0, score: 0,
    tanks: [], spawn: [], turn: null, state: 'aim', settle: 0, wind: 0, crates: [], projs: [], banner: null, slow: 0, timer: 0, over: false, key: o.key,
    rng: { t: rngOf(seed + 't'), w: rngOf(seed + 'w'), a: rngOf(seed + 'a'), c: rngOf(seed + 'c'), n: rngOf(seed + 'n') } };
  const me = mkTank({ name: A().user?.nick || 'You', emoji: S.driver, hat: S.hat, ai: G.demo });
  if (G.demo) { me.emoji = '🐸'; me.hat = '🎩'; }
  G.tanks.push(me);
  if (o.mode === 'two') G.tanks.push(mkTank({ team: 1, name: 'Player 2', emoji: S.driver === '🐶' ? '😼' : '🐶', hat: '🧢', f: -1 }));
  else if (o.mode !== 'rampage') G.tanks.push(mkEnemy(0));
  newRound();
  S.stats.played++; save();
}
function mkEnemy(i) {
  const r = G.rng.n, e = pick(DRIVERS.filter((d) => d !== S.driver), r);
  const hp = G.mode === 'rampage' ? 60 + Math.min(40, G.wave * 8) : 100;
  return mkTank({ team: 1, name: pick(NAMES, r), emoji: e, hat: pick(['', '🎩', '🧀', '🍕', '🚧'], r), f: -1, ai: true, hp, wi: 0 });
}
function newRound() {
  genTerrain(G.rng.t);
  fx.parts.length = 0; fx.texts.length = 0; G.crates.length = 0; G.projs.length = 0;
  if (G.mode === 'rampage') {
    const me = G.tanks[0]; G.tanks = [me];
    const n = Math.min(3, 1 + ((G.wave - 1) >> 1));
    for (let i = 0; i < n; i++) G.tanks.push(mkEnemy(i));
  }
  const xs = G.rng.t;

function guestPrompt() {
  const el = $('#gp'); if (!el) return; const a = A();
  if (a.user) return;
  el.innerHTML = a.onSite ? '<b>Want your score on the leaderboard?</b><div class="btns"><button class="btn pri" data-act="login">Log in to Rank</button><button class="btn" data-act="guest">Continue as Guest</button></div>' : `Official rankings live on <a href="${SITE_GAME}" target="_blank" rel="noopener">rank-game.com</a>.`;
}
addEventListener('rg-auth', () => { guestPrompt(); if (!G) renderHome(); });

// ---------- sharing ----------
function shareText(T) {
  if (T.mode === 'rampage') return { text: `🌊 CRATER CLASH RAMPAGE: wave ${T.wave}, ${T.score} pts, ${T.kills} tanks blasted. Can you survive longer?`, url: SITE_GAME };
  if (T.mode === 'daily') return { text: `🎯 CRATER CLASH DAILY #${dayNumber(T.key)}\n${T.shots} shot${T.shots === 1 ? '' : 's'} · ${T.hp} HP left · 🔥${S.ds.streak}\nBeat me!`, url: SITE_GAME + '#daily' };
  return { text: `💥 I won Crater Clash in ${T.shots} shot${T.shots === 1 ? '' : 's'}. Think you can do better?`, url: SITE_GAME };
}
function drawCard(T) {
  const CW = 1080, CH = 1920, c = document.createElement('canvas'); c.width = CW; c.height = CH; const x = c.getContext('2d');
  const bg = x.createLinearGradient(0, 0, 0, CH); bg.addColorStop(0, '#4a2a6e'); bg.addColorStop(1, '#14102a'); x.fillStyle = bg; x.fillRect(0, 0, CW, CH);
  x.fillStyle = '#9a6532'; x.beginPath(); x.moveTo(0, 1500); for (let i = 0; i <= CW; i += 20) x.lineTo(i, 1480 + Math.sin(i / 90) * 60); x.lineTo(CW, CH); x.lineTo(0, CH); x.fill();
  x.textAlign = 'center'; x.font = '900 130px ui-rounded, system-ui, sans-serif'; x.fillStyle = '#ff8a2b'; x.fillText('CRATER', CW / 2 - 200, 220); x.fillStyle = '#ffd24a'; x.fillText('CLASH', CW / 2 + 290, 220);
  x.font = '300px serif'; x.fillText(S.hat || '', CW / 2, 560); x.fillText(S.driver, CW / 2, 800);
  x.fillStyle = '#fff7ee'; x.font = '900 96px ui-rounded, system-ui, sans-serif';
  const head = T.mode === 'rampage' ? `WAVE ${T.wave}` : T.mode === 'daily' ? `DAILY DUEL #${dayNumber(T.key)}` : 'VICTORY';
  x.fillText(head, CW / 2, 1010);
  x.fillStyle = '#ffd24a'; x.font = '900 220px ui-rounded, system-ui, sans-serif'; x.fillText(T.mode === 'rampage' ? T.score : `${T.shots}`, CW / 2, 1250);
  x.fillStyle = '#b4aad9'; x.font = '800 64px ui-rounded, system-ui, sans-serif'; x.fillText(T.mode === 'rampage' ? 'POINTS' : T.shots === 1 ? 'SHOT' : 'SHOTS', CW / 2, 1330);
  x.fillStyle = '#fff7ee'; x.font = '900 84px ui-rounded, system-ui, sans-serif'; x.fillText('Think you can beat me?', CW / 2, 1730);
  x.fillStyle = '#ffd24a'; x.font = '800 56px ui-rounded, system-ui, sans-serif'; x.fillText('rank-game.com/games/crater-clash', CW / 2, 1830);
  return c;
}
async function shareResult() {
  const T = G?.T; if (!T) return;
  const { text, url } = shareText(T), full = `${text}\n${url}`;
  try {
    const blob = await new Promise((r) => drawCard(T).toBlob(r, 'image/png')), file = new File([blob], 'crater-clash.png', { type: 'image/png' });
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], text: full }); return; }
    if (navigator.share) { await navigator.share({ text, url }); return; }
  } catch (e) { if (e?.name === 'AbortError') return; }
  toast(await copy(full) ? '🔗 Copied! Paste it to a friend' : 'Copy this link: ' + url, 2400);
}
function saveCard() { const T = G?.T; if (!T) return; const a = document.createElement('a'); a.download = 'crater-clash.png'; a.href = drawCard(T).toDataURL('image/png'); document.body.append(a); a.click(); a.remove(); toast('🖼 Card saved'); }

// ---------- start ----------
leaderboard(document.createElement('div'), 'crater-clash'); // tells rank-game.com this game has leaderboards (shows the nickname box)
requestAnimationFrame(loop);
renderHome();
timeReady.then(() => { if (!G) renderHome(); });
(function () {
  const h = location.hash.slice(1), m = /^c=([a-z0-9]{3,12})\.(\d{1,2})\.?([^&]*)$/i.exec(h);
  if (m) { window.rgInvite?.(''); let nm = ''; try { nm = decodeURIComponent(m[3]).slice(0, 20); } catch { /* ignore */ } sheet(`<h2>🎯 ${esc(nm || 'A friend')} challenged you!</h2><p class="muted">They won this exact map in <b>${+m[2]}</b> shot${+m[2] === 1 ? '' : 's'}. Can you do it in fewer?</p><div class="btns"><button class="btn pri" id="acc">Accept challenge</button><button class="btn" data-act="close">Not now</button></div>`); $('#acc').onclick = () => startMatch({ mode: 'chal', seed: m[1], target: +m[2], chalName: nm, diff: 'normal' }); }
  else if (h === 'daily') actions.daily();
  else if (!S.seenHow) { S.seenHow = true; save(); howSheet(); }
})();

// for tests and the preview recorder
window.craterState = () => G; window.craterSave = () => S;
window.startDemo = () => startMatch({ mode: 'duel', demo: true, diff: 'hard' }); // bot vs bot
</script>
