<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Crater Clash</title>
<script src="../cloudsave.js" data-game="crater-clash" data-keys="craterclash"></script>
<script src="../share.js"></script>
<style>
  :root { --bg: #14102a; --panel: #231c46; --panel2: #31285f; --line: #ffffff22; --ink: #fff7ee; --dim: #b4aad9; --fire: #ff8a2b; --gold: #ffd24a; --mint: #5cf2c0; --pink: #ff5c93;
    --sans: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--sans); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  #app { height: 100%; height: 100dvh; display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  #cv { display: block; border-radius: 10px; background: #000; touch-action: none; }
  .btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 12px; padding: 10px 14px; font-weight: 800; }
  .btn:hover { background: #40357a; }
  .btn.pri { background: var(--fire); border-color: var(--fire); color: #2b1100; }
  .btn.pri:hover { background: #ffa653; }
  .btn.hot { background: var(--pink); border-color: var(--pink); color: #2a0714; }
  .btn.on { border-color: var(--gold); background: #4a3a1a; }
  .muted { color: var(--dim); } .fine { color: var(--dim); font-size: 12px; margin: 8px 0 0; }

  /* bottom control bar */
  #bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px; justify-content: center; flex-wrap: wrap; }
  #weps { display: flex; gap: 4px; }
  .wp { position: relative; width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); font-size: 22px; padding: 0; }
  .wp.on { border-color: var(--gold); background: #4a3a1a; transform: translateY(-3px); }
  .wp small { position: absolute; right: 2px; bottom: 0; font-size: 11px; font-weight: 900; color: var(--gold); text-shadow: 0 1px 2px #000; }
  .wp.out { opacity: .3; }
  .hb { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 18px; font-weight: 900; padding: 0; touch-action: none; }
  .hb:active { background: var(--panel2); }
  #fire { height: 44px; padding: 0 22px; border-radius: 12px; border: 0; background: var(--fire); color: #2b1100; font-weight: 900; font-size: 17px; letter-spacing: .5px; }
  #fire:disabled { opacity: .35; }
  .sep { width: 6px; }
  #bar.off { display: none; }

  /* home */
  #home { position: absolute; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 8px; background: radial-gradient(circle at 50% 0%, #4a2a6e, var(--bg) 70%); z-index: 5; }
  .wrap { width: min(600px, 100%); display: flex; flex-direction: column; gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2 .mode { flex-direction: column; justify-content: center; text-align: center; gap: 2px; padding: 10px 8px; min-width: 0; }
  .grid2 .mode .em { font-size: 24px; } .grid2 .mode b { font-size: 16px; } .grid2 .mode small { font-size: 12px; }
  .grid2 .mode .tag { margin: 0; }
  .mode.online { border-color: var(--mint); background: linear-gradient(135deg, #1b4a45, var(--panel)); }
  .mode.col { padding: 0; overflow: hidden; } .mode.col > button { background: none; border: 0; padding: 10px 8px 4px; width: 100%; display: flex; flex-direction: column; gap: 2px; align-items: center; }
  .seg { display: flex; gap: 4px; padding: 0 8px 8px; width: 100%; } .seg button { flex: 1; padding: 4px 0; font-size: 13px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel2); } .seg button.on { border-color: var(--gold); background: #4a3a1a; }
  .row5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; } .row5 .btn { padding: 8px 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logo { text-align: center; font-weight: 900; font-size: 40px; line-height: 1; letter-spacing: 1px; margin-top: 6px; text-shadow: 0 4px 0 #0006; }
  .logo b { color: var(--fire); } .logo i { font-style: normal; color: var(--gold); }
  .tagline { text-align: center; color: var(--dim); margin: 0 0 4px; }
  .mode { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; padding: 13px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); }
  button.mode:hover { background: var(--panel2); }
  .mode .em { font-size: 28px; } .mode b { display: block; font-size: 17px; } .mode small { color: var(--dim); display: block; }
  .mode .tag { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--gold); white-space: nowrap; }
  .mode.daily { border-color: var(--fire); background: linear-gradient(135deg, #5a2e1a, var(--panel)); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .chips button { min-width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); font-size: 22px; padding: 0 5px; }
  .chips button.on { border-color: var(--gold); background: #4a3a1a; }
  .chips button.lock { opacity: .35; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .row3 .btn { padding: 10px 4px; font-size: 14px; }
  .h3 { font-size: 12px; letter-spacing: 1px; color: var(--dim); text-align: center; margin: 6px 0 -2px; }

  /* sheets */
  .sheet { position: fixed; inset: 0; background: #0a0618cc; display: flex; align-items: center; justify-content: center; z-index: 20; padding: 12px; backdrop-filter: blur(3px); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px; width: min(500px, 100%); animation: rise .25s; text-align: center; }
  .stats { background: #0003; border-radius: 12px; padding: 8px 10px; margin: 6px 0; text-align: left; font-size: 13px; }
  .stats b { font-size: 15px; } .bar { display: grid; grid-template-columns: 52px 1fr; gap: 6px; align-items: center; margin: 3px 0; color: var(--dim); font-size: 12px; } .bar i { display: block; height: 7px; border-radius: 4px; background: linear-gradient(90deg, var(--fire), var(--gold)); }
  .kit { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; } .kit span { background: var(--panel2); border-radius: 8px; padding: 2px 7px; font-size: 12px; }
  .join { display: flex; gap: 6px; margin-top: 10px; justify-content: center; } .join input { width: 110px; text-align: center; font: 800 20px var(--sans); letter-spacing: 4px; text-transform: uppercase; border-radius: 12px; border: 1px solid var(--line); background: #0004; color: var(--ink); padding: 6px; }
  .card .lb { margin: 8px auto 0; width: min(100%, 360px); } /* the shared leaderboard is a fixed-width block: centre it in the card */
  .code { color: var(--gold); letter-spacing: 4px; } .emos { display: flex; gap: 4px; } .emos .hb { font-size: 20px; }
  @keyframes rise { from { transform: translateY(18px); opacity: 0; } }
  .card h2 { margin: 0 0 4px; font-size: 26px; } .card h3 { margin: 12px 0 4px; font-size: 14px; color: var(--dim); }
  .card ul { text-align: left; padding-left: 18px; margin: 4px 0; } .card li { margin: 3px 0; }
  .big { font-size: 56px; font-weight: 900; color: var(--gold); line-height: 1.1; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; } .btns .btn { flex: 1 1 130px; }
  .tabs { display: flex; gap: 6px; justify-content: center; margin: 8px 0; } .tabs button { padding: 6px 14px; border-radius: 99px; border: 1px solid var(--line); background: none; font-weight: 800; } .tabs button.on { background: var(--fire); color: #2b1100; border-color: var(--fire); }
  .gp { margin-top: 10px; font-size: 13px; } .gp a { color: var(--gold); }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #000c; padding: 10px 16px; border-radius: 12px; z-index: 30; font-weight: 700; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="960" height="540"></canvas>
    <div id="home"></div>
  </div>
  <div id="bar" class="off">
    <button class="hb" data-hold="mvL" aria-label="Move left">◀</button>
    <button class="hb" data-hold="mvR" aria-label="Move right">▶</button>
    <span class="sep"></span>
    <button class="hb" data-hold="elU" aria-label="Aim up">⬆</button>
    <button class="hb" data-hold="elD" aria-label="Aim down">⬇</button>
    <button class="hb" data-hold="pwD" aria-label="Less power">➖</button>
    <button class="hb" data-hold="pwU" aria-label="More power">➕</button>
    <span class="sep"></span>
    <div id="weps"></div>
    <button id="fire">FIRE!</button>
    <span class="emos" id="emos" hidden><button class="hb" data-emo="😂">😂</button><button class="hb" data-emo="😡">😡</button><button class="hb" data-emo="👍">👍</button><button class="hb" data-emo="💩">💩</button></span>
    <button class="hb" id="zoomBtn" aria-label="Show whole map">🗺</button>
    <button class="hb" id="menuBtn" aria-label="Menu">☰</button>
  </div>
</div>
<div id="sheet" class="sheet" hidden><div class="card" id="sheetBody"></div></div>

<script src="../leaderboard.js"></script>
<script src="../rgroom.js"></script>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const SITE_GAME = 'https://rank-game.com/games/crater-clash'; // share links always point at the blog copy (ads + rankings)
const W = 1920, H = 720, VW = 960, VH = 540, GRAV = 420, FUEL = 90, SPD = 8.4, WINDK = 3, MOVE = 70; // world is W x H; the screen shows a VW x VH window onto it
let WATER = 650;     // sea level (1e9 on maps without water: fall off the edge instead)

// ---------- weapons ----------
const WEAPONS = [
  { id: 'shell', name: 'Shell', icon: '💣', r: 34, dmg: 34, kb: 170, ammo: Infinity },
  { id: 'big', name: 'Big Boom', icon: '☄️', r: 68, dmg: 58, kb: 280, ammo: 2 },
  { id: 'tri', name: 'Triple Trouble', icon: '🔱', r: 28, dmg: 24, kb: 150, ammo: 2 },
  { id: 'chicken', name: 'Rubber Chicken', icon: '🐔', r: 46, dmg: 42, kb: 220, ammo: 2 },
  { id: 'banana', name: 'Banana Bomb', icon: '🍌', r: 26, dmg: 22, kb: 140, ammo: 2 },
  { id: 'yeet', name: 'YEET Boot', icon: '🥾', r: 60, dmg: 6, kb: 470, up: 0.2, push: 0.8, ammo: 2 },
  { id: 'nuke', name: 'Nuke', icon: '☢️', r: 66, dmg: 170, kb: 520, ammo: 1, wind: 3.2, jitter: 0.07, once: true },
  { id: 'gas', name: 'Poison Gas', icon: '☠️', r: 30, dmg: 0, kb: 0, ammo: 1, gas: true, once: true },
];
// Tank classes: stats plus a short kit (weapon id, ammo). hp = health, move = driving fuel per turn, rng = how far a full-power shot flies, dmg = damage multiplier
const TANKS = {
  rookie: { name: 'Rookie', icon: '🛡️', col: ['#3a9bff', '#2468c4'], hp: 100, move: 90, rng: 1, dmg: 1, tag: 'Balanced all-rounder', kit: [['shell', Infinity], ['big', 2], ['tri', 2], ['gas', 1]] },
  heavy: { name: 'Heavy', icon: '🦾', col: ['#8a8f9c', '#555b66'], hp: 140, move: 50, rng: 0.95, dmg: 1.2, tag: 'Slow and tough, hits hard', kit: [['shell', Infinity], ['big', 3], ['yeet', 2], ['nuke', 1]] },
  scout: { name: 'Scout', icon: '🏃', col: ['#3ad06a', '#1f8a42'], hp: 75, move: 170, rng: 1.1, dmg: 0.9, tag: 'Fast and fragile', kit: [['shell', Infinity], ['banana', 3], ['chicken', 2], ['tri', 2]] },
  sniper: { name: 'Sniper', icon: '🎯', col: ['#a45cff', '#6a2fc0'], hp: 80, move: 60, rng: 1.35, dmg: 1.1, tag: 'Shoots across the map', kit: [['shell', Infinity], ['banana', 2], ['tri', 2], ['nuke', 1]] },
  trickster: { name: 'Trickster', icon: '🧪', col: ['#d6c43a', '#8e8218'], hp: 90, move: 100, rng: 1.05, dmg: 1, tag: 'Chaos and poison', kit: [['shell', Infinity], ['chicken', 3], ['gas', 2], ['yeet', 2]] },
  brawler: { name: 'Brawler', icon: '🥊', col: ['#ff8a2b', '#c25a10'], hp: 110, move: 80, rng: 0.9, dmg: 1.1, tag: 'Close-range shover', kit: [['shell', Infinity], ['yeet', 3], ['big', 1], ['chicken', 2]] },
};
const TANK_IDS = Object.keys(TANKS);
const widx = (id) => WEAPONS.findIndex((w) => w.id === id);
const spdOf = (t) => SPD * TANKS[t.cls].rng;
const MINI = { id: 'mini', name: 'Mini', icon: '🍌', r: 24, dmg: 20, kb: 130 };
const DRIVERS = ['🐸', '😼', '🐔', '🦆', '🐙', '🦄', '🐶', '🤖', '👽', '🐷'];
const HATS = [ // need(S) says whether the hat is unlocked; hint tells how
  { e: '', n: 'No hat', need: () => true, hint: '' },
  { e: '🧢', n: 'Cap', need: () => true, hint: '' },
  { e: '🎩', n: 'Top hat', need: (s) => s.stats.wins >= 1, hint: 'Win 1 match' },
  { e: '🚧', n: 'Traffic cone', need: (s) => s.stats.bestWave >= 3, hint: 'Reach Rampage wave 3' },
  { e: '🍕', n: 'Pizza', need: (s) => s.stats.kills >= 15, hint: 'Blast 15 tanks' },
  { e: '🧀', n: 'Cheese', need: (s) => s.ds.best >= 3, hint: '3-day Daily streak' },
  { e: '👑', n: 'Crown', need: (s) => s.stats.bestWave >= 6, hint: 'Reach Rampage wave 6' },
];
const NAMES = ['Sir Bonk', 'Captain Crumbs', 'Dr. Kaboom', 'Big Gary', 'Tiny Todd', 'Lady Oof', 'Chad Chonk', 'Waffle Boss', 'Karen Jr.', 'Count Boomula', 'Grandma Gunner', 'Steve'];
const LINES = {
  fire: ['Incoming!', 'Catch!', 'Sorry in advance', 'Hold still!', 'Special delivery!', 'Surprise!', 'Eat this!', 'Bye bye!'],
  hit: ['OOF!', 'Ouch!', 'Rude!', 'My hat!', 'Not the face!', 'That tickled', 'BONK!', 'Why meee'],
  miss: ['Wind did it', 'On purpose', 'Practice shot', 'Lag!', 'Missed by a mile', 'Ha. Nope.', 'Whoops', 'Bad map'],
  self: ['Oops 🤦', 'Why did I do that', 'Friendly fire!', 'Too close...'],
  win: ['GG easy', 'Told you so', 'Too good', 'Thank you, thank you'],
  yeet: ['YEEEEET', 'Bye!!', 'Fly, my pretty!'],
  late: ['Too slow!', 'Zzz... oh.', 'Panic shot!'],
  nuke: ['Say goodbye!', 'Nuclear option!', 'Everybody duck!', 'Sorry about the crater'],
  gas: ['Who farted?', 'Breathe in!', 'Smells like victory', 'Stinky special!'],
  gasHit: ['Cough cough!', 'Ew ew ew', 'My eyes!', 'I feel funny'],
};
const pick = (a, r = Math.random) => a[(r() * a.length) | 0];
const cleanName = (n) => String(n || 'Player').replace(/[^\p{L}\p{N} _.\-!]/gu, '').trim().slice(0, 14) || 'Player';

// ---------- saved data ----------
const DEF = { driver: '🐸', hat: '🧢', tank: 'rookie', map: 'random', stats: { played: 0, wins: 0, kills: 0, bestWave: 0, bestScore: 0 }, ds: { last: '', streak: 0, best: 0 }, daily: {}, muted: false, seenHow: false };
let S = (() => { try { const s = JSON.parse(localStorage.getItem('craterclash')); return { ...DEF, ...s, stats: { ...DEF.stats, ...s?.stats }, ds: { ...DEF.ds, ...s?.ds } }; } catch { return { ...DEF, stats: { ...DEF.stats }, ds: { ...DEF.ds } }; } })();
const save = () => { try { localStorage.setItem('craterclash', JSON.stringify(S)); } catch { /* private mode: play on */ } };
const A = () => window.rgAuth || { onSite: false, user: null };

// the day comes from the server clock, falling back to the device clock offline
let skew = 0;
const timeReady = Promise.race([
  fetch('https://rank-game.com/api/time', { cache: 'no-store' }).then((r) => r.json()).then((j) => { if (Math.abs(j.now - Date.now()) < 3 * 864e5) skew = j.now - Date.now(); }).catch(() => {}),
  sleep(1500),
]);
const today = () => new Date(Date.now() + skew).toISOString().slice(0, 10);
const dayNumber = (k) => Math.floor((Date.parse(k) - Date.parse('2026-10-26')) / 864e5) + 1;

// ---------- seeded random ----------
function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rngOf(seed) { let a = hash(seed); return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------- sound (all synthesized, no files) ----------
let AC = null, nbuf = null;
const ac = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { /* no audio */ } } return AC; };
function tone(f0, f1, dur, type = 'square', vol = 0.1, delay = 0) {
  const c = S.muted ? null : ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, f0, f1, vol = 0.3, type = 'lowpass') {
  const c = S.muted ? null : ac(); if (!c) return;
  if (!nbuf) { nbuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;
  s.buffer = nbuf; s.loop = true; f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(c.destination); s.start(t); s.stop(t + dur);
}
const SFX = {
  shoot: () => { tone(380, 80, 0.2, 'sawtooth', 0.09); noise(0.12, 2000, 300, 0.12); },
  boom: (r) => { noise(0.25 + r / 120, 900, 60, 0.45); tone(130, 28, 0.3 + r / 200, 'sawtooth', 0.16); },
  splash: () => noise(0.35, 3000, 800, 0.22, 'bandpass'),
  cluck: () => { tone(760, 520, 0.07, 'square', 0.07); tone(700, 480, 0.07, 'square', 0.07, 0.09); },
  hit: () => tone(200, 60, 0.14, 'triangle', 0.18),
  yeet: () => tone(180, 1100, 0.45, 'sine', 0.14),
  pick: () => [660, 880, 1320].forEach((f, i) => tone(f, f, 0.08, 'square', 0.07, i * 0.07)),
  blip: () => tone(500, 700, 0.06, 'square', 0.05),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 'square', 0.08, i * 0.12)),
  lose: () => [400, 330, 262, 196].forEach((f, i) => tone(f, f * 0.9, 0.2, 'triangle', 0.1, i * 0.16)),
  tick: () => tone(1000, 900, 0.04, 'square', 0.04),
  nuke: () => { tone(90, 400, 0.8, 'sawtooth', 0.12); noise(0.6, 600, 100, 0.15); },
  hiss: () => noise(0.9, 4000, 1500, 0.2, 'highpass'),
};

// ---------- maps ----------
const MAPS = {
  hills: { name: 'Rolling Hills', icon: '🌄', sky: ['#5ec8ff', '#d9f4ff'], hill: '#2c7a57', dirt: ['#9a6532', '#4a2a16'], edge: ['#4fb53b', '#86e05c'], water: true },
  islands: { name: 'Island Hopping', icon: '🏝️', sky: ['#ffb86b', '#fff1c4'], hill: '#c0703a', dirt: ['#d9b26a', '#8a6a30'], edge: ['#e8d08a', '#fff0b8'], water: true },
  canyon: { name: 'Red Canyon', icon: '🏜️', sky: ['#ff9a5c', '#ffe3a8'], hill: '#7a3a4a', dirt: ['#c0643a', '#5a2418'], edge: ['#d98a4a', '#f2b878'], water: true },
  mountain: { name: 'Mount Boom', icon: '🌋', sky: ['#4a6ab0', '#cfe0ff'], hill: '#5a6a90', dirt: ['#8a8a96', '#3c3c4a'], edge: ['#ffffff', '#e8f0ff'], water: true },
  abyss: { name: 'The Abyss', icon: '🕳️', sky: ['#2a1d5a', '#a05aa8'], hill: '#2a2058', dirt: ['#7a6a9a', '#2f2655'], edge: ['#38e6d0', '#9bfff0'], water: false },
};
const MAP_IDS = Object.keys(MAPS);

// ---------- terrain (a bitmap + a solid mask) ----------
const cv = $('#cv'), g = cv.getContext('2d');
const tc = document.createElement('canvas'); tc.width = W; tc.height = H; const tg = tc.getContext('2d');
const mask = new Uint8Array(W * H);
const solid = (x, y) => { x |= 0; y |= 0; if (x < 0 || x >= W || y < 0 || y >= H) return false; return mask[y * W + x] === 1; };

  $('#fire').disabled = !me || G.state !== 'aim' || G.turn !== t;
  if (!me) { box.innerHTML = ''; return; }
  box.innerHTML = t.kit.map((i, n) => { const w = WEAPONS[i]; return `<button class="wp ${i === t.wi ? 'on' : ''} ${t.ammo[i] <= 0 ? 'out' : ''}" data-wi="${i}" title="${n + 1}: ${w.name}">${w.icon}${t.ammo[i] === Infinity ? '' : `<small>${t.ammo[i]}</small>`}</button>`; }).join('');
}
const myTurn = () => G && !paused && !G.over && G.state === 'aim' && !G.turn.ai && !G.turn.remote;
$('#bar').addEventListener('pointerdown', (e) => {
  const h = e.target.closest('[data-hold]'); if (h) { hold.add(h.dataset.hold); try { h.setPointerCapture(e.pointerId); } catch { /* ignore */ } ac(); return; }
  const w = e.target.closest('[data-wi]'); if (w && myTurn()) { const t = G.turn, i = +w.dataset.wi; if (t.ammo[i] > 0) { t.wi = i; syncBar(); SFX.blip(); } }
});
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) $('#bar').addEventListener(ev, (e) => { const h = e.target.closest('[data-hold]'); if (h) hold.delete(h.dataset.hold); });

$('#menuBtn').onclick = () => pauseSheet();
$('#zoomBtn').onclick = () => { if (G) cam.over = !cam.over; };
$('#emos').onclick = (e) => { const b = e.target.closest('[data-emo]'); if (!b || !G || G.mode !== 'online') return; say(G.tanks[G.me], b.dataset.emo); netSend({ k: 'emo', e: b.dataset.emo }); };

  const dx = px - t.x, dy = t.y - 13 - py; if (Math.hypot(dx, dy) < 12) return;
  const a = Math.atan2(dy, dx) * 180 / Math.PI; t.f = dx >= 0 ? 1 : -1; t.el = Math.max(2, Math.min(88, dx >= 0 ? a : 180 - a)); if (dy < 0) t.el = 2;
  t.pw = Math.max(5, Math.min(100, Math.hypot(dx, dy) * 0.3));

addEventListener('keydown', (e) => {

  await pc.setRemoteDescription({ type: 'offer', sdp: s.o }); await pc.setLocalDescription(await pc.createAnswer()); await gathered(pc);
  st.peer = peer;
  await mutate((r) => { if (!r.sig[pid]) return null; r.sig[pid].a = pc.localDescription.sdp; r.phase = 'play'; return r; });
  answering = false;
}
N.joinRoom = async (c, name) => {
  await N.leave(true);
  const ref = doc(db, ROOMS, c), pc = new RTCPeerConnection(ICE), peer = { pc, r: pc.createDataChannel('r') };
  await pc.setLocalDescription(await pc.createOffer()); await gathered(pc);
  let ok = false, why = 'Room not found';
  try {
    await runTransaction(db, async (t) => {
      const s = await t.get(ref), r = s.exists() ? s.data() : null;
      if (!r || Date.now() - r.created > 7200e3) return;
      if (Object.keys(r.players).length >= 2 || r.phase !== 'lobby') { why = 'That room is full'; return; }
      r.players[meId] = { n: name }; r.sig[meId] = { o: pc.localDescription.sdp }; t.set(ref, r); ok = true;
    });
  } catch (e) { console.warn(e); why = 'Could not connect. Check your internet.'; }
  if (!ok) { pc.close(); return why; }
  Object.assign(st, { on: true, host: false, pub: false, code: c, peer, open: false }); location.hash = c;
  wire(peer);
  st.unsub = onSnapshot(ref, async (s) => {
    st.room = s.data(); if (!st.room) return;
    const a = st.room.sig?.[meId]?.a; if (a && !pc.remoteDescription) await pc.setRemoteDescription({ type: 'answer', sdp: a });
    if (!st.room.players[st.room.host]) { N.onclose?.(); N.leave(true); }
    changed();
  });
  setTimeout(() => { if (st.on && st.code === c && peer.r.readyState !== 'open') { N.fail?.("Couldn't connect to that player (some networks block direct connections)."); N.leave(true); } }, 16000);
  changed(); return '';
};
N.quickMatch = async (name) => {
  try {
    const snap = await getDocs(query(collection(db, ROOMS), where('pub', '==', true), where('phase', '==', 'lobby'), limit(15)));
    const open = snap.docs.map((d) => d.data()).filter((r) => Date.now() - r.created < 20 * 60e3 && Object.keys(r.players).length === 1 && !r.players[meId]);
    for (const r of open) if (!(await N.joinRoom(r.code, name))) return true;
  } catch (e) { console.warn(e); }
  return N.createRoom(true, name);
};
N.leave = async (quiet) => {
  if (!st.on) return;
  const c = st.code, host = st.host;
  st.on = false; st.open = false; st.unsub?.(); st.unsub = null;
  try { st.peer?.pc.close(); } catch { /* already closed */ }
  st.peer = null; st.room = null;
  if (c) { st.code = c; await mutate((r) => { delete r.players[meId]; delete r.sig[meId]; if (host) r.phase = 'play'; return r; }); st.code = ''; }
  history.replaceState(null, '', location.pathname + location.search);
  if (!quiet) changed();
};
addEventListener('pagehide', () => { if (st.on) N.leave(true); });
dispatchEvent(new Event('craternet'));
</script>
